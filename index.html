us, last-minute change of plans, even if the change sounds fun.\",\n            \"You care deeply about personal recognition and title, and you enjoy being the center of attention when you succeed.\",\n            \"You find immense satisfaction in working with your hands, building physical objects, or fixing mechanical things.\",\n            \"When faced with a new statement or \\\"fact,\\\" your default mode is to research the data and verify the evidence yourself.\",\n            \"You would gladly take on the role of organizing, leading, and managing a large group project to ensure it succeeds.\",\n            \"Expressing yourself creatively\u2014through music, art, writing, or design\u2014is an essential daily need for you, not just a casual hobby.\",\n            \"You are the person your friends always turn to when they need a mediator, an empathetic listener, or help navigating a conflict.\",\n            \"You genuinely love working with data, spreadsheets, mathematical patterns, or highly structured schedules.\",\n            \"You frequently experience a deep sense of awe and gratitude when looking at a sunset, listening to great music, or seeing a brilliant idea come together.\",\n            \"You are highly driven by a sense of justice; you cannot stand by quietly if you see someone being treated unfairly.\",\n            \"You place a massive value on lifelong learning, constantly diving down rabbit holes to master new, random skills.\",\n            \"Forgiveness comes easily to you; you believe holding onto a grudge is a waste of your personal mental energy.\",\n            \"You often feel a deep longing for \\\"something more\\\" or a sense that your current environment is too small for your ultimate potential.\",\n            \"You value your personal freedom and independence far more than fitting into traditional expectations or societal norms.\",\n            \"You have a habit of looking past people's flaws or rough interiors to find the hidden good or potential inside them.\",\n            \"You are highly protective of your family or community, and you would gladly make major personal sacrifices to keep them safe.\",\n            \"Curiosity gets the best of you; if a door says \\\"Do Not Enter,\\\" it makes you want to open it even more.\",\n            \"You rely heavily on your quick wit, sharp mind, and resourcefulness to get yourself out of tough or unexpected situations.\",\n            \"You love daydreaming about the future and planning big, ambitious goals, sometimes missing what is happening right in front of you.\",\n            \"You believe that rules and traditions exist for a good reason, and you find comfort in honoring duty and heritage.\",\n            \"You are naturally highly observant, often noticing the subtle emotional shifts or hidden details in a room that everyone else misses.\",\n            \"You speak your mind directly and honestly, even if it risks making waves or making people uncomfortable.\",\n            \"You thrive in high-stakes, fast-paced situations and love the thrill of competition or taking a bold risk.\",\n            \"You view yourself as a steady, reliable anchor for the people around you\u2014calm, grounded, and fiercely protective.\",\n            \"You prefer to observe quietly from the perimeter before jumping into a social situation or making a big decision.\",\n            \"Harmonious, cooperative group dynamics matter more to you than individual victory or being \\\"right.\\\"\",\n            \"When a massive problem hits, your immediate instinct is to charge directly at it and tackle it head-on, rather than strategizing from afar.\",\n            \"You have a very high tolerance for solitude; you can spend days alone working on a project without feeling lonely.\",\n            \"You are incredibly adaptive; you can easily blend into completely different social circles or quickly pivot when your environment changes.\",\n            \"You are highly expressive with your body language, voice, or facial expressions\u2014people can usually read exactly what you are thinking.\",\n            \"You prefer to specialize deeply in one specific domain or skill rather than being a \\\"jack-of-all-trades\\\" who knows a little bit of everything.\",\n            \"You are naturally hyper-aware of your physical surroundings, instantly tracking movement, sounds, or changes in your environment.\"\n        ];\n\n        const HISTORICAL_PERSONAS = [\n            { name: \"Ser Alistair\", title: \"Iron Dragon Warden\", primary: \"valour\", secondary: \"resolve\" },\n            { name: \"Beatrix\", title: \"Citadel High Chronicler\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Caspian\", title: \"Azure Sea Envoy\", primary: \"grace\", secondary: \"wisdom\" },\n            { name: \"Darith\", title: \"Mountain Anchor Wall\", primary: \"resolve\", secondary: \"valour\" },\n            { name: \"Elowen\", title: \"Grove Cottage Healer\", primary: \"grace\", secondary: \"resolve\" },\n            { name: \"Faelan\", title: \"Sylvan Veil Ranger\", primary: \"resolve\", secondary: \"wisdom\" },\n            { name: \"Genevieve\", title: \"Royal Court Orator\", primary: \"grace\", secondary: \"valour\" },\n            { name: \"Hadrian\", title: \"Imperial Architect\", primary: \"wisdom\", secondary: \"valour\" },\n            { name: \"Isolde\", title: \"Dreamweaver Weaver\", primary: \"grace\", secondary: \"wisdom\" },\n            { name: \"Jorund\", title: \"Volcanic Forge Master\", primary: \"resolve\", secondary: \"valour\" },\n            { name: \"Kaelen\", title: \"Celestial Astrologer\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Lysandra\", title: \"Justiciar of the Shield\", primary: \"valour\", secondary: \"wisdom\" },\n            { name: \"Marek\", title: \"Crimson Spire Vanguard\", primary: \"valour\", secondary: \"resolve\" },\n            { name: \"Nesta\", title: \"Harp Virtuoso of Court\", primary: \"grace\", secondary: \"resolve\" },\n            { name: \"Orion\", title: \"Star Cartographer\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Padraig\", title: \"Forest Warden Druid\", primary: \"resolve\", secondary: \"grace\" },\n            { name: \"Quentin\", title: \"Coin Master Scholar\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Lady Rowena\", title: \"Gilded Banner Envoy\", primary: \"grace\", secondary: \"valour\" },\n            { name: \"Sigurd\", title: \"Iron Shield Leader\", primary: \"valour\", secondary: \"resolve\" },\n            { name: \"Talia\", title: \"Sanctuary Apothecary\", primary: \"wisdom\", secondary: \"grace\" },\n            { name: \"Brother Uther\", title: \"Monastic Stonecarver\", primary: \"resolve\", secondary: \"wisdom\" },\n            { name: \"Valerius\", title: \"Colosseum Gladiator King\", primary: \"valour\", secondary: \"grace\" },\n            { name: \"Willa\", title: \"Northern Navigator\", primary: \"resolve\", secondary: \"wisdom\" },\n            { name: \"Xander\", title: \"Silver-Tongued Duelist\", primary: \"valour\", secondary: \"grace\" },\n            { name: \"Yvaine\", title: \"Astral Spire Oracle\", primary: \"wisdom\", secondary: \"grace\" },\n            { name: \"Zephyr\", title: \"Wandering Troubadour\", primary: \"grace\", secondary: \"valour\" },\n            { name: \"Aveline\", title: \"Garrison Shield Guardian\", primary: \"resolve\", secondary: \"valour\" },\n            { name: \"Boran\", title: \"Grand Bronze Founder\", primary: \"resolve\", secondary: \"resolve\" },\n            { name: \"Clarissa\", title: \"Silken Tapestry Artisan\", primary: \"grace\", secondary: \"resolve\" },\n            { name: \"Dragan\", title: \"Crimson Dragon Hunter\", primary: \"valour\", secondary: \"resolve\" },\n            { name: \"Eldrin\", title: \"Ancient Spire Runescribe\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Fiona\", title: \"Dawn Mediation Envoy\", primary: \"grace\", secondary: \"wisdom\" },\n            { name: \"Gideon\", title: \"Citadel Oathkeeper\", primary: \"resolve\", secondary: \"valour\" },\n            { name: \"Helena\", title: \"Royal Glassblower\", primary: \"grace\", secondary: \"resolve\" },\n            { name: \"Ivor\", title: \"Subterranean Shaft Miner\", primary: \"resolve\", secondary: \"resolve\" },\n            { name: \"Juliana\", title: \"Imperial Archivist\", primary: \"wisdom\", secondary: \"grace\" },\n            { name: \"Karr\", title: \"Borderlands Cavalry Raider\", primary: \"valour\", secondary: \"resolve\" },\n            { name: \"Lenore\", title: \"Lunar Botanist\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Myrran\", title: \"Oasis Sanctuary Mediator\", primary: \"grace\", secondary: \"resolve\" },\n            { name: \"Nolan\", title: \"Masonry Bridge Engineer\", primary: \"resolve\", secondary: \"wisdom\" },\n            { name: \"Odelia\", title: \"Palace Rose Cultivator\", primary: \"grace\", secondary: \"resolve\" },\n            { name: \"Percival\", title: \"Holy Grail Quest Knight\", primary: \"valour\", secondary: \"wisdom\" },\n            { name: \"Rhea\", title: \"Wild Foothills Falconer\", primary: \"resolve\", secondary: \"valour\" },\n            { name: \"Soren\", title: \"Silent Archive Keeper\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Theron\", title: \"Deep Greenwood Tracker\", primary: \"resolve\", secondary: \"wisdom\" },\n            { name: \"Ulrich\", title: \"Grand Iron Garrison Marshal\", primary: \"valour\", secondary: \"resolve\" },\n            { name: \"Vespera\", title: \"Midnight Shadow Scribe\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Wulfgar\", title: \"Berserker Chief of the North\", primary: \"valour\", secondary: \"resolve\" },\n            { name: \"Yolanda\", title: \"Royal Velvet Weaver\", primary: \"grace\", secondary: \"resolve\" },\n            { name: \"Zarian\", title: \"Crown Master Gemcutter\", primary: \"grace\", secondary: \"resolve\" },\n            { name: \"Alaric\", title: \"Fortress Shield Captain\", primary: \"valour\", secondary: \"resolve\" },\n            { name: \"Brunhilda\", title: \"Northlands Valkyrie Envoy\", primary: \"valour\", secondary: \"resolve\" },\n            { name: \"Cedric\", title: \"Sovereign High Arbiter\", primary: \"grace\", secondary: \"wisdom\" },\n            { name: \"Dagmar\", title: \"Longship Navigator\", primary: \"resolve\", secondary: \"valour\" },\n            { name: \"Elisa\", title: \"Valley Healer Nun\", primary: \"grace\", secondary: \"resolve\" },\n            { name: \"Finneas\", title: \"Exchequer Ledger Clerk\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Gisela\", title: \"Grand Vineyard Warden\", primary: \"resolve\", secondary: \"grace\" },\n            { name: \"Huxley\", title: \"Imperial Clockmaker\", primary: \"wisdom\", secondary: \"resolve\" },\n            { name: \"Inara\", title: \"Desert Mirage Dancer\", primary: \"grace\", secondary: \"valour\" },\n            { name: \"Kaelith\", title: \"Observatory Astronomer\", primary: \"wisdom\", secondary: \"resolve\" }\n        ];\n\n        const calculateAlignmentCrest = (userAnswers) => {\n            const valourQ = [3, 9, 12, 17, 29, 30, 34];\n            const wisdomQ = [0, 6, 11, 15, 18, 28, 32];\n            const graceQ  = [1, 13, 14, 16, 22, 33, 37];\n            const resolveQ = [2, 4, 8, 10, 21, 23, 27, 35, 39];\n\n            const getScore = (indices) => indices.reduce((sum, idx) => sum + userAnswers[idx], 0) / (indices.length * 5);\n\n            const sValour = getScore(valourQ);\n            const sWisdom = getScore(wisdomQ);\n            const sGrace = getScore(graceQ);\n            const sResolve = getScore(resolveQ);\n\n            const dimensions = [\n                { name: 'Valour', score: sValour, primaryColor: 'Gules', secondaryColor: 'Or', metals: ['or'], colors: ['gules', 'sable'] },\n                { name: 'Wisdom', score: sWisdom, primaryColor: 'Azure', secondaryColor: 'Purpure', metals: ['argent'], colors: ['azure', 'purpure'] },\n                { name: 'Grace', score: sGrace, primaryColor: 'Vert', secondaryColor: 'Purpure', metals: ['or'], colors: ['vert', 'purpure'] },\n                { name: 'Resolve', score: sResolve, primaryColor: 'Sable', secondaryColor: 'Argent', metals: ['argent'], colors: ['sable', 'gules'] }\n            ];\n\n            dimensions.sort((a, b) => b.score - a.score);\n            const primary = dimensions[0];\n            const secondary = dimensions[1];\n\n            const qChaos = userAnswers[4]; \n            const qCuriosity = userAnswers[24]; \n            const qVigilance = userAnswers[23]; \n            const qAesthetics = userAnswers[1]; \n            const qSolitude = userAnswers[35]; \n            const qStructure = userAnswers[15]; \n            const qCompetitive = userAnswers[30]; \n            const qObserver = userAnswers[32]; \n\n            // --- LAYER 1: THE FIELD ---\n            let field = \"\";\n            let fieldColor1 = primary.primaryColor;\n            let fieldColor2 = secondary.primaryColor;\n\n            if (fieldColor1 === fieldColor2) {\n                fieldColor2 = (fieldColor1 === 'Gules' || fieldColor1 === 'Sable') ? 'Argent' : 'Or';\n            }\n\n            if (qStructure === 5) {\n                const patterns = ['chequy', 'lozengy', 'paly of six', 'barry of six'];\n                const selectedPattern = patterns[Math.floor(sWisdom * 4) % patterns.length];\n                field = `${selectedPattern} ${fieldColor1.toLowerCase()} and ${primary.metals[0]}`;\n            } else if (qAesthetics === 5) {\n                const semyType = primary.name === 'Valour' ? 'semy of mullets' : primary.name === 'Wisdom' ? 'semy of stars' : primary.name === 'Grace' ? 'semy of roses' : 'semy of cross-crosslets';\n                field = `${fieldColor1.toLowerCase()} ${semyType} ${primary.metals[0]}`;\n            } else if (Math.abs(primary.score - secondary.score) < 0.08) {\n                const divisions = ['party per pale', 'party per fess', 'party per chevron', 'party per bend'];\n                const selectedDiv = divisions[Math.floor((sValour + sGrace) * 4) % divisions.length];\n                field = `${selectedDiv} ${fieldColor1.toLowerCase()} and ${fieldColor2.toLowerCase()}`;\n            } else {\n                field = fieldColor1;\n            }\n\n            // --- LAYER 2: THE ORDINARY ---\n            let ordinary = \"\";\n            let ordinaryLine = \"\";\n\n            if (qChaos === 1 || qChaos === 2) {\n                const lines = ['engrailed', 'dancetty', 'wavy', 'nebully', 'invected'];\n                ordinaryLine = \" \" + lines[Math.floor(sResolve * 5) % lines.length];\n            }\n\n            let ordinaryName = \"\";\n            if (sResolve > 0.6) {\n                ordinaryName = sResolve > 0.8 ? 'cross' : 'chevron';\n            } else if (sWisdom > 0.6) {\n                ordinaryName = 'bend';\n            } else if (sGrace > 0.6) {\n                ordinaryName = 'saltire';\n            } else if (sValour > 0.6) {\n                ordinaryName = 'fess';\n            }\n\n            let ordinaryMetal = primary.metals[0];\n            if (field.toLowerCase().includes(ordinaryMetal)) {\n                ordinaryMetal = primary.metals[0] === 'or' ? 'argent' : 'or';\n            }\n\n            if (ordinaryName) {\n                ordinary = `, a ${ordinaryName}${ordinaryLine} ${ordinaryMetal}`;\n            }\n\n            // --- LAYER 3: CHARGES ---\n            let chargeType = \"\";\n            if (primary.name === 'Valour') {\n                const charges = ['lion', 'eagle', 'griffin', 'falcon'];\n                chargeType = charges[Math.floor(sValour * 4) % charges.length];\n            } else if (primary.name === 'Wisdom') {\n                const charges = ['owl', 'serpent', 'book', 'mullet'];\n                chargeType = charges[Math.floor(sWisdom * 4) % charges.length];\n            } else if (primary.name === 'Grace') {\n                const charges = ['fleur-de-lys', 'rose', 'harp', 'dove'];\n                chargeType = charges[Math.floor(sGrace * 4) % charges.length];\n            } else {\n                const charges = ['tower', 'wolf', 'boar', 'key'];\n                chargeType = charges[Math.floor(sResolve * 4) % charges.length];\n            }\n\n            let chargeQuantity = \"a\";\n            let pluralSuffix = \"\";\n            if (qSolitude <= 2) {\n                chargeQuantity = \"three\";\n                pluralSuffix = \"s\";\n            }\n\n            let attitude = \"\";\n            if (['lion', 'wolf', 'griffin', 'boar'].includes(chargeType)) {\n                if (qCompetitive === 5) {\n                    attitude = \" rampant\";\n                } else if (qObserver === 5) {\n                    attitude = \" statant guardant\";\n                } else {\n                    attitude = \" passant\";\n                }\n            } else if (['eagle', 'falcon', 'dove'].includes(chargeType)) {\n                if (qCompetitive === 5) {\n                    attitude = \" displayed\";\n                } else {\n                    attitude = \" close\";\n                }\n            }\n\n            const qFreedom = userAnswers[21];\n            if (qFreedom === 5) {\n                if (['lion', 'wolf', 'griffin', 'boar'].includes(chargeType)) {\n                    attitude += \" crowned\";\n                } else {\n                    attitude += \" winged\";\n                }\n            }\n\n            let chargeMetal = primary.metals[0] === 'or' ? 'argent' : 'or';\n            if (ordinaryMetal === chargeMetal) {\n                chargeMetal = ordinaryMetal === 'or' ? 'argent' : 'or';\n            }\n            if (field.toLowerCase().includes(chargeMetal)) {\n                chargeMetal = chargeMetal === 'or' ? 'gules' : 'azure';\n            }\n\n            let chargePhrase = \"\";\n            if (chargeQuantity === \"three\") {\n                chargePhrase = `, three ${chargeType}${pluralSuffix}${attitude} ${chargeMetal}`;\n                if (ordinary) {\n                    chargePhrase = ` between three ${chargeType}${pluralSuffix}${attitude} ${chargeMetal}`;\n                }\n            } else {\n                chargePhrase = `, ${chargeQuantity} ${chargeType}${attitude} ${chargeMetal}`;\n                if (ordinary) {\n                    chargePhrase = ` overall ${chargeQuantity} ${chargeType}${attitude} ${chargeMetal}`;\n                }\n            }\n\n            // --- LAYER 4: HISTORICAL SUB-CHARGES & PERIPHERALS ---\n            let canton = \"\";\n            if (qCuriosity === 5) {\n                const cantonTinctures = ['ermine', 'gules', 'sable', 'or'];\n                canton = `, a canton ${cantonTinctures[Math.floor(sWisdom * 4) % cantonTinctures.length]}`;\n            }\n\n            let bordure = \"\";\n            if (qVigilance === 5) {\n                const bordureTincture = primary.metals[0] === 'or' ? 'argent' : 'or';\n                bordure = `, a bordure ${bordureTincture}`;\n            }\n\n            const finalBlazon = `${field}${ordinary}${chargePhrase}${canton}${bordure}`;\n\n            // Segmented dynamic descriptions\n            const fieldExplanation = `The background utilizes \"${field.replace(/,/g, '')}.\" This spatial structure forms the base layer balancing your dominant alignment of ${primary.name.toUpperCase()} with adjacent cognitive paths.`;\n            const ordinaryExplanation = ordinary \n                ? `A structural \"${ordinaryName}\" ordinary featuring a ${ordinaryLine ? ordinaryLine : 'flat'} margin cuts cleanly across the canvas, representing how you manage boundaries and structural parameters.`\n                : `Your traits bypass standard split geometric separators, choosing instead to focus all visual energy onto the core charges.`;\n            const chargeExplanation = `The shield's focal point features ${chargeQuantity} ${chargeType}${attitude} in ${chargeMetal}, expressing the direct translation of your values into actions.`;\n\n            return {\n                title: `Crest of ${primary.name} and ${secondary.name}`,\n                blazon: finalBlazon.charAt(0).toUpperCase() + finalBlazon.slice(1),\n                tinctureExplanation: fieldExplanation,\n                chargesExplanation: ordinaryExplanation,\n                overallAnalysis: chargeExplanation,\n                scores: {\n                    valour: Math.round(sValour * 100),\n                    wisdom: Math.round(sWisdom * 100),\n                    grace: Math.round(sGrace * 100),\n                    resolve: Math.round(sResolve * 100)\n                }\n            };\n        };\n\n        const generateHistoricalDatabase = () => {\n            const valourQ = [3, 9, 12, 17, 29, 30, 34];\n            const wisdomQ = [0, 6, 11, 15, 18, 28, 32];\n            const graceQ  = [1, 13, 14, 16, 22, 33, 37];\n            const resolveQ = [2, 4, 8, 10, 21, 23, 27, 35, 39];\n\n            return HISTORICAL_PERSONAS.map((p, pIdx) => {\n                const simulatedAnswers = Array(40).fill(3).map((v, qIdx) => {\n                    // Seeded random-like logic based on indices to guarantee stable profiles\n                    const seedVal = (pIdx * 7 + qIdx * 13) % 5;\n                    let baseline = 3;\n\n                    if (p.primary === \"valour\" && valourQ.includes(qIdx)) baseline = 4 + (seedVal % 2);\n                    else if (p.primary === \"wisdom\" && wisdomQ.includes(qIdx)) baseline = 4 + (seedVal % 2);\n                    else if (p.primary === \"grace\" && graceQ.includes(qIdx)) baseline = 4 + (seedVal % 2);\n                    else if (p.primary === \"resolve\" && resolveQ.includes(qIdx)) baseline = 4 + (seedVal % 2);\n\n                    if (p.secondary === \"valour\" && valourQ.includes(qIdx)) baseline = Math.max(baseline, 3 + (seedVal % 2));\n                    else if (p.secondary === \"wisdom\" && wisdomQ.includes(qIdx)) baseline = Math.max(baseline, 3 + (seedVal % 2));\n                    else if (p.secondary === \"grace\" && graceQ.includes(qIdx)) baseline = Math.max(baseline, 3 + (seedVal % 2));\n                    else if (p.secondary === \"resolve\" && resolveQ.includes(qIdx)) baseline = Math.max(baseline, 3 + (seedVal % 2));\n\n                    // Conflicting traits mapped down slightly\n                    if (p.primary === \"valour\" && graceQ.includes(qIdx)) baseline = Math.max(1, baseline - 2);\n                    if (p.primary === \"wisdom\" && valourQ.includes(qIdx)) baseline = Math.max(1, baseline - 1);\n\n                    return Math.max(1, Math.min(5, baseline));\n                });\n\n                const compiled = calculateAlignmentCrest(simulatedAnswers);\n\n                return {\n                    id: `historical-${pIdx}`,\n                    title: `${p.name}, ${p.title}`,\n                    blazon: compiled.blazon,\n                    answers: simulatedAnswers,\n                    tinctureExplanation: compiled.tinctureExplanation,\n                    chargesExplanation: compiled.chargesExplanation,\n                    overallAnalysis: compiled.overallAnalysis,\n                    scores: compiled.scores,\n                    dominant: p.primary\n                };\n            });\n        };\n\n        const SEEDED_ARCHIVES = generateHistoricalDatabase();\n\n        function App() {\n            const [currentMode, setCurrentMode] = useState('create'); \n            const [currentStep, setCurrentStep] = useState('intro'); \n            const [answers, setAnswers] = useState(Array(40).fill(3)); \n            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);\n            const [loading, setLoading] = useState(false);\n            const [loadingStep, setLoadingStep] = useState('');\n            const [generationResult, setGenerationResult] = useState(null);\n            const [chosenEffect, setChosenEffect] = useState('shiny');\n            const [selectedLibraryItem, setSelectedLibraryItem] = useState(SEEDED_ARCHIVES[0]);\n            const [toast, setToast] = useState(null);\n            const [searchTerm, setSearchTerm] = useState('');\n            const [filterTrait, setFilterTrait] = useState('all');\n\n            // Persistent LocalStorage Loader for library records\n            const [libraryData, setLibraryData] = useState(() => {\n                try {\n                    const saved = localStorage.getItem(\"armorial_records_v2\");\n                    return saved ? JSON.parse(saved) : [];\n                } catch (e) {\n                    console.error(\"Local storage read failed:\", e);\n                    return [];\n                }\n            });\n\n            const showToast = (message) => {\n                setToast(message);\n                setTimeout(() => setToast(null), 4000);\n            };\n\n            const generateBlazonFromAnswers = () => {\n                setLoading(true);\n                setLoadingStep(\"Processing alignments through geometric matrices...\");\n                \n                setTimeout(() => {\n                    const localCrest = calculateAlignmentCrest(answers);\n                    setGenerationResult(localCrest);\n                    setCurrentStep('result');\n                    setLoading(false);\n                    showToast(\"\ud83c\udff0 Local Scribe engine has aligned and rendered your crest!\");\n                }, 1200);\n            };\n\n            const handleSaveCurrentCrest = () => {\n                if (!generationResult) return;\n                const payload = {\n                    id: 'custom-' + Date.now(),\n                    title: generationResult.title,\n                    blazon: generationResult.blazon,\n                    answers: [...answers],\n                    tinctureExplanation: generationResult.tinctureExplanation,\n                    chargesExplanation: generationResult.chargesExplanation,\n                    overallAnalysis: generationResult.overallAnalysis,\n                    scores: generationResult.scores,\n                    dominant: 'custom'\n                };\n                const updatedRecords = [payload, ...libraryData];\n                setLibraryData(updatedRecords);\n                localStorage.setItem(\"armorial_records_v2\", JSON.stringify(updatedRecords));\n                showToast(\"\ud83c\udff0 Saved this coat of arms to your Hall of Records!\");\n                setSelectedLibraryItem(payload);\n                setCurrentMode('library');\n            };\n\n            const handleDeleteCrest = (id) => {\n                const filtered = libraryData.filter(item => item.id !== id);\n                setLibraryData(filtered);\n                localStorage.setItem(\"armorial_records_v2\", JSON.stringify(filtered));\n                showToast(\"\ud83d\uddd1\ufe0f Record cleared from archive.\");\n                if (selectedLibraryItem && selectedLibraryItem.id === id) {\n                    setSelectedLibraryItem(SEEDED_ARCHIVES[0]);\n                }\n            };\n\n            const handleCopyBlazon = (blazonText) => {\n                const dummy = document.createElement(\"textarea\");\n                document.body.appendChild(dummy);\n                dummy.value = blazonText;\n                dummy.select();\n                document.execCommand('copy');\n                document.body.removeChild(dummy);\n                showToast(\"\ud83d\udccb Blazon syntax copied! Paste it into Drawshield.\");\n            };\n\n            const handleQuickAutofill = () => {\n                setAnswers(answers.map(() => Math.floor(Math.random() * 5) + 1));\n                setCurrentQuestionIdx(39);\n                showToast(\"\u26a1 Quick-attuned! You are now at the final query.\");\n            };\n\n            const getDrawshieldUrl = (blazon, style = 'shiny') => {\n                return `https://drawshield.net/include/drawshield.php?blazon=${encodeURIComponent(blazon.replace(/[#?;%]/g, ''))}&outputformat=png&size=400&effect=${style}`;\n            };\n\n            const combinedDatabase = useMemo(() => {\n                return [...libraryData, ...SEEDED_ARCHIVES];\n            }, [libraryData]);\n\n            const filteredDatabase = useMemo(() => {\n                return combinedDatabase.filter(item => {\n                    const matchesSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase()) || \n                                          item.blazon.toLowerCase().includes(searchTerm.toLowerCase());\n                    const matchesFilter = filterTrait === 'all' || item.dominant === filterTrait;\n                    return matchesSearch && matchesFilter;\n                });\n            }, [combinedDatabase, searchTerm, filterTrait]);\n\n            return (\n                <div className=\"min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-amber-500 selection:text-slate-950\">\n                    <div className=\"h-2 bg-gradient-to-r from-amber-600 via-yellow-400 to-amber-600 w-full shadow-lg\"><\/div>\n                    \n                    <div className=\"bg-slate-900 border-b border-slate-800 text-xs text-slate-400 px-4 py-2.5 flex justify-between items-center gap-2 flex-wrap\">\n                        <div className=\"flex items-center gap-2\">\n                            <span className=\"w-2 h-2 rounded-full bg-emerald-500 animate-pulse\"><\/span>\n                            <span>Procedural Blazon Engine Active (Dynamic Layer Synthesizer)<\/span>\n                        <\/div>\n                        <div className=\"text-amber-500 medieval-font tracking-wider uppercase text-[10px]\">\n                            Total Records: <strong className=\"text-white\">{combinedDatabase.length} Scrolls<\/strong> Inscribed\n                        <\/div>\n                    <\/div>\n\n                    <header className=\"py-8 px-4 text-center max-w-4xl mx-auto w-full\">\n                        <h1 className=\"text-4xl md:text-5xl font-black medieval-font text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-400 mb-2 drop-shadow-md\">\n                            The Scribe's Armorial\n                        <\/h1>\n                        <p className=\"text-slate-400 max-w-lg mx-auto text-xs md:text-sm\">\n                            An interactive pattern engine mapping the 40 realms of human psyche into majestic coats of arms for DrawShield.net\n                        <\/p>\n                        <nav className=\"mt-6 flex justify-center gap-2 max-w-xs mx-auto bg-slate-900 p-1.5 rounded-xl border border-slate-800 shadow-xl\">\n                            <button onClick={() => { setCurrentMode('create'); setCurrentStep('intro'); }} className={`flex-1 py-2 px-4 rounded-lg text-xs md:text-sm font-medium transition-all duration-200 ${currentMode === 'create' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-slate-200'}`}>\ud83d\udee1\ufe0f Create Crest<\/button>\n                            <button onClick={() => { setCurrentMode('library'); }} className={`flex-1 py-2 px-4 rounded-lg text-xs md:text-sm font-medium transition-all duration-200 ${currentMode === 'library' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-slate-200'}`}>\ud83d\udcd6 Hall of Records<\/button>\n                        <\/nav>\n                    <\/header>\n\n                    <main className=\"flex-grow max-w-6xl w-full mx-auto px-4 pb-16\">\n                        {loading && (\n
