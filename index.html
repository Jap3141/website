me=\"text-[10px] text-slate-500 font-mono block mb-1\">Blazon Syntax<\/label>\n                                                        <p className=\"text-amber-300 font-mono text-[11px] break-all mb-2 leading-relaxed select-all\">{selectedLibraryItem.blazon}<\/p>\n                                                        <button \n                                                            onClick={() => handleCopyBlazon(selectedLibraryItem.blazon)} \n                                                            className=\"w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] rounded font-bold border border-slate-700/60 transition-colors\"\n                                                        >\n                                                            \ud83d\udccb Copy Blazon Syntax\n                                                        <\/button>\n                                                    <\/div>\n                                                    \n                                                    {/* SCORE BOARD */}\n                                                    {selectedLibraryItem.scores && (\n                                                        <div className=\"bg-slate-950/60 border border-slate-800/60 p-3 rounded-lg space-y-2\">\n                                                            <h4 className=\"text-[10px] uppercase font-mono text-slate-400 mb-1\">Psychological Dimensions<\/h4>\n                                                            \n                                                            {[\n                                                                { key: 'valour', label: '\ud83d\udd25 Valour & Command', color: 'bg-red-500' },\n                                                                { key: 'wisdom', label: '\ud83c\udf0a Wisdom & Systemics', color: 'bg-sky-500' },\n                                                                { key: 'grace', label: '\ud83c\udf3f Grace & Connection', color: 'bg-emerald-500' },\n                                                                { key: 'resolve', label: '\ud83d\udee1\ufe0f Resolve & Guard', color: 'bg-slate-400' }\n                                                            ].map(score => (\n                                                                <div key={score.key} className=\"text-[10px]\">\n                                                                    <div className=\"flex justify-between text-slate-400 font-mono mb-0.5\">\n                                                                        <span>{score.label}<\/span>\n                                                                        <span>{selectedLibraryItem.scores[score.key]}%<\/span>\n                                                                    <\/div>\n                                                                    <div className=\"w-full bg-slate-900 h-1 rounded-full overflow-hidden border border-slate-800/40\">\n                                                                        <div className={`${score.color} h-1 transition-all duration-300`} style={{ width: `${selectedLibraryItem.scores[score.key]}%` }}><\/div>\n                                                                    <\/div>\n                                                                <\/div>\n                                                            ))}\n                                                        <\/div>\n                                                    )}\n                                                <\/div>\n                                            <\/div>\n\n                                            {/* SEGMENTED LOGIC EXPLANATIONS */}\n                                            <div className=\"space-y-3.5 border-t border-slate-800 pt-4 font-sans text-xs\">\n                                                <div className=\"border-l-2 border-amber-500/40 pl-3\">\n                                                    <h4 className=\"medieval-font font-bold text-slate-300 text-[10px] uppercase tracking-wider mb-0.5\">Field Layout Pattern<\/h4>\n                                                    <p className=\"text-slate-400 leading-relaxed text-[11px]\">{selectedLibraryItem.tinctureExplanation}<\/p>\n                                                <\/div>\n                                                <div className=\"border-l-2 border-amber-500/40 pl-3\">\n                                                    <h4 className=\"medieval-font font-bold text-slate-300 text-[10px] uppercase tracking-wider mb-0.5\">Boundary Separation<\/h4>\n                                                    <p className=\"text-slate-400 leading-relaxed text-[11px]\">{selectedLibraryItem.chargesExplanation}<\/p>\n                                                <\/div>\n                                                <div className=\"border-l-2 border-amber-500/40 pl-3\">\n                                                    <h4 className=\"medieval-font font-bold text-slate-300 text-[10px] uppercase tracking-wider mb-0.5\">Primary Charge Symbol<\/h4>\n                                                    <p className=\"text-slate-400 leading-relaxed text-[11px]\">{selectedLibraryItem.overallAnalysis}<\/p>\n                                                <\/div>\n                                            <\/div>\n\n                                        <\/div>\n                                    ) : (\n                                        <div className=\"h-full flex items-center justify-center p-8 text-center text-slate-500 text-sm font-serif italic border border-dashed border-slate-800 rounded-2xl bg-slate-900/20\">\n                                            Select a historical scroll from the catalog to inspect its full character alignment parameters.\n                                        <\/div>\n                                    )}\n                                <\/div>\n\n                            <\/div>\n                        )}\n                    <\/main>\n\n                    <footer className=\"mt-auto py-8 bg-slate-950 border-t border-slate-900 text-center text-slate-600 text-xs\">\n                        <div className=\"max-w-4xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4 font-sans\">\n                            <p>\u00a9 2026 Scribe's Armorial. Compatible with DrawShield blazon parsers.<\/p>\n                            <div className=\"flex gap-4\">\n                                <a href=\"https://drawshield.net/\" target=\"_blank\" rel=\"noreferrer\" className=\"hover:text-amber-500 transition-colors\">Drawshield Website<\/a>\n                                <span className=\"text-slate-800\">|<\/span>\n                                <span className=\"text-slate-500\">Procedural Matrix Compilation<\/span>\n                            <\/div>\n                        <\/div>\n                    <\/footer>\n                <\/div>\n            );\n        }\n\n        const root = ReactDOM.createRoot(document.getElementById('root'));\n        root.render(<App />);\n    <\/script>\n<\/body>\n<\/html>", "page_2": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>The Thinking Games - Connections Atlas<\/title>\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <!-- Google Fonts: Merriweather & Inter -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300&display=swap\" rel=\"stylesheet\">\n  \n  <script>\n    tailwind.config = {\n      theme: {\n        extend: {\n          colors: {\n            royalBlue: '#0047BA',\n            royalBlueHover: '#00379A',\n            burntVermilion: '#D14124',\n            burntVermilionHover: '#B7371D',\n            deepPlum: '#72246C',\n            deepPlumHover: '#5C1D56',\n            parchment: '#F8F2DC',\n            sageGray: '#627264',\n            darkInk: '#1E2430',\n            softSlate: '#A8B0A7',\n            goldAccent: '#D7B45A',\n            mistWhite: '#FCFAF4',\n          },\n          fontFamily: {\n            serif: ['Merriweather', 'serif'],\n            sans: ['Inter', 'sans-serif'],\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <style>\n    body {\n      font-family: 'Inter', sans-serif;\n    }\n    .academic-title {\n      font-family: 'Merriweather', serif;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n    .grid-item {\n      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s, border-color 0.2s;\n    }\n    .shake {\n      animation: shake 0.35s ease-in-out;\n    }\n    @keyframes shake {\n      0%, 100% { transform: translateX(0); }\n      20%, 60% { transform: translateX(-4px); }\n      40%, 80% { transform: translateX(4px); }\n    }\n    /* Difficulty color categories matching the style guide */\n    .color-cat-0 { background-color: #0047BA; color: #ffffff; } /* Royal Blue - Puzzle */\n    .color-cat-1 { background-color: #72246C; color: #ffffff; } /* Deep Plum - Strategy */\n    .color-cat-2 { background-color: #627264; color: #ffffff; } /* Sage Gray - Exploration */\n    .color-cat-3 { background-color: #D14124; color: #ffffff; } /* Burnt Vermilion - Experimental */\n  <\/style>\n<\/head>\n<body class=\"bg-parchment text-darkInk min-h-screen flex flex-col antialiased selection:bg-[#D7B45A]/40 relative overflow-x-hidden\">\n\n  <!-- Subtle top-right constellation background motif (10% opacity) -->\n  <div class=\"absolute top-0 right-0 w-[450px] h-[450px] pointer-events-none opacity-[0.06] text-sageGray\">\n    <svg viewBox=\"0 0 100 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.3\">\n      <circle cx=\"50\" cy=\"50\" r=\"40\" />\n      <circle cx=\"50\" cy=\"50\" r=\"25\" />\n      <line x1=\"10\" y1=\"50\" x2=\"90\" y2=\"50\" />\n      <line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"90\" />\n      <line x1=\"22\" y1=\"22\" x2=\"78\" y2=\"78\" />\n      <line x1=\"22\" y1=\"78\" x2=\"78\" y2=\"22\" />\n      <polygon points=\"50,15 53,47 85,50 53,53 50,85 47,53 15,50 47,47\" fill=\"none\"/>\n    <\/svg>\n  <\/div>\n\n  <!-- Subtle bottom-left network graph motif (5% opacity) -->\n  <div class=\"absolute bottom-10 left-[-50px] w-[350px] h-[350px] pointer-events-none opacity-[0.04] text-sageGray\">\n    <svg viewBox=\"0 0 100 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.5\">\n      <circle cx=\"20\" cy=\"30\" r=\"3\" fill=\"currentColor\"/>\n      <circle cx=\"50\" cy=\"15\" r=\"3\" fill=\"currentColor\"/>\n      <circle cx=\"80\" cy=\"40\" r=\"3\" fill=\"currentColor\"/>\n      <circle cx=\"70\" cy=\"80\" r=\"3\" fill=\"currentColor\"/>\n      <circle cx=\"30\" cy=\"70\" r=\"3\" fill=\"currentColor\"/>\n      <line x1=\"20\" y1=\"30\" x2=\"50\" y2=\"15\" />\n      <line x1=\"50\" y1=\"15\" x2=\"80\" y2=\"40\" />\n      <line x1=\"80\" y1=\"40\" x2=\"70\" y2=\"80\" />\n      <line x1=\"70\" y1=\"80\" x2=\"30\" y2=\"70\" />\n      <line x1=\"30\" y1=\"70\" x2=\"20\" y2=\"30\" />\n      <line x1=\"50\" y1=\"15\" x2=\"30\" y2=\"70\" />\n      <line x1=\"80\" y1=\"40\" x2=\"30\" y2=\"70\" />\n    <\/svg>\n  <\/div>\n\n  <!-- Navigation Header (Ivory background with soft border bottom) -->\n  <header class=\"border-b border-softSlate bg-parchment py-5 px-6 sticky top-0 z-30 shadow-xs\">\n    <div class=\"max-w-[1200px] mx-auto flex items-center justify-between\">\n      <a href=\"#\" onclick=\"goHome(event)\" class=\"flex items-center space-x-3 group\">\n        <div class=\"flex -space-x-1\">\n          <span class=\"w-3.5 h-3.5 rounded-full bg-royalBlue inline-block border border-darkInk/10\"><\/span>\n          <span class=\"w-3.5 h-3.5 rounded-full bg-deepPlum inline-block border border-darkInk/10\"><\/span>\n          <span class=\"w-3.5 h-3.5 rounded-full bg-sageGray inline-block border border-darkInk/10\"><\/span>\n          <span class=\"w-3.5 h-3.5 rounded-full bg-burntVermilion inline-block border border-darkInk/10\"><\/span>\n        <\/div>\n        <span class=\"font-serif font-black tracking-wider text-darkInk text-sm sm:text-base uppercase\">\n          Jacob's Game Atlas\n        <\/span>\n      <\/a>\n      <div class=\"flex items-center space-x-3\">\n        <button id=\"nav-create-btn\" onclick=\"showSection('creator')\" class=\"text-xs sm:text-sm font-semibold text-deepPlum hover:bg-deepPlum hover:text-white border-2 border-deepPlum px-4 py-2 rounded-[12px] transition-all duration-200\">\n          \u270f\ufe0f Archive Builder\n        <\/button>\n        <button id=\"nav-how-btn\" onclick=\"openInstructionsModal()\" class=\"text-sageGray hover:text-darkInk transition-colors duration-200\" title=\"How to Play\">\n          <svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n            <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253\"><\/path>\n          <\/svg>\n        <\/button>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"flex-grow max-w-[1200px] w-full mx-auto px-6 py-10 flex flex-col justify-start relative z-10\">\n    \n    <!-- Toast System Container -->\n    <div id=\"toast-container\" class=\"fixed top-24 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-3 pointer-events-none w-full max-w-sm px-4\"><\/div>\n\n    <!-- HOME / SPLASH SCREEN -->\n    <section id=\"section-home\" class=\"space-y-12 py-6 text-center max-w-3xl mx-auto\">\n      <div class=\"space-y-6\">\n        <div class=\"inline-flex items-center space-x-2 text-sageGray tracking-widest text-xs uppercase font-semibold\">\n          <span>\ud83c\udfdb\ufe0f<\/span>\n          <span>A Curator's Cabinet of Playable Ideas<\/span>\n        <\/div>\n        <h1 class=\"text-4xl sm:text-6xl font-serif font-black tracking-tight text-darkInk leading-tight\">\n          The Connections <span class=\"underline decoration-burntVermilion decoration-wavy underline-offset-8\">Atlas<\/span>\n        <\/h1>\n        <p class=\"text-sageGray max-w-xl mx-auto text-base sm:text-lg font-light leading-relaxed\">\n          A design space for strategists and analytical minds. Assemble sixteen elements of information into four unified categories. Share your customized conceptual challenges with friends.\n        <\/p>\n      <\/div>\n\n      <!-- Play & Create Hero Card -->\n      <div class=\"bg-mistWhite border border-softSlate rounded-[18px] p-8 shadow-sm max-w-lg mx-auto space-y-6 transition-all duration-300 hover:shadow-md hover:translate-y-[-2px]\">\n        <h2 class=\"academic-title font-bold text-sm tracking-widest text-darkInk border-b border-softSlate/40 pb-3\">\n          Select Your Expedition\n        <\/h2>\n        <div class=\"grid grid-cols-1 gap-4\">\n          <button onclick=\"loadSamplePuzzle()\" class=\"w-full py-4 px-6 bg-burntVermilion hover:bg-burntVermilionHover text-white font-serif font-bold rounded-[12px] transition-all duration-200 transform active:scale-[0.98] shadow-sm flex items-center justify-center space-x-3\">\n            <span>\ud83c\udf0d<\/span> <span>Embark on Curated Map<\/span>\n          <\/button>\n          <button onclick=\"showSection('creator')\" class=\"w-full py-4 px-6 bg-royalBlue hover:bg-royalBlueHover text-white font-serif font-bold rounded-[12px] transition-all duration-200 transform active:scale-[0.98] shadow-sm flex items-center justify-center space-x-3\">\n            <span>\ud83d\udcd0<\/span> <span>Construct New Grid<\/span>\n          <\/button>\n        <\/div>\n      <\/div>\n\n      <!-- Minimal Quote or Decorative Visual Divider -->\n      <div class=\"pt-8 border-t border-softSlate/30 max-w-md mx-auto\">\n        <p class=\"text-xs italic text-sageGray leading-relaxed\">\n          \"Everything is connected in one vast tapestry of relationships. The art is in uncovering the hidden alignment.\"\n        <\/p>\n      <\/div>\n    <\/section>\n\n    <!-- PLAY GAME SCREEN -->\n    <section id=\"section-play\" class=\"hidden space-y-8 max-w-3xl mx-auto w-full\">\n      <div class=\"text-center space-y-2\">\n        <div id=\"play-title\" class=\"academic-title text-xs font-black tracking-widest text-deepPlum\">ARCHIVAL ENTRY #409<\/div>\n        <h2 class=\"text-3xl font-serif font-bold text-darkInk\">Unravel the Alignment<\/h2>\n        <p class=\"text-sm text-sageGray\">Group sixteen fragments into four categories of academic thought.<\/p>\n      <\/div>\n\n      <!-- Solved Categories Banner Panel -->\n      <div id=\"solved-banners\" class=\"space-y-3\">\n        <!-- Dynamically populated solved category rows -->\n      <\/div>\n\n      <!-- Main Game Grid -->\n      <div id=\"word-grid\" class=\"grid grid-cols-4 gap-3 my-4\">\n        <!-- Dynamically populated 16/12/8/4 button cards -->\n      <\/div>\n\n      <!-- Mistakes Tracker with Academic Geometric Diamonds -->\n      <div class=\"flex items-center justify-center space-x-4 py-4 border-y border-softSlate/20 max-w-sm mx-auto\">\n        <span class=\"text-xs text-sageGray uppercase tracking-widest font-semibold\">Remaining Marks:<\/span>\n        <div id=\"mistake-dots\" class=\"flex space-x-2.5\">\n          <!-- 4 elegant diamond components -->\n        <\/div>\n      <\/div>\n\n      <!-- Game Action Buttons -->\n      <div class=\"flex flex-wrap items-center justify-center gap-4 pt-2\">\n        <button id=\"btn-shuffle\" onclick=\"shuffleGrid()\" class=\"px-6 py-3 rounded-[12px] border border-softSlate hover:border-darkInk hover:bg-mistWhite font-bold text-xs tracking-wider uppercase text-sageGray hover:text-darkInk transition-all duration-200\">\n          \ud83d\udd04 Shuffle\n        <\/button>\n        <button id=\"btn-deselect\" onclick=\"deselectAll()\" class=\"px-6 py-3 rounded-[12px] border border-softSlate hover:border-darkInk hover:bg-mistWhite font-bold text-xs tracking-wider uppercase text-sageGray hover:text-darkInk transition-all duration-200\">\n          Clear Selects\n        <\/button>\n        <button id=\"btn-submit\" onclick=\"submitSelection()\" class=\"px-8 py-3 rounded-[12px] bg-softSlate text-white font-bold text-xs tracking-wider uppercase transition-all duration-200 cursor-not-allowed\" disabled>\n          Submit Hypothesis\n        <\/button>\n      <\/div>\n\n      <!-- Solved State Share / Action Card -->\n      <div id=\"endgame-card\" class=\"hidden bg-mistWhite p-8 rounded-[18px] border border-softSlate shadow-lg text-center space-y-6 max-w-md mx-auto transition-all duration-300 transform scale-95 opacity-0\">\n        <h3 id=\"endgame-title\" class=\"text-2xl font-serif font-black text-darkInk\">Hypothesis Confirmed<\/h3>\n        <p id=\"endgame-subtitle\" class=\"text-sm text-sageGray font-light\">Your cognitive alignment is complete.<\/p>\n        \n        <div class=\"bg-parchment p-5 rounded-[12px] max-w-xs mx-auto border border-softSlate/30 flex flex-col items-center\">\n          <div id=\"share-grid-preview\" class=\"font-mono text-xl leading-snug tracking-widest select-none space-y-0.5\">\n            <!-- Share emojis -->\n          <\/div>\n        <\/div>\n\n        <div class=\"flex flex-col sm:flex-row gap-3 justify-center\">\n          <button id=\"btn-copy-result\" onclick=\"copyResults()\" class=\"flex-1 py-3 px-5 bg-royalBlue hover:bg-royalBlueHover text-white font-bold rounded-[12px] transition-all duration-200 shadow-sm flex items-center justify-center space-x-2 text-xs uppercase tracking-wider\">\n            <span>\ud83d\udccb<\/span> <span id=\"copy-btn-text\">Log Results<\/span>\n          <\/button>\n          <button onclick=\"showSection('creator')\" class=\"flex-1 py-3 px-5 border-2 border-deepPlum hover:bg-deepPlum hover:text-white text-deepPlum font-bold rounded-[12px] transition-all duration-200 text-xs uppercase tracking-wider\">\n            \u270f\ufe0f Craft a New Grid\n          <\/button>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- CREATE GAME SCREEN -->\n    <section id=\"section-creator\" class=\"hidden space-y-8 max-w-3xl mx-auto w-full\">\n      <div class=\"text-center space-y-2\">\n        <h2 class=\"text-3xl font-serif font-bold text-darkInk tracking-tight\">The Grid Architect<\/h2>\n        <p class=\"text-sm text-sageGray max-w-md mx-auto\">Establish four structured categories of four fragments. Map out a clever test of association.<\/p>\n      <\/div>\n\n      <div class=\"space-y-6\">\n        <!-- Category 0: Puzzle (Royal Blue) -->\n        <div class=\"bg-mistWhite border border-softSlate rounded-[18px] p-6 space-y-4 shadow-xs transition hover:shadow-sm\">\n          <div class=\"flex items-center space-x-3 pb-2 border-b border-softSlate/20\">\n            <span class=\"w-4 h-4 rounded-full bg-royalBlue border border-darkInk/10\"><\/span>\n            <span class=\"text-xs font-bold uppercase tracking-widest text-royalBlue\">Class I: Puzzle Category (Straightforward)<\/span>\n          <\/div>\n          <div class=\"space-y-3\">\n            <input type=\"text\" id=\"cat-0-name\" placeholder=\"Category Concept (e.g. Theoretical Geometries)\" class=\"w-full bg-parchment border border-softSlate px-4 py-2.5 rounded-[12px] text-sm focus:ring-2 focus:ring-royalBlue focus:outline-none font-semibold text-darkInk placeholder:text-sageGray/50\">\n            <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3\">\n              <input type=\"text\" id=\"cat-0-w1\" placeholder=\"Fragment 1\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-royalBlue focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-0-w2\" placeholder=\"Fragment 2\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-royalBlue focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-0-w3\" placeholder=\"Fragment 3\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-royalBlue focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-0-w4\" placeholder=\"Fragment 4\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-royalBlue focus:outline-none text-darkInk\">\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Category 1: Strategy (Deep Plum) -->\n        <div class=\"bg-mistWhite border border-softSlate rounded-[18px] p-6 space-y-4 shadow-xs transition hover:shadow-sm\">\n          <div class=\"flex items-center space-x-3 pb-2 border-b border-softSlate/20\">\n            <span class=\"w-4 h-4 rounded-full bg-deepPlum border border-darkInk/10\"><\/span>\n            <span class=\"text-xs font-bold uppercase tracking-widest text-deepPlum\">Class II: Strategy Category (Medium complexity)<\/span>\n          <\/div>\n          <div class=\"space-y-3\">\n            <input type=\"text\" id=\"cat-1-name\" placeholder=\"Category Concept (e.g. Strategic Maneuvers)\" class=\"w-full bg-parchment border border-softSlate px-4 py-2.5 rounded-[12px] text-sm focus:ring-2 focus:ring-deepPlum focus:outline-none font-semibold text-darkInk placeholder:text-sageGray/50\">\n            <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3\">\n              <input type=\"text\" id=\"cat-1-w1\" placeholder=\"Fragment 1\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-deepPlum focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-1-w2\" placeholder=\"Fragment 2\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-deepPlum focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-1-w3\" placeholder=\"Fragment 3\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-deepPlum focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-1-w4\" placeholder=\"Fragment 4\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-deepPlum focus:outline-none text-darkInk\">\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Category 2: Exploration (Sage Gray) -->\n        <div class=\"bg-mistWhite border border-softSlate rounded-[18px] p-6 space-y-4 shadow-xs transition hover:shadow-sm\">\n          <div class=\"flex items-center space-x-3 pb-2 border-b border-softSlate/20\">\n            <span class=\"w-4 h-4 rounded-full bg-sageGray border border-darkInk/10\"><\/span>\n            <span class=\"text-xs font-bold uppercase tracking-widest text-sageGray\">Class III: Exploration Category (Hard associations)<\/span>\n          <\/div>\n          <div class=\"space-y-3\">\n            <input type=\"text\" id=\"cat-2-name\" placeholder=\"Category Concept (e.g. Navigational Instruments)\" class=\"w-full bg-parchment border border-softSlate px-4 py-2.5 rounded-[12px] text-sm focus:ring-2 focus:ring-sageGray focus:outline-none font-semibold text-darkInk placeholder:text-sageGray/50\">\n            <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3\">\n              <input type=\"text\" id=\"cat-2-w1\" placeholder=\"Fragment 1\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-sageGray focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-2-w2\" placeholder=\"Fragment 2\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-sageGray focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-2-w3\" placeholder=\"Fragment 3\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-sageGray focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-2-w4\" placeholder=\"Fragment 4\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-sageGray focus:outline-none text-darkInk\">\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Category 3: Experimental (Burnt Vermilion) -->\n        <div class=\"bg-mistWhite border border-softSlate rounded-[18px] p-6 space-y-4 shadow-xs transition hover:shadow-sm\">\n          <div class=\"flex items-center space-x-3 pb-2 border-b border-softSlate/20\">\n            <span class=\"w-4 h-4 rounded-full bg-burntVermilion border border-darkInk/10\"><\/span>\n            <span class=\"text-xs font-bold uppercase tracking-widest text-burntVermilion\">Class IV: Experimental Category (Tricky Wordplay)<\/span>\n          <\/div>\n          <div class=\"space-y-3\">\n            <input type=\"text\" id=\"cat-3-name\" placeholder=\"Category Concept (e.g. Double Meanings)\" class=\"w-full bg-parchment border border-softSlate px-4 py-2.5 rounded-[12px] text-sm focus:ring-2 focus:ring-burntVermilion focus:outline-none font-semibold text-darkInk placeholder:text-sageGray/50\">\n            <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3\">\n              <input type=\"text\" id=\"cat-3-w1\" placeholder=\"Fragment 1\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-burntVermilion focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-3-w2\" placeholder=\"Fragment 2\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-burntVermilion focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-3-w3\" placeholder=\"Fragment 3\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-burntVermilion focus:outline-none text-darkInk\">\n              <input type=\"text\" id=\"cat-3-w4\" placeholder=\"Fragment 4\" class=\"creator-word bg-parchment border border-softSlate px-3 py-2 rounded-[12px] text-sm focus:ring-2 focus:ring-burntVermilion focus:outline-none text-darkInk\">\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- Action Footer for Creator -->\n      <div class=\"text-center space-y-4 pt-3\">\n        <button onclick=\"generateCustomPuzzleLink()\" class=\"w-full sm:w-auto px-12 py-4 bg-burntVermilion hover:bg-burntVermilionHover text-white font-serif font-extrabold rounded-[12px] transition duration-200 shadow-md flex items-center justify-center space-x-3 mx-auto\">\n          <span>\ud83d\udd17<\/span> <span>Catalog in Atlas (Link Generation)<\/span>\n        <\/button>\n      <\/div>\n\n      <!-- Link Output Card -->\n      <div id=\"link-output-card\" class=\"hidden bg-mistWhite border border-softSlate p-8 rounded-[18px] max-w-xl mx-auto space-y-4 transition-all duration-300\">\n        <h4 class=\"academic-title font-bold text-xs tracking-widest text-darkInk text-center flex items-center justify-center space-x-2\">\n          <span>\ud83c\udfdb\ufe0f<\/span> <span>Archival Entry Created Successfully<\/span>\n        <\/h4>\n        <div class=\"flex flex-col sm:flex-row items-center gap-3\">\n          <input type=\"text\" id=\"generated-url-input\" readonly class=\"w-full bg-parchment border border-softSlate px-4 py-3 rounded-[12px] text-xs font-mono text-sageGray outline-none select-all\">\n          <button id=\"btn-copy-url\" onclick=\"copyGeneratedLink()\" class=\"w-full sm:w-auto py-3 px-6 bg-royalBlue hover:bg-royalBlueHover text-white font-bold rounded-[12px] transition text-xs tracking-wider uppercase whitespace-nowrap\">\n            Copy Link\n          <\/button>\n        <\/div>\n        <div class=\"flex justify-center space-x-3 pt-2 border-t border-softSlate/25\">\n          <button id=\"btn-test-play\" onclick=\"testPlayGeneratedLink()\" class=\"py-2 px-5 bg-parchment hover:bg-mistWhite border border-softSlate text-darkInk hover:text-royalBlue font-bold rounded-[12px] text-xs transition uppercase tracking-wider\">\n            \ud83c\udfae Conduct Dry Run Test\n          <\/button>\n        <\/div>\n      <\/div>\n    <\/section>\n\n  <\/main>\n\n  <!-- Global Footer -->\n  <footer class=\"border-t border-softSlate bg-darkInk text-parchment py-10 px-6 mt-16 relative z-10\">\n    <div class=\"max-w-[1200px] mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 items-center\">\n      <div class=\"text-center md:text-left space-y-2\">\n        <div class=\"font-serif font-black tracking-widest uppercase text-sm\">\n          Jacob's Game Atlas\n        <\/div>\n        <p class=\"text-xs text-sageGray max-w-md leading-relaxed\">\n          Custom Connections is an interactive archive dedicated to the exploration of structured logic. Inspired by NYT Connections. Designed as an indie laboratory for ideas.\n        <\/p>\n      <\/div>\n      <div class=\"text-center md:text-right space-y-4\">\n        <p class=\"text-sm italic text-sageGray font-serif\">\n          \"Games are laboratories for ideas.\"\n        <\/p>\n        <div class=\"text-xs text-sageGray flex flex-wrap items-center justify-center md:justify-end gap-x-4 gap-y-2\">\n          <a href=\"#\" onclick=\"goHome(event)\" class=\"hover:text-parchment transition duration-150 underline decoration-softSlate\">Atlas Front<\/a>\n          <span>\u2022<\/span>\n          <a href=\"#\" onclick=\"showSection('creator'); return false;\" class=\"hover:text-parchment transition duration-150 underline decoration-softSlate\">Construct Game<\/a>\n          <span>\u2022<\/span>\n          <a href=\"#\" onclick=\"openInstructionsModal(); return false;\" class=\"hover:text-parchment transition duration-150 underline decoration-softSlate\">Expedition Rules<\/a>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/footer>\n\n  <!-- Instructions Modal Overlay -->\n  <div id=\"instructions-modal\" class=\"hidden fixed inset-0 z-50 flex items-center justify-center bg-darkInk/70 backdrop-blur-xs p-4\">\n    <div class=\"bg-mistWhite rounded-[18px] p-6 sm:p-8 max-w-md w-full border border-softSlate shadow-2xl relative space-y-6\">\n      <button onclick=\"closeInstructionsModal()\" class=\"absolute top-5 right-5 text-sageGray hover:text-darkInk transition duration-150\">\n        <svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" viewBox=\"0 0 24 24\">\n          <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6 18L18 6M6 6l12 12\"><\/path>\n        <\/svg>\n      <\/button>\n      \n      <div class=\"space-y-2 border-b border-softSlate/30 pb-4\">\n        <h3 class=\"text-2xl font-serif font-bold text-darkInk\">Atlas Directives<\/h3>\n        <p class=\"text-xs text-sageGray uppercase tracking-widest\">Procedural instructions for mapping alignments<\/p>\n      <\/div>\n\n      <div class=\"space-y-4 text-sm text-darkInk\">\n        <div class=\"flex items-start space-x-3.5\">\n          <div class=\"flex-shrink-0 w-6 h-6 bg-parchment border border-softSlate text-darkInk font-bold rounded-full flex items-center justify-center text-xs\">1<\/div>\n          <p class=\"text-xs leading-relaxed\">Select four associated elements. Submit your collection as a unified concept.<\/p>\n        <\/div>\n        <div class=\"flex items-start space-x-3.5\">\n          <div class=\"flex-shrink-0 w-6 h-6 bg-parchment border border-softSlate text-darkInk font-bold rounded-full flex items-center justify-center text-xs\">2<\/div>\n          <p class=\"text-xs leading-relaxed\">Discover all four secret categorical branches without exceeding 4 faulty submissions.<\/p>\n        <\/div>\n        <div class=\"flex items-start space-x-3.5\">\n          <div class=\"flex-shrink-0 w-6 h-6 bg-parchment border border-softSlate text-darkInk font-bold rounded-full flex items-center justify-center text-xs\">3<\/div>\n          <p class=\"text-xs leading-relaxed\">Categories reflect ascending difficulty tiers:\n            <span class=\"block mt-2 space-y-1.5 pl-1 border-l-2 border-softSlate\">\n              <span class=\"inline-flex items-center text-[10px] font-bold px-2 py-0.5 rounded bg-royalBlue text-white uppercase tracking-wider\">Puzzle<\/span> Simple theoretical shapes\n              <br><span class=\"inline-flex items-center text-[10px] font-bold px-2 py-0.5 rounded bg-deepPlum text-white uppercase tracking-wider\">Strategy<\/span> Practical tactical structures\n              <br><span class=\"inline-flex items-center text-[10px] font-bold px-2 py-0.5 rounded bg-sageGray text-white uppercase tracking-wider\">Exploration<\/span> Relational cartographies\n              <br><span class=\"inline-flex items-center text-[10px] font-bold px-2 py-0.5 rounded bg-burntVermilion text-white uppercase tracking-wider\">Experimental<\/span> Tricky dialectical semantics\n            <\/span>\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <button onclick=\"closeInstructionsModal()\" class=\"w-full py-3.5 bg-darkInk hover:bg-black text-parchment font-serif font-bold rounded-[12px] transition duration-200\">\n        Initiate Expedition\n      <\/button>\n    <\/div>\n  <\/div>\n\n  <!-- JavaScript App Logic -->\n  <script>\n    const state = {\n      activeSection: 'home',\n      puzzle: null,            \n      activeWords: [],         \n      selectedIds: [],         \n      solvedCategories: [],    \n      mistakesRemaining: 4,\n      guessHistory: [],        \n      isGameOver: false,\n      isGameWon: false,\n      isCustomPuzzle: false\n    };\n\n    // --- ACADEMIC THEMING DEFAULT PUZZLE ---\n    const samplePuzzle = {\n      title: \"Jacob's Introductory Atlas\",\n      categories: [\n        {\n          name: \"Planar Geometries (Puzzle)\",\n          words: [\"CIRCLE\", \"TANGENT\", \"VECTOR\", \"RADIUS\"],\n          difficulty: 0 \n        },\n        {\n          name: \"Strategic Positions (Strategy)\",\n          words: [\"PAWN\", \"GAMBIT\", \"FLANK\", \"RESERVE\"],\n          difficulty: 1 \n        },\n        {\n          name: \"Vessel Instruments (Exploration)\",\n          words: [\"COMPASS\", \"SEXTANT\", \"RADAR\", \"SONAR\"],\n          difficulty: 2 \n        },\n        {\n          name: \"Starts with Academic Disciplines (Experimental)\",\n          words: [\"MATH\", \"HIST\", \"PHIL\", \"CHEM\"],\n          difficulty: 3 \n        }\n      ]\n    };\n\n    // --- BASE64 SERIALIZATION UTILS ---\n    function encodePuzzleData(puzzleObj) {\n      const jsonStr = JSON.stringify(puzzleObj);\n      return btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, (match, p1) => {\n        return String.fromCharCode(parseInt(p1, 16));\n      }));\n    }\n\n    function decodePuzzleData(base64Str) {\n      try {\n        const decoded = decodeURIComponent(Array.prototype.map.call(atob(base64Str), (c) => {\n          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);\n        }).join(''));\n        return JSON.parse(decoded);\n      } catch (e) {\n        console.error(\"Decoding puzzle parameter failed: \", e);\n        return null;\n      }\n    }\n\n    // --- STREAMING_CHUNK: Managing Client Lifecycle... ---\n    window.addEventListener('DOMContentLoaded', () => {\n      const urlParams = new URLSearchParams(window.location.search);\n      const encodedPuzzle = urlParams.get('puzzle');\n\n      if (encodedPuzzle) {\n        const puzzleData = decodePuzzleData(encodedPuzzle);\n        if (puzzleData && validatePuzzleStructure(puzzleData)) {\n          state.isCustomPuzzle = true;\n          setupGame(puzzleData);\n          showSection('play');\n        } else {\n          showToast('\u26a0\ufe0f Could not decrypt target puzzle data.', 'error');\n          showSection('home');\n        }\n      } else {\n        showSection('home');\n      }\n    });\n\n    function validatePuzzleStructure(data) {\n      if (!data || !Array.isArray(data.categories) || data.categories.length !== 4) return false;\n      for (const cat of data.categories) {\n        if (!cat.name || !Array.isArray(cat.words) || cat.words.length !== 4) return false;\n      }\n      return true;\n    }\n\n    function showSection(sectionId) {\n      state.activeSection = sectionId;\n      document.getElementById('section-home').classList.add('hidden');\n      document.getElementById('section-play').classList.add('hidden');\n      document.getElementById('section-creator').classList.add('hidden');\n\n      const targetEl = document.getElementById(`section-${sectionId}`);\n      if (targetEl) targetEl.classList.remove('hidden');\n\n      const navBtn = document.getElementById('nav-create-btn');\n      if (sectionId === 'creator') {\n        navBtn.classList.add('opacity-40', 'cursor-not-allowed');\n        navBtn.disabled = true;\n      } else {\n        navBtn.classList.remove('opacity-40', 'cursor-not-allowed');\n        navBtn.disabled = false;\n      }\n      \n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    }\n\n    function goHome(e) {\n      if (e) e.preventDefault();\n      if (window.location.search) {\n        window.history.pushState({}, document.title, window.location.pathname);\n      }\n      showSection('home');\n    }\n\n    function loadSamplePuzzle() {\n      state.isCustomPuzzle = false;\n      setupGame(samplePuzzle);\n      showSection('play');\n    }\n\n    function setupGame(puzzleObj) {\n      state.puzzle = puzzleObj;\n      state.selectedIds = [];\n      state.solvedCategories = [];\n      state.mistakesRemaining = 4;\n      state.guessHistory = [];\n      state.isGameOver = false;\n      state.isGameWon = false;\n\n      state.activeWords = [];\n      puzzleObj.categories.forEach((cat, catIdx) => {\n        cat.words.forEach((word) => {\n          state.activeWords.push({\n            id: `${catIdx}-${word.replace(/\\s+/g, '').toLowerCase()}`,\n            word: word.trim(),\n            categoryIndex: catIdx,\n            difficulty: cat.difficulty !== undefined ? cat.difficulty : catIdx\n          });\n        });\n      });\n\n      const titleEl = document.getElementById('play-title');\n      if (state.isCustomPuzzle) {\n        titleEl.textContent = \"Custom Player-Created Expedition\";\n      } else {\n        titleEl.textContent = \"Jacob's Introductory Atlas\";\n      }\n\n      const endgameCard = document.getElementById('endgame-card');\n      endgameCard.classList.add('hidden', 'scale-95', 'opacity-0');\n\n      shuffleGrid(true); \n      updateMistakesUI();\n      updateActionButtonsState();\n      \n      document.getElementById('solved-banners').innerHTML = '';\n    }\n\n    function renderGrid() {\n      const gridContainer = document.getElementById('word-grid');\n      gridContainer.innerHTML = '';\n\n      state.activeWords.forEach((wordObj) => {\n        const isSelected = state.selectedIds.includes(wordObj.id);\n        \n        const card = document.createElement('button');\n        card.id = `card-${wordObj.id}`;\n        card.className = `grid-item p-4 text-xs sm:text-sm font-bold uppercase rounded-[12px] flex items-center justify-center min-h-[72px] select-none text-center border transition-all duration-200 outline-none\n          ${isSelected \n            ? 'bg-darkInk text-parchment border-darkInk shadow-inner transform scale-[0.98]' \n            : 'bg-mistWhite hover:bg-parchment/60 text-darkInk border-softSlate hover:border-darkInk hover:translate-y-[-2px] hover:shadow-xs'\n          }\n        `;\n        card.textContent = wordObj.word;\n        card.onclick = () => handleCardClick(wordObj.id);\n        gridContainer.appendChild(card);\n      });\n    }\n\n    function handleCardClick(id) {\n      if (state.isGameOver) return;\n\n      const idx = state.selectedIds.indexOf(id);\n      if (idx > -1) {\n        state.selectedIds.splice(idx, 1);\n      } else {\n        if (state.selectedIds.length >= 4) return;\n        state.selectedIds.push(id);\n      }\n\n      renderGrid();\n      updateActionButtonsState();\n    }\n\n    function deselectAll() {\n      if (state.isGameOver) return;\n      state.selectedIds = [];\n      renderGrid();\n      updateActionButtonsState();\n    }\n\n    function shuffleGrid(force = false) {\n      if (state.isGameOver && !force) return;\n      \n      for (let i = state.activeWords.length - 1; i > 0; i--) {\n        const j = Math.floor(Math.random() * (i + 1));\n        [state.activeWords[i], state.activeWords[j]] = [state.activeWords[j], state.activeWords[i]];\n      }\n      \n      renderGrid();\n    }\n\n    function updateActionButtonsState() {\n      const btnSubmit = document.getElementById('btn-submit');\n      const isFourSelected = state.selectedIds.length === 4;\n\n      if (isFourSelected && !state.isGameOver) {\n        btnSubmit.disabled = false;\n        btnSubmit.classList.remove('bg-softSlate', 'text-white', 'cursor-not-allowed');\n        btnSubmit.classList.add('bg-royalBlue', 'hover:bg-royalBlueHover', 'text-white', 'cursor-pointer');\n      } else {\n        btnSubmit.disabled = true;\n        btnSubmit.classList.remove('bg-royalBlue', 'hover:bg-royalBlueHover', 'text-white', 'cursor-pointer');\n        btnSubmit.classList.add('bg-softSlate', 'text-white', 'cursor-not-allowed');\n      }\n    }\n\n    function updateMistakesUI() {\n      const dotsContainer = document.getElementById('mistake-dots');\n      dotsContainer.innerHTML = '';\n      \n      // Creating elegant diamond tokens for remaining attempts\n      for (let i = 0; i < 4; i++) {\n        const diamond = document.createElement('div');\n        if (i < state.mistakesRemaining) {\n          diamond.className = 'w-3 h-3 rotate-45 border border-darkInk bg-darkInk transition-all duration-300';\n        } else {\n          diamond.className = 'w-3 h-3 rotate-45 border border-softSlate bg-transparent transition-all duration-300 transform scale-75';\n        }\n        dotsContainer.appendChild(diamond);\n      }\n    }\n\n    function submitSelection() {\n      if (state.selectedIds.length !== 4 || state.isGameOver) return;\n\n      const selectedObjs = state.activeWords.filter(w => state.selectedIds.includes(w.id));\n      const guessDifficultyProfile = selectedObjs.map(w => w.difficulty);\n      state.guessHistory.push(guessDifficultyProfile);\n\n      const targetCategoryIdx = selectedObjs[0].categoryIndex;\n      const isMatch = selectedObjs.every(w => w.categoryIndex === targetCategoryIdx);\n\n      if (isMatch) {\n        triggerCategorySolve(targetCategoryIdx);\n      } else {\n        const counts = {};\n        selectedObjs.forEach(w => {\n          counts[w.categoryIndex] = (counts[w.categoryIndex] || 0) + 1;\n        });\n        const maxMatchCount = Math.max(...Object.values(counts));\n\n        state.mistakesRemaining--;\n        updateMistakesUI();\n\n        state.selectedIds.forEach(id => {\n          const el = document.getElementById(`card-${id}`);\n          if (el) {\n            el.classList.add('shake');\n            setTimeout(() => el.classList.remove('shake'), 400);\n          }\n        });\n\n        if (maxMatchCount === 3) {\n          showToast('\ud83d\udd0d Alignment near: One fragment misaligned.', 'info');\n        } else {\n          showToast('\u274c Incorrect Hypothesis', 'error');\n        }\n\n        if (state.mistakesRemaining <= 0) {\n          handleGameOver(false);\n        }\n      }\n    }\n\n    function triggerCategorySolve(categoryIndex) {\n      const solvedCategory = state.puzzle.categories[categoryIndex];\n      state.solvedCategories.push(categoryIndex);\n\n      state.activeWords = state.activeWords.filter(w => w.categoryIndex !== categoryIndex);\n      state.selectedIds = [];\n\n      const bannerContainer = document.getElementById('solved-banners');\n      const banner = document.createElement('div');\n      \n      let difficultyColorClass = 'color-cat-0';\n      if (solvedCategory.difficulty === 1) difficultyColorClass = 'color-cat-1';\n      if (solvedCategory.difficulty === 2) difficultyColorClass = 'color-cat-2';\n      if (solvedCategory.difficulty === 3) difficultyColorClass = 'color-cat-3';\n\n      banner.className = `p-5 rounded-[12px] flex flex-col items-center justify-center text-center shadow-xs transform scale-95 opacity-0 transition-all duration-300 ${difficultyColorClass}`;\n      banner.innerHTML = `\n        <h4 class=\"academic-title font-bold text-[10px] tracking-widest opacity-90 mb-1\">${solvedCategory.name}<\/h4>\n        <p class=\"font-serif font-bold text-sm tracking-wide\">${solvedCategory.words.join(', ')}<\/p>\n      `;\n\n      bannerContainer.appendChild(banner);\n      \n      setTimeout(() => {\n        banner.classList.remove('scale-95', 'opacity-0');\n        banner.classList.add('scale-100', 'opacity-100');\n      }, 50);\n\n      renderGrid();\n      updateActionButtonsState();\n\n      if (state.solvedCategories.length === 4) {\n        handleGameOver(true);\n      }\n    }\n\n    function handleGameOver(isWin) {\n      state.isGameOver = true;\n      state.isGameWon = isWin;\n\n      const card = document.getElementById('endgame-card');\n      const title = document.getElementById('endgame-title');\n      const subtitle = document.getElementById('endgame-subtitle');\n\n      if (isWin) {\n        title.textContent = \"Cognitive Grid Solved! \ud83c\udf93\";\n        subtitle.textContent = \"All relationships matched under academic inquiry.\";\n        showToast(\"Perfect Alignment Confirmed! \ud83c\udf89\", \"success\");\n      } else {\n        title.textContent = \"Expedition Incomplete \u274c\";\n        subtitle.textContent = \"You exhausted all hypotheses. Study the complete alignments below:\";\n        showToast(\"Hypothesis flawed. Review correct links.\", \"info\");\n        revealRemainingAnswers();\n      }\n\n      generateShareGridPreview();\n\n      card.classList.remove('hidden');\n      setTimeout(() => {\n        card.classList.remove('scale-95', 'opacity-0');\n        card.classList.add('scale-100', 'opacity-100');\n      }, 200);\n    }\n\n    function revealRemainingAnswers() {\n      const allCategories = [0, 1, 2, 3];\n      const remaining = allCategories.filter(idx => !state.solvedCategories.includes(idx));\n\n      remaining.forEach((categoryIdx, i) => {\n        setTimeout(() => {\n          triggerCategorySolve(categoryIdx);\n        }, (i + 1) * 900); \n      });\n    }\n\n    function generateShareGridPreview() {\n      const previewContainer = document.getElementById('share-grid-preview');\n      previewContainer.innerHTML = '';\n\n      const difficultyEmojis = {\n        0: '\ud83d\udfe6', // Royal Blue\n        1: '\ud83d\udfea', // Deep Plum\n        2: '\ud83d\udfe9', // Sage Gray\n        3: '\ud83d\udfe5'  // Burnt Vermilion\n      };\n\n      state.guessHistory.forEach(guessRow => {\n        const rowDiv = document.createElement('div');\n        rowDiv.className = 'flex justify-center space-x-1';\n        \n        guessRow.forEach(difficultyVal => {\n          const span = document.createElement('span');\n          span.textContent = difficultyEmojis[difficultyVal] || '\u2b1c';\n          rowDiv.appendChild(span);\n        });\n        \n        previewContainer.appendChild(rowDiv);\n      });\n    }\n\n    function copyResults() {\n      const difficultyEmojis = { 0: '\ud83d\udfe6', 1: '\ud83d\udfea', 2: '\ud83d\udfe9', 3: '\ud83d\udfe5' };\n      \n      let gridText = '';\n      state.guessHistory.forEach(row => {\n        gridText += row.map(val => difficultyEmojis[val]).join('') + '\\n';\n      });\n\n      const title = state.isCustomPuzzle ? \"Jacob's Custom Connections Map\" : \"Jacob's Introductory Atlas Challenge\";\n      const shareUrl = window.location.href;\n      \n      const fullShareString = `${title}\\n${gridText}Solve this cognitive map here:\\n${shareUrl}`;\n\n      const tempTextarea = document.createElement('textarea');\n      tempTextarea.value = fullShareString;\n      document.body.appendChild(tempTextarea);\n      tempTextarea.select();\n      \n      try {\n        const successful = document.execCommand('copy');\n        if (successful) {\n          const btnText = document.getElementById('copy-btn-text');\n          btnText.textContent = \"Copied! \ud83c\udfdb\ufe0f\";\n          showToast(\"Copied catalog to clipboard!\", \"success\");\n          setTimeout(() => {\n            btnText.textContent = \"Log Results\";\n          }, 2000);\n        } else {\n          showToast(\"Clipboard copy block encountered.\", \"error\");\n        }\n      } catch (err) {\n        showToast(\"Error during copy compilation.\", \"error\");\n      }\n      document.body.removeChild(tempTextarea);\n    }\n\n    function generateCustomPuzzleLink() {\n      const categories = [];\n      let formIsValid = true;\n      const allWordsSet = new Set();\n\n      for (let i = 0; i < 4; i++) {\n        const catName = document.getElementById(`cat-${i}-name`).value.trim();\n        const w1 = document.getElementById(`cat-${i}-w1`).value.trim();\n        const w2 = document.getElementById(`cat-${i}-w2`).value.trim();\n        const w3 = document.getElementById(`cat-${i}-w3`).value.trim();\n        const w4 = document.getElementById(`cat-${i}-w4`).value.trim();\n\n        if (!catName || !w1 || !w2 || !w3 || !w4) {\n          formIsValid = false;\n          showToast(`\u26a0\ufe0f Please complete all entries in Category Class ${i + 1}.`, 'error');\n          break;\n        }\n\n        const groupWords = [w1, w2, w3, w4];\n        \n        groupWords.forEach(word => {\n          const normalized = word.toLowerCase().replace(/\\s+/g, '');\n          if (allWordsSet.has(normalized)) {\n            formIsValid = false;\n            showToast(`\u26a0\ufe0f Fragment duplicate encountered: \"${word}\". All words must be distinct!`, 'error');\n          } else {\n            allWordsSet.add(normalized);\n          }\n        });\n\n        if (!formIsValid) break;\n\n        categories.push({\n          name: catName,\n          words: groupWords,\n          difficulty: i\n        });\n      }\n\n      if (!formIsValid) return;\n\n      const customPuzzlePayload = {\n        title: \"Player Custom Connections Map\",\n        categories: categories\n      };\n\n      const base64Code = encodePuzzleData(customPuzzlePayload);\n      \n      const baseUrl = window.location.origin + window.location.pathname;\n      const generatedUrl = `${baseUrl}?puzzle=${base64Code}`;\n\n      const outputInput = document.getElementById('generated-url-input');\n      outputInput.value = generatedUrl;\n\n      const outputCard = document.getElementById('link-output-card');\n      outputCard.classList.remove('hidden');\n      outputCard.scrollIntoView({ behavior: 'smooth' });\n      showToast('\ud83c\udf89 Sharing link archived successfully!', 'success');\n    }\n\n    function copyGeneratedLink() {\n      const inputEl = document.getElementById('generated-url-input');\n      inputEl.select();\n      \n      try {\n        const successful = document.execCommand('copy');\n        if (successful) {\n          const copyBtn = document.getElementById('btn-copy-url');\n          copyBtn.textContent = \"Copied!\";\n          copyBtn.classList.replace('bg-royalBlue', 'bg-sageGray');\n          setTimeout(() => {\n            copyBtn.textContent = \"Copy Link\";\n            copyBtn.classList.replace('bg-sageGray', 'bg-royalBlue');\n          }, 2000);\n          showToast('Copied custom atlas path to clipboard.', 'success');\n        } else {\n          showToast('Clipboard copy block encountered.', 'error');\n        }\n      } catch (err) {\n        showToast('Error registering clipboard data.', 'error');\n      }\n    }\n\n    function testPlayGeneratedLink() {\n      const inputEl = document.getElementById('generated-url-input');\n      if (!inputEl.value) return;\n\n      const urlParams = new URLSearchParams(new URL(inputEl.value).search);\n      const encodedPuzzle = urlParams.get('puzzle');\n\n      if (encodedPuzzle) {\n        const puzzleData = decodePuzzleData(encodedPuzzle);\n        if (puzzleData) {\n          state.isCustomPuzzle = true;\n          window.history.pushState({}, \"\", inputEl.value);\n          setupGame(puzzleData);\n          showSection('play');\n        }\n      }\n    }\n\n    function showToast(message, type = 'info') {\n      const container = document.getElementById('toast-container');\n      const toast = document.createElement('div');\n      \n      let bgStyle = 'bg-darkInk text-parchment border border-softSlate';\n      if (type === 'success') bgStyle = 'bg-royalBlue text-white border border-royalBlueHover';\n      if (type === 'error') bgStyle = 'bg-burntVermilion text-white border border-burntVermilionHover';\n      if (type === 'info') bgStyle = 'bg-deepPlum text-parchment border border-deepPlumHover';\n\n      toast.className = `px-5 py-3 rounded-[12px] text-xs sm:text-sm font-semibold shadow-md transition-all duration-300 transform translate-y-2 opacity-0 flex items-center space-x-2 pointer-events-auto ${bgStyle}`;\n      toast.textContent = message;\n\n      container.appendChild(toast);\n\n      setTimeout(() => {\n        toast.classList.remove('translate-y-2', 'opacity-0');\n        toast.classList.add('translate-y-0', 'opacity-100');\n      }, 50);\n\n      setTimeout(() => {\n        toast.classList.add('opacity-0', '-translate-y-2');\n        setTimeout(() => {\n          container.removeChild(toast);\n        }, 300);\n      }, 2500);\n    }\n\n    function openInstructionsModal() {\n      document.getElementById('instructions-modal').classList.remove('hidden');\n    }\n\n    document.addEventListener('keydown', (e) => {\n      if (e.key === 'Escape') closeInstructionsModal();\n    });\n\n    function closeInstructionsModal() {\n      document.getElementById('instructions-modal').classList.add('hidden');\n    }\n  <\/script>\n<\/body>\n<\/html>"};

        function showPage(pageId) {
            document.getElementById('home-view').style.display = 'none';
            const container = document.getElementById(pageId);
            container.style.display = 'flex';
            
            // Dynamically inject the HTML to start the context
            const iframe = container.querySelector('iframe');
            iframe.srcdoc = pageData[pageId];
            
            window.scrollTo(0, 0);
        }

        function goHome(pageId) {
            const container = document.getElementById(pageId);
            container.style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            
            // Wipe the iframe to destroy the WebGL context and free memory
            const iframe = container.querySelector('iframe');
            iframe.srcdoc = '';
        }
    </script>
