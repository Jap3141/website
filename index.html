<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacob Pincock's Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #f4f4f9; 
        }
        header { 
            background: #2c3e50; 
            color: white; 
            padding: 2rem; 
            text-align: center; 
        }
        #home-screen { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 30px; 
            padding: 50px; 
            justify-content: center; 
        }
        .box {
            width: 220px; 
            height: 220px;
            background: white; 
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; 
            padding: 20px;
            font-size: 1.25rem; 
            font-weight: 600; 
            color: #34495e;
            border: 2px solid transparent;
        }
        .box:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 20px rgba(0,0,0,0.15); 
            border-color: #3498db;
        }
        .page-container {
            display: none;
            position: fixed;
            inset: 0;
            background: white;
            z-index: 10;
            flex-direction: column;
            min-height: 100dvh;
            overflow: hidden;
        }
        .nav-bar {
            width: 100%;
            height: 50px;
            background: #2c3e50;
            display: flex;
            align-items: center;
            padding: 0 15px;
            flex: 0 0 50px;
        }
        .back-btn {
            padding: 8px 16px; 
            background: #e74c3c; 
            color: white;
            border: none; 
            border-radius: 6px; 
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .back-btn:hover { background: #c0392b; }
        iframe {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            border: none;
            background: white;
            display: block;
        }
    </style>
</head>
<body>
    <div id="home-view">
        <header>
            <h1>Jacob Pincock's Hub</h1>
            <p>Select a page below to view its contents.</p>
        </header>
        <div id="home-screen">
            <div class="box" onclick="showPage('page_0')">The Scribe&#x27;s Armorial</div>
            
        </div>
    </div>

    
    <div id="page_0" class="page-container">
        <div class="nav-bar">
            <button class="back-btn" onclick="goHome('page_0')">← Back to Hub</button>
        </div>
        <iframe srcdoc=""></iframe>
    </div>
        

    <script>
        // Safely injected JSON containing all the raw HTML files
        const pageData = {"page_0": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>The Scribe's Armorial<\/title>\n    <script src=\"https://unpkg.com/react@18/umd/react.production.min.js\" crossorigin><\/script>\n    <script src=\"https://unpkg.com/react-dom@18/umd/react-dom.production.min.js\" crossorigin><\/script>\n    <script src=\"https://unpkg.com/@babel/standalone/babel.min.js\"><\/script>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <style>\n        /* Custom scrollbar style matching your design */\n        .scrollbar-thin::-webkit-scrollbar { width: 6px; }\n        .scrollbar-thin::-webkit-scrollbar-track { background: #020617; }\n        .scrollbar-thin::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }\n    <\/style>\n<\/head>\n<body class=\"bg-slate-950 text-slate-100\">\n    <div id=\"root\"><\/div>\n\n    <script type=\"text/babel\">\n        // Destructure hooks from the global React object\n        const { useState, useEffect } = React;\n\n        const PALETTE_EFFECTS = [\n            { id: 'shiny', name: '\u2728 Shiny Metal' },\n            { id: 'stone', name: '\ud83e\udea8 Carved Stone' },\n            { id: 'plaster', name: '\ud83e\uddf1 Ancient Plaster' },\n            { id: 'vellum', name: '\ud83d\udcdc Old Vellum' },\n            { id: 'plain', name: '\ud83c\udfa8 Classic Flat' }\n        ];\n\n        const QUESTIONS = [\n            \"When a close friend is upset, your natural instinct is to offer a practical, step-by-step solution rather than just emotional validation.\",\n            \"You find yourself highly affected by the visual aesthetics, lighting, or cleanliness of the room you are sitting in.\",\n            \"If a cashier accidentally gives you five dollars too much in change, you would feel genuinely uncomfortable keeping it and would return it.\",\n            \"You feel more energized after a lively, deep conversation with a group of people than after a quiet evening alone with a book or movie.\",\n            \"Your desk, digital files, or living spaces are meticulously organized; chaos in your environment stresses you out.\",\n            \"You rarely feel intense anxiety or worry about worst-case scenarios; you tend to trust that things will work out.\",\n            \"You are deeply fascinated by abstract theories, philosophy, or complex systemic concepts that don't have an immediate practical application.\",\n            \"If someone cuts you off in traffic or treats you unfairly, you find it easy to let go of the anger quickly.\",\n            \"You prefer a predictable routine over a spontaneous, last-minute change of plans, even if the change sounds fun.\",\n            \"You care deeply about personal recognition and title, and you enjoy being the center of attention when you succeed.\",\n            \"You find immense satisfaction in working with your hands, building physical objects, or fixing mechanical things.\",\n            \"When faced with a new statement or \\\"fact,\\\" your default mode is to research the data and verify the evidence yourself.\",\n            \"You would gladly take on the role of organizing, leading, and managing a large group project to ensure it succeeds.\",\n            \"Expressing yourself creatively\u2014through music, art, writing, or design\u2014is an essential daily need for you, not just a casual hobby.\",\n            \"You are the person your friends always turn to when they need a mediator, an empathetic listener, or help navigating a conflict.\",\n            \"You genuinely love working with data, spreadsheets, mathematical patterns, or highly structured schedules.\",\n            \"You frequently experience a deep sense of awe and gratitude when looking at a sunset, listening to great music, or seeing a brilliant idea come together.\",\n            \"You are highly driven by a sense of justice; you cannot stand by quietly if you see someone being treated unfairly.\",\n            \"You place a massive value on lifelong learning, constantly diving down rabbit holes to master new, random skills.\",\n            \"Forgiveness comes easily to you; you believe holding onto a grudge is a waste of your personal mental energy.\",\n            \"You often feel a deep longing for \\\"something more\\\" or a sense that your current environment is too small for your ultimate potential.\",\n            \"You value your personal freedom and independence far more than fitting into traditional expectations or societal norms.\",\n            \"You have a habit of looking past people's flaws or rough interiors to find the hidden good or potential inside them.\",\n            \"You are highly protective of your family or community, and you would gladly make major personal sacrifices to keep them safe.\",\n            \"Curiosity gets the best of you; if a door says \\\"Do Not Enter,\\\" it makes you want to open it even more.\",\n            \"You rely heavily on your quick wit, sharp mind, and resourcefulness to get yourself out of tough or unexpected situations.\",\n            \"You love daydreaming about the future and planning big, ambitious goals, sometimes missing what is happening right in front of you.\",\n            \"You believe that rules and traditions exist for a good reason, and you find comfort in honoring duty and heritage.\",\n            \"You are naturally highly observant, often noticing the subtle emotional shifts or hidden details in a room that everyone else misses.\",\n            \"You speak your mind directly and honestly, even if it risks making waves or making people uncomfortable.\",\n            \"You thrive in high-stakes, fast-paced situations and love the thrill of competition or taking a bold risk.\",\n            \"You view yourself as a steady, reliable anchor for the people around you\u2014calm, grounded, and fiercely protective.\",\n            \"You prefer to observe quietly from the perimeter before jumping into a social situation or making a big decision.\",\n            \"Harmonious, cooperative group dynamics matter more to you than individual victory or being \\\"right.\\\"\",\n            \"When a massive problem hits, your immediate instinct is to charge directly at it and tackle it head-on, rather than strategizing from afar.\",\n            \"You have a very high tolerance for solitude; you can spend days alone working on a project without feeling lonely.\",\n            \"You are incredibly adaptive; you can easily blend into completely different social circles or quickly pivot when your environment changes.\",\n            \"You are highly expressive with your body language, voice, or facial expressions\u2014people can usually read exactly what you are thinking.\",\n            \"You prefer to specialize deeply in one specific domain or skill rather than being a \\\"jack-of-all-trades\\\" who knows a little bit of everything.\",\n            \"You are naturally hyper-aware of your physical surroundings, instantly tracking movement, sounds, or changes in your environment.\"\n        ];\n\n        const DEFAULT_TRAINING_RECORDS = [\n            { id: \"seed-1\", title: \"Shield of the Vigilant Protector\", blazon: \"Gules, a lion rampant or\", answers: [5, 3, 5, 4, 3, 4, 3, 4, 3, 4, 3, 4, 5, 3, 4, 3, 4, 5, 4, 4, 4, 4, 4, 5, 3, 4, 4, 5, 4, 4, 4, 5, 3, 4, 5, 3, 4, 4, 3, 5] },\n            { id: \"seed-2\", title: \"Standard of the Mystic Sage\", blazon: \"Azure, three mullets argent\", answers: [2, 5, 4, 2, 4, 3, 5, 5, 4, 2, 3, 5, 3, 5, 4, 4, 5, 4, 5, 5, 5, 5, 5, 3, 5, 5, 5, 3, 5, 3, 2, 4, 5, 5, 2, 5, 3, 2, 5, 3] },\n            { id: \"seed-3\", title: \"Crest of the Meticulous Architect\", blazon: \"Sable, a chevron argent between three towers or\", answers: [5, 4, 5, 3, 5, 4, 4, 4, 5, 3, 5, 5, 4, 3, 3, 5, 3, 4, 4, 3, 3, 3, 3, 4, 3, 4, 4, 5, 4, 4, 3, 4, 4, 4, 4, 4, 3, 2, 5, 4] }\n        ];\n\n        function App() {\n            const [currentMode, setCurrentMode] = useState('create'); \n            const [currentStep, setCurrentStep] = useState('intro'); \n            const [answers, setAnswers] = useState(Array(40).fill(3)); \n            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);\n            const [loading, setLoading] = useState(false);\n            const [loadingStep, setLoadingStep] = useState('');\n            const [generationResult, setGenerationResult] = useState(null);\n            const [chosenEffect, setChosenEffect] = useState('shiny');\n            const [trainBlazon, setTrainBlazon] = useState('Or, a fess vert between three eagles gules');\n            const [trainTitle, setTrainTitle] = useState('Crest of the Forest Warden');\n            const [libraryData, setLibraryData] = useState(DEFAULT_TRAINING_RECORDS);\n            const [selectedLibraryItem, setSelectedLibraryItem] = useState(null);\n            const [toast, setToast] = useState(null);\n\n            const showToast = (message) => {\n                setToast(message);\n                setTimeout(() => setToast(null), 4000);\n            };\n\n            const handleTrainSubmission = () => {\n                if (!trainBlazon.trim() || !trainTitle.trim()) {\n                    showToast(\"\u26a0\ufe0f Please provide both a Title and a valid Blazon code.\");\n                    return;\n                }\n                const payload = {\n                    id: 'custom-' + Date.now(),\n                    title: trainTitle.trim(),\n                    blazon: trainBlazon.trim(),\n                    answers: answers\n                };\n                setLibraryData(prev => [payload, ...prev]);\n                showToast(\"\ud83d\udcdd Saved locally for current session (Sandbox Mode).\");\n                setCurrentMode('library');\n            };\n\n            const generateBlazonFromAnswers = () => {\n                setLoading(true);\n                setLoadingStep(\"Synthesizing your personality spectrum...\");\n                \n                // Simulated AI local forging mechanism for iframe sandboxes\n                setTimeout(() => {\n                    setGenerationResult({\n                        title: \"The Unyielding Sovereign\",\n                        blazon: \"Per pale gules and azure, a lion rampant crowned or\",\n                        tinctureExplanation: \"Gules (red) for your courage under pressure. Azure (blue) representing your fidelity to truth.\",\n                        chargesExplanation: \"A lion rampant crowned with gold represents absolute resilience and leadership.\",\n                        overallAnalysis: \"Your steadfast answers speak of a majestic and sovereign character.\"\n                    });\n                    setCurrentStep('result');\n                    setLoading(false);\n                }, 1500);\n            };\n\n            const handleCopyBlazon = (blazonText) => {\n                navigator.clipboard.writeText(blazonText);\n                showToast(\"\ud83d\udccb Blazon syntax copied! Paste it into Drawshield.\");\n            };\n\n            const handleQuickAutofill = () => {\n                setAnswers(answers.map(() => Math.floor(Math.random() * 5) + 1));\n                setCurrentQuestionIdx(39);\n                showToast(\"\u26a1 Quick-attuned! You are now at the final query.\");\n            };\n\n            const getDrawshieldUrl = (blazon, style = 'shiny') => {\n                return `https://drawshield.net/include/drawshield.php?blazon=${encodeURIComponent(blazon.replace(/[#?;%]/g, ''))}&outputformat=png&size=400&effect=${style}`;\n            };\n\n            return (\n                <div className=\"min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-amber-500 selection:text-slate-950\">\n                    <div className=\"h-2 bg-gradient-to-r from-amber-600 via-yellow-400 to-amber-600 w-full shadow-lg\"><\/div>\n                    <div className=\"bg-slate-900 border-b border-slate-800 text-xs text-slate-400 px-4 py-2 flex justify-between items-center\">\n                        <div className=\"flex items-center gap-2\">\n                            <span className=\"w-2 h-2 rounded-full bg-amber-500\"><\/span>\n                            <span>Local Sandbox Architecture<\/span>\n                        <\/div>\n                        <div className=\"text-amber-500 font-serif tracking-wider uppercase text-[10px]\">\n                            Library: <strong className=\"text-white\">{libraryData.length} Scrolls<\/strong> Active\n                        <\/div>\n                    <\/div>\n\n                    <header className=\"py-8 px-4 text-center max-w-4xl mx-auto w-full\">\n                        <h1 className=\"text-4xl md:text-5xl font-extrabold font-serif text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-400\">\n                            The Scribe's Armorial\n                        <\/h1>\n                        <nav className=\"mt-6 flex justify-center gap-2 max-w-md mx-auto bg-slate-900 p-1.5 rounded-xl border border-slate-800\">\n                            <button onClick={() => { setCurrentMode('create'); setCurrentStep('intro'); }} className={`flex-1 py-2 px-3 rounded-lg text-xs md:text-sm font-medium ${currentMode === 'create' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>\ud83d\udee1\ufe0f Create<\/button>\n                            <button onClick={() => { setCurrentMode('train'); }} className={`flex-1 py-2 px-3 rounded-lg text-xs md:text-sm font-medium ${currentMode === 'train' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>\ud83c\udff0 Train<\/button>\n                            <button onClick={() => { setCurrentMode('library'); setSelectedLibraryItem(null); }} className={`flex-1 py-2 px-3 rounded-lg text-xs md:text-sm font-medium ${currentMode === 'library' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>\ud83d\udcd6 Records<\/button>\n                        <\/nav>\n                    <\/header>\n\n                    <main className=\"flex-grow max-w-5xl w-full mx-auto px-4 pb-16\">\n                        {loading && (\n                            <div className=\"fixed inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center p-6\">\n                                <div className=\"w-16 h-16 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4\"><\/div>\n                                <h3 className=\"text-xl font-serif text-amber-400 animate-pulse\">{loadingStep}<\/h3>\n                            <\/div>\n                        )}\n\n                        {currentMode === 'create' && (\n                            <div>\n                                {currentStep === 'intro' && (\n                                    <div className=\"bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-2xl mx-auto text-center shadow-xl\">\n                                        <h2 className=\"text-2xl font-serif font-bold text-amber-400 mb-4\">Forge Your Heraldic Alignment<\/h2>\n                                        <p className=\"text-slate-300 text-sm mb-6\">Align your psychological profile features directly into modular shield layouts.<\/p>\n                                        <button onClick={() => setCurrentStep('quiz')} className=\"bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-bold px-8 py-3.5 rounded-xl text-sm\">Begin Attunement<\/button>\n                                    <\/div>\n                                )}\n\n                                {currentStep === 'quiz' && (\n                                    <div className=\"bg-slate-900 border border-slate-800 p-6 md:p-10 rounded-2xl max-w-3xl mx-auto shadow-2xl\">\n                                        <div className=\"flex justify-between items-center mb-6\">\n                                            <button onClick={handleQuickAutofill} className=\"text-[10px] bg-slate-800 text-amber-400 px-2 py-1 rounded\">\u26a1 Fast Skip<\/button>\n                                            <span className=\"text-xs bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded-full\">Query {currentQuestionIdx + 1} of 40<\/span>\n                                        <\/div>\n                                        <div className=\"min-h-[120px] bg-slate-950/40 p-6 rounded-xl border border-slate-800/40 mb-8 text-center text-lg font-serif\">\"{QUESTIONS[currentQuestionIdx]}\"<\/div>\n                                        <div className=\"grid grid-cols-1 sm:grid-cols-5 gap-3 mb-8\">\n                                            {[1, 2, 3, 4, 5].map((val) => (\n                                                <button key={val} onClick={() => { const u = [...answers]; u[currentQuestionIdx] = val; setAnswers(u); }} className={`p-4 rounded-xl border font-bold text-center ${answers[currentQuestionIdx] === val ? 'bg-amber-500 text-slate-950' : 'bg-slate-950 border-slate-800'}`}>{val}<\/button>\n                                            ))}\n                                        <\/div>\n                                        <div className=\"flex justify-between\">\n                                            <button disabled={currentQuestionIdx === 0} onClick={() => setCurrentQuestionIdx(p => p - 1)} className=\"px-4 py-2 bg-slate-800 text-xs rounded disabled:opacity-30\">\u2190 Previous<\/button>\n                                            {currentQuestionIdx < 39 ? (\n                                                <button onClick={() => setCurrentQuestionIdx(p => p + 1)} className=\"px-4 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded\">Next \u2192<\/button>\n                                            ) : (\n                                                <button onClick={generateBlazonFromAnswers} className=\"px-6 py-2 bg-emerald-500 text-slate-950 text-xs font-black rounded\">\u2694\ufe0f Forge Shield<\/button>\n                                            )}\n                                        <\/div>\n                                    <\/div>\n                                )}\n\n                                {currentStep === 'result' && generationResult && (\n                                    <div className=\"bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl max-w-2xl mx-auto text-center space-y-6\">\n                                        <h2 className=\"text-2xl font-serif font-black text-amber-400\">{generationResult.title}<\/h2>\n                                        <div className=\"flex justify-center\">\n                                            <img src={getDrawshieldUrl(generationResult.blazon, chosenEffect)} className=\"w-64 h-64 bg-slate-950 p-4 rounded-xl border border-slate-800 shadow-inner\" />\n                                        <\/div>\n                                        <p className=\"text-sm font-mono text-amber-300 bg-slate-950 p-3 rounded border border-slate-800\">{generationResult.blazon}<\/p>\n                                        <div className=\"flex gap-2 justify-center\">\n                                            <button onClick={() => handleCopyBlazon(generationResult.blazon)} className=\"px-4 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg\">\ud83d\udccb Copy Syntax<\/button>\n                                            <button onClick={() => { setAnswers(Array(40).fill(3)); setCurrentQuestionIdx(0); setCurrentStep('quiz'); }} className=\"px-4 py-2 bg-slate-800 text-xs rounded-lg\">\ud83d\udd04 Restart<\/button>\n                                        <\/div>\n                                    <\/div>\n                                )}\n                            <\/div>\n                        )}\n\n                        {currentMode === 'train' && (\n                            <div className=\"bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-2xl mx-auto space-y-4\">\n                                <h2 className=\"text-lg font-serif font-bold text-amber-400\">Sigils Registry Matrix<\/h2>\n                                <input type=\"text\" value={trainTitle} onChange={(e) => setTrainTitle(e.target.value)} placeholder=\"Crest Title\" className=\"w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs\" />\n                                <input type=\"text\" value={trainBlazon} onChange={(e) => setTrainBlazon(e.target.value)} placeholder=\"Blazon Code\" className=\"w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs font-mono text-amber-300\" />\n                                <button onClick={handleTrainSubmission} className=\"w-full py-2 bg-amber-500 text-slate-950 font-bold text-xs rounded\">Inscribe Pattern<\/button>\n                            <\/div>\n                        )}\n\n                        {currentMode === 'library' && (\n                            <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-3xl mx-auto\">\n                                {libraryData.map(item => (\n                                    <div key={item.id} className=\"bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center gap-4\">\n                                        <img src={getDrawshieldUrl(item.blazon, 'shiny')} className=\"w-12 h-12 bg-slate-950 rounded p-1 border border-slate-800\" />\n                                        <div>\n                                            <h4 className=\"font-serif font-bold text-xs text-slate-200\">{item.title}<\/h4>\n                                            <p className=\"text-[10px] font-mono text-slate-500 truncate max-w-[180px]\">{item.blazon}<\/p>\n                                        <\/div>\n                                    <\/div>\n                                ))}\n                            <\/div>\n                        )}\n                    <\/main>\n\n                    {toast && <div className=\"fixed bottom-6 right-6 bg-slate-900 border border-amber-500/40 text-slate-200 px-4 py-2 rounded-xl text-xs shadow-2xl\">\ud83d\udee1\ufe0f {toast}<\/div>}\n                <\/div>\n            );\n        }\n\n        const root = Byzantine = ReactDOM.createRoot(document.getElementById('root'));\n        root.render(<App />);\n    <\/script>\n<\/body>\n<\/html>"};

        function showPage(pageId) {
            document.getElementById('home-view').style.display = 'none';
            const container = document.getElementById(pageId);
            container.style.display = 'flex';
            
            // Dynamically inject the HTML to start the context
            const iframe = container.querySelector('iframe');
            iframe.srcdoc = pageData[pageId];
            
            window.scrollTo(0, 0);
        }

        function goHome(pageId) {
            const container = document.getElementById(pageId);
            container.style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            
            // Wipe the iframe to destroy the WebGL context and free memory
            const iframe = container.querySelector('iframe');
            iframe.srcdoc = '';
        }
    </script>
</body>
</html>
