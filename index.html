            width: 100%;
            border: none;

-[#f28500]\">V - Toggle Camera Perspective<\/div>\n            <\/div>\n            <p class=\"text-xl font-bold animate-pulse text-[#3c3c3c]\" id=\"click-prompt\">CLICK TO START ADVENTURE<\/p>\n        <\/div>\n    <\/div>\n\n    <script>\n        // Global Biome Database\n        const BIOMES = [\n            { name: \"Orange Wastes\", fog: 0xffaa55, sand: 0xdfc08d, foliage: 0x4d7c32, gem: 0x00ffff, type: 'desert', stormName: 'Sandstorm' },\n            { name: \"Verdant Mire\", fog: 0x2d4c1e, sand: 0x3d5a2d, foliage: 0x1a2e14, gem: 0xff00ff, type: 'forest', stormName: 'Fog Curse' },\n            { name: \"Frozen Blue Tundra\", fog: 0xd0e8f2, sand: 0xffffff, foliage: 0xadd8e6, gem: 0x3366ff, type: 'snow', stormName: 'Blizzard' },\n            { name: \"Crimson Peaks\", fog: 0x3a0000, sand: 0x4a0000, foliage: 0x0a0101, gem: 0xffd700, type: 'volcano', stormName: 'Magma Ash' }\n        ];\n\n        // Global Difficulty Parameters & Multipliers\n        let difficulty = 2; // 1=Easy, 2=Normal, 3=Hard\n        const DIFFICULTY_SETTINGS = {\n            1: { // Easy Mode\n                snailSpeedMult: 0.65,\n                snailCountMult: 0.6,\n                gemDistanceMult: 0.75,\n                snailAggression: 0.7,\n                flowUpdateInterval: 12 \n            },\n            2: { // Normal Mode (Standard balance)\n                snailSpeedMult: 1.0,\n                snailCountMult: 1.0,\n                gemDistanceMult: 1.0,\n                snailAggression: 1.0,\n                flowUpdateInterval: 8\n            },\n            3: { // Hard Mode (Hostile tracking environment)\n                snailSpeedMult: 1.35,\n                snailCountMult: 1.5,\n                gemDistanceMult: 1.25,\n                snailAggression: 1.45,\n                flowUpdateInterval: 4 \n            }\n        };\n\n        // Noise function for terrain height and pathfinding\n        function noise(x, z) {\n            return Math.sin(x * 0.1) * Math.cos(z * 0.1) * 2 + \n                   Math.sin(x * 0.05) * 3 + \n                   Math.sin(x * 0.02) * Math.cos(z * 0.02) * 8;\n        }\n\n        // Helper function to find valid spawn points on land\n        function findLandSpawn(minDist, maxDist, relativeTo = {x:0, z:0}, preferredDir = null) {\n            let attempts = 0;\n            while (attempts < 1000) {\n                let angle;\n                if (preferredDir) {\n                    const baseAngle = Math.atan2(preferredDir.z, preferredDir.x);\n                    angle = baseAngle + (Math.random() - 0.5) * Math.PI * 0.6; \n                } else {\n                    angle = Math.random() * Math.PI * 2;\n                }\n                \n                const dist = minDist + Math.random() * (maxDist - minDist);\n                const tx = Math.floor(relativeTo.x + Math.cos(angle) * dist);\n                const tz = Math.floor(relativeTo.z + Math.sin(angle) * dist);\n                if (Math.floor(noise(tx, tz)) >= 0) return { x: tx, z: tz };\n                attempts++;\n            }\n            return { x: relativeTo.x + minDist, z: relativeTo.z + minDist };\n        }\n\n        let GEM_TARGET_POS = findLandSpawn(250, 380);\n\n        let currentBiomeIndex = 0; // Globally defined to resolve the loadChunk ReferenceError\n        let scene, camera, renderer, clock, water;\n        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false, isSprinting = false;\n        let velocity = new THREE.Vector3();\n        let playerGroup; // Player spatial node\n        let playerMesh;  // Steve visual avatar\n        let playerPrevPos = new THREE.Vector3();\n        let playerYaw = 0;\n        let playerPitch = 0;\n        let viewMode = 'firstPerson'; \n        let gameWon = false, gameOver = false, gameActive = false;\n        let animationTime = 0;\n        let killerSnail = null;\n        let playerDeathPos = new THREE.Vector3();\n        let startTime = 0, activeSnailStartTime = 0;\n        let gemObject = null;\n        let audioCtx = null;\n        let lastHeartbeatTime = 0;\n\n        // Collectibles & Ruin State\n        let shards = []; // Sub shards to weaken snails\n        let collectibles = []; // Speed potions / Warding incense\n        let shardCount = 0;\n        let collectedShardsCount = 0;\n        const MAX_BIOME_SHARDS = 3;\n        \n        // Active Buff Timers\n        let speedBuffTime = 0;\n        let repellentBuffTime = 0;\n\n        // Weather Storm cycle\n        let stormCycleTimer = 0;\n        let isStormActive = false;\n        const STORM_INTERVAL = 45; // Every 45s a storm triggers\n        const STORM_DURATION = 15; // Storm lasts 15s\n        \n        const CHUNK_SIZE = 16;\n        const RENDER_DISTANCE = 5; \n        const loadedChunks = new Map();\n        const cactusCache = new Map(); // O(1) Coordinate Key Cache of coordinates to static foliage boundaries\n        const WATER_COLOR = 0x0055aa;\n        const WATER_LEVEL = -0.2;\n\n        // Pathfinding Flow Field Globals\n        let flowField = null;\n        let flowFieldCenterX = 0;\n        let flowFieldCenterZ = 0;\n        const FLOW_GRID_RADIUS = 25; \n        const FLOW_GRID_SIZE = FLOW_GRID_RADIUS * 2 + 1;\n        let pathfindingFrameCount = 0;\n\n        const FAR_SPEED_FACTOR = 0.17;\n        const CLOSE_SPEED_FACTOR = 0.085;\n        const DANGER_ZONE = 15;\n\n        // Snail Arrays & Configs\n        let snails = [];\n        const PLAYER_BASE_SPEED = 60;\n        const FIXED_SNAIL_FACTORS = [0.035, 0.045, 0.055, 0.065];\n\n        const overlay = document.getElementById('overlay');\n        const overlayTitle = document.getElementById('overlay-title');\n        const overlayDesc = document.getElementById('overlay-desc');\n        const clickPrompt = document.getElementById('click-prompt');\n        const controlsList = document.getElementById('controls-list');\n        const hud = document.getElementById('hud'); ew THREE.CylinderGeometry(0.12, 0.12, 0.4, 6);\n\n        // Difficulty Selector Function\n        window.setDifficulty = function(level, event) {\n            if (event) {\n                event.stopPropagation(); // Stop click from triggering lock on background overlay\n            }\n            difficulty = level;\n            \n            // Visual active styles update\n            const buttons = document.querySelectorAll('#difficulty-select button');\n            buttons.forEach((btn, idx) => {\n                if (idx + 1 === level) {\n                    btn.classList.add('bg-[#f28500]', 'text-white');\n                    btn.classList.remove('bg-neutral-200', 'text-neutral-800');\n                } else {\n                    btn.classList.remove('bg-[#f28500]', 'text-white');\n                    btn.classList.add('bg-neutral-200', 'text-neutral-800');\n                }\n            });\n\n            // Adjust starting gem position dynamically based on selection\n            const settings = DIFFICULTY_SETTINGS[difficulty];\n            GEM_TARGET_POS = findLandSpawn(250 * settings.gemDistanceMult, 380 * settings.gemDistanceMult);\n            \n            playSound('jump'); // Satisfying sound feedback on toggle click\n        }\n\n        // Web Audio API Sound Synthesizer\n        function playSound(type) {\n            try {\n                if (!audioCtx) {\n                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n                }\n                if (audioCtx.state === 'suspended') {\n                    audioCtx.resume();\n                }\n\n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n                const now = audioCtx.currentTime;\n\n                if (type === 'jump') {\n                    osc.type = 'triangle';\n                    osc.frequency.setValueAtTime(120, now);\n                    osc.frequency.exponentialRampToValueAtTime(350, now + 0.15);\n                    gain.gain.setValueAtTime(0.2, now);\n                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);\n                    osc.start(now);\n                    osc.stop(now + 0.15);\n                } else if (type === 'collect') {\n                    osc.type = 'sine';\n                    osc.frequency.setValueAtTime(523.25, now); // C5\n                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5\n                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5\n                    osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6\n                    gain.gain.setValueAtTime(0.25, now);\n                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);\n                    osc.start(now);\n                    osc.stop(now + 0.4);\n                } else if (type === 'shard') {\n                    osc.type = 'sine';\n                    osc.frequency.setValueAtTime(600, now);\n                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);\n                    gain.gain.setValueAtTime(0.2, now);\n                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);\n                    osc.start(now);\n                    osc.stop(now + 0.2);\n                } else if (type === 'potion') {\n                    osc.type = 'triangle';\n                    osc.frequency.setValueAtTime(200, now);\n                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.35);\n                    gain.gain.setValueAtTime(0.2, now);\n                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);\n                    osc.start(now);\n                    osc.stop(now + 0.35);\n                } else if (type === 'hurt') {\n                    osc.type = 'sawtooth';\n                    osc.frequency.setValueAtTime(100, now);\n                    osc.frequency.linearRampToValueAtTime(30, now + 0.7);\n                    \n                    const filter = audioCtx.createBiquadFilter();\n                    filter.type = 'lowpass';\n                    filter.frequency.setValueAtTime(250, now);\n                    \n                    osc.disconnect(gain);\n                    osc.connect(filter);\n                    filter.connect(gain);\n                    \n                    gain.gain.setValueAtTime(0.5, now);\n                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);\n                    osc.start(now);\n                    osc.stop(now + 0.7);\n                } else if (type === 'heartbeat') {\n                    osc.type = 'sine';\n                    osc.frequency.setValueAtTime(65, now);\n                    osc.frequency.exponentialRampToValueAtTime(35, now + 0.15);\n                    gain.gain.setValueAtTime(0.4, now);\n                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);\n                    osc.start(now);\n                    osc.stop(now + 0.15);\n                } else if (type === 'storm') {\n                    // Simulate wind sound\n                    osc.type = 'sawtooth';\n                    osc.frequency.setValueAtTime(45, now);\n                    osc.frequency.linearRampToValueAtTime(55, now + 1.0);\n                    const filter = audioCtx.createBiquadFilter();\n                    filter.type = 'lowpass';\n                    filter.frequency.setValueAtTime(110, now);\n                    osc.disconnect(gain);\n                    osc.connect(filter);\n                    filter.connect(gain);\n                    gain.gain.setValueAtTime(0.18, now);\n                    gain.gain.linearRampToValueAtTime(0.01, now + 1.0);\n                    osc.start(now);\n                    osc.stop(now + 1.0);\n                }\n            } catch (e) {\n                console.log(\"AudioContext blocked or failed: \", e);\n            }\n        }\n\n        function createPlayerMesh() {\n            const group = new THREE.Group();\n            \n            // Head (Steve skin tone)\n            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.85, flatShading: true });\n            const head = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.48, 0.48), headMat);\n            head.position.y = 1.55;\n            group.add(head);\n\n            // Hair\n            const hairMat = new THREE.MeshStandardMaterial({ color: 0x5a3825, roughness: 0.9, flatShading: true });\n            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.5), hairMat);\n            hair.position.y = 1.76;\n            group.add(hair);\n\n            // Torso (Cyan shirt)\n            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x00a8a8, roughness: 0.75, flatShading: true });\n            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.28), shirtMat);\n            torso.position.y = 0.95;\n            group.add(torso);\n\n            // Left Arm Group (Hip Pivot)\n            const leftArmGroup = new THREE.Group();\n            leftArmGroup.position.set(-0.38, 1.25, 0); \n            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.7, 0.18), shirtMat);\n            leftArm.position.y = -0.3;\n            leftArmGroup.add(leftArm);\n            group.add(leftArmGroup);\n\n            // Right Arm Group (Hip Pivot)\n            const rightArmGroup = new THREE.Group();\n            rightArmGroup.position.set(0.38, 1.25, 0);\n            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.7, 0.18), shirtMat);\n            rightArm.position.y = -0.3;\n            rightArmGroup.add(rightArm);\n            group.add(rightArmGroup);\n\n            // Left Leg Group (Hip Pivot)\n            const legMat = new THREE.MeshStandardMaterial({ color: 0x3f51b5, roughness: 0.75, flatShading: true });\n            const leftLegGroup = new THREE.Group();\n            leftLegGroup.position.set(-0.13, 0.6, 0);\n            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.6, 0.24), legMat);\n            leftLeg.position.y = -0.3;\n            leftLegGroup.add(leftLeg);\n            group.add(leftLegGroup);\n\n            // Right Leg Group (Hip Pivot)\n            const rightLegGroup = new THREE.Group();\n            rightLegGroup.position.set(0.13, 0.6, 0);\n            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.6, 0.24), legMat);\n            rightLeg.position.y = -0.3;\n            rightLegGroup.add(rightLeg);\n            group.add(rightLegGroup);\n\n            return group;\n        }\n\n        // Hostile Snail Instantiation Routine - Fully Hoisted Globally\n        function createSnail(x, z, isFixed = false) {\n            const group = new THREE.Group();\n            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc, roughness: 0.8, flatShading: true });\n            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 1.2), bodyMat);\n            body.position.y = 0.2;\n            group.add(body);\n            \n            const shellColor = isFixed ? 0x553311 : 0x8b4513;\n            const shell = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: shellColor, roughness: 0.8, flatShading: true }));\n            shell.position.set(0, 0.8, -0.1);\n            group.add(shell);\n            \n            const stalkGeo = new THREE.BoxGeometry(0.1, 0.4, 0.1);\n            const stalk1 = new THREE.Mesh(stalkGeo, bodyMat);\n            stalk1.position.set(0.2, 0.5, 0.5);\n            group.add(stalk1);\n            \n            const stalk2 = new THREE.Mesh(stalkGeo, bodyMat);\n            stalk2.position.set(-0.2, 0.5, 0.5);\n            group.add(stalk2);\n            \n            group.position.set(x, 5, z);\n            scene.add(group);\n            \n            return { \n                mesh: group, \n                isFixed: isFixed,\n                state: isFixed ? \"AMBUSHING\" : \"CHASING\",\n                patrolWaypoint: null,\n                stateTimer: Math.random() * 5,\n                restCooldown: 10 + Math.random() * 10,\n                fixedSpeed: 0\n            };\n        }\n\n        // Construct ancient voxel altars / ruin components\n        function createRuinAt(rx, rz, group, biome) {\n            const h = Math.floor(noise(rx, rz));\n            if (h < 0) return; // avoid ruins inside deep water\n\n            const ruinMat = new THREE.MeshStandardMaterial({ \n                color: biome.type === 'volcano' ? 0x222222 : 0x7a7a7a, \n                roughness: 0.9, \n                flatShading: true \n            });\n\n            // Build Altars / Archways\n            for(let dx = -1; dx <= 1; dx++) {\n                for(let dz = -1; dz <= 1; dz++) {\n                    if (dx === 0 && dz === 0) continue;\n                    const baseBlock = new THREE.Mesh(boxGeo, ruinMat);\n                    baseBlock.position.set(rx + dx, h + 1, rz + dz);\n                    group.add(baseBlock);\n                }\n            }\n\n            // High columns\n            const col1 = new THREE.Mesh(boxGeo, ruinMat);\n            col1.position.set(rx - 1, h + 2, rz - 1);\n            group.add(col1);\n\n            const col2 = new THREE.Mesh(boxGeo, ruinMat);\n            col2.position.set(rx + 1, h + 2, rz + 1);\n            group.add(col2);\n\n            const arch = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 1), ruinMat);\n            arch.position.set(rx, h + 3, rz);\n            group.add(arch);\n\n            // Spawn optional speed / warding pickups on ruins\n            const spawnType = Math.random() > 0.5 ? 'speed' : 'repellent';\n            createCollectible(rx, h + 2, rz, spawnType, group);\n        }\n\n        function createCollectible(x, y, z, type, group) {\n            const groupCol = new THREE.Group();\n            let mesh;\n            \n            if (type === 'speed') {\n                const mat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00aaaa, roughness: 0.1 });\n                mesh = new THREE.Mesh(potionGeo, mat);\n            } else {\n                const mat = new THREE.MeshStandardMaterial({ color: 0xff00bb, emissive: 0xaa0088, roughness: 0.2 });\n                mesh = new THREE.Mesh(potionGeo, mat);\n            }\n            groupCol.add(mesh);\n            groupCol.position.set(x, y, z);\n            group.add(groupCol);\n\n            // Save to track collections\n            collectibles.push({\n                mesh: groupCol,\n                type: type,\n                worldX: x,\n                worldZ: z,\n                worldY: y\n            });\n        }\n\n        function spawnSubCrystal(x, y, z, group, index) {\n            const mat = new THREE.MeshStandardMaterial({\n                color: 0xffdd00,\n                emissive: 0xff9900,\n                emissiveIntensity: 1.2,\n                roughness: 0.2\n            });\n            const mesh = new THREE.Mesh(shardGeo, mat);\n            mesh.position.set(x, y, z);\n            group.add(mesh);\n\n            // Setup localized glow light source\n            const light = new THREE.PointLight(0xffaa00, 1.5, 6);\n            mesh.add(light);\n\n            shards.push({\n                mesh: mesh,\n                worldX: x,\n                worldZ: z,\n                worldY: y,\n                id: index\n            });\n        }\n\n        function createFoliage(x, y, z, group, biome) {\n            const mat = new THREE.MeshStandardMaterial({ color: biome.foliage, roughness: 0.9, flatShading: true });\n            if (biome.type === 'desert') {\n                const height = 2 + Math.floor(Math.random() * 2);\n                for(let i = 0; i < height; i++) {\n                    const seg = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1, 0.7), mat);\n                    seg.position.set(x, y + i, z);\n                    group.add(seg);\n                    // Branch details\n                    if (i === 1 && Math.random() > 0.45) {\n                        const sideBranch = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.8), mat);\n                        sideBranch.position.set(x, y + i, z + (Math.random() > 0.5 ? 0.45 : -0.45));\n                        group.add(sideBranch);\n                    }\n                }\n                return height;\n            } else if (biome.type === 'forest') {\n                const h = 4 + Math.floor(Math.random() * 2);\n                const log = new THREE.Mesh(new THREE.BoxGeometry(0.5, h, 0.5), new THREE.MeshStandardMaterial({color: 0x5a3d28, roughness: 0.9, flatShading: true}));\n                log.position.set(x, y + h/2 - 0.5, z);\n                group.add(log);\n                const leaves = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 2.2), mat);\n                leaves.position.set(x, y + h, z);\n                group.add(leaves);\n                return h;\n            } else if (biome.type === 'snow') {\n                const h = 3 + Math.floor(Math.random() * 3);\n                const spike = new THREE.Mesh(new THREE.BoxGeometry(0.4, h, 0.4), new THREE.MeshStandardMaterial({color: 0x3d2b1f, roughness: 0.9, flatShading: true}));\n                spike.position.set(x, y + h/2 - 0.5, z);\n                group.add(spike);\n                // Dual Spruce Tiered foliage\n                const tier1 = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 1.8), mat);\n                tier1.position.set(x, y + h - 1, z);\n                group.add(tier1);\n                const tier2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.2), mat);\n                tier2.position.set(x, y + h, z);\n                group.add(tier2);\n                return h;\n            } else {\n                // Volcanic Obelisks / Obsidian Basalt Peaks\n                const h = 4 + Math.floor(Math.random() * 5);\n                const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.8, h, 0.8), mat);\n                pillar.position.set(x, y + h/2 - 0.5, z);\n                group.add(pillar);\n                // Pulsing glowing core at the bottom\n                const coreMat = new THREE.MeshStandardMaterial({ color: 0xff4400, emissive: 0xff3300, emissiveIntensity: 1.2, flatShading: true });\n                const magma = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.9), coreMat);\n                magma.position.set(x, y + 0.25, z);\n                group.add(magma);\n                return h;\n            }\n        }\n\n        // Optimized Chunk Loader using InstancedMesh\n        function loadChunk(cx, cz) {\n            const key = `${cx},${cz}`;\n            if (loadedChunks.has(key)) return;\n            const biome = BIOMES[currentBiomeIndex];\n            const group = new THREE.Group();\n            const chunkCacti = [];\n            const chunkStartX = cx * CHUNK_SIZE;\n            const chunkStartZ = cz * CHUNK_SIZE;\n\n            const sandMat = new THREE.MeshStandardMaterial({ color: biome.sand, roughness: 0.9, flatShading: true });\n            \n            // Instanced Mesh of Ground Sand Cubes\n            const groundMesh = new THREE.InstancedMesh(boxGeo, sandMat, CHUNK_SIZE * CHUNK_SIZE);\n            const dummy = new THREE.Object3D();\n            let idx = 0;\n\n            for (let x = 0; x < CHUNK_SIZE; x++) {\n                for (let z = 0; z < CHUNK_SIZE; z++) {\n                    const worldX = chunkStartX + x;\n                    const worldZ = chunkStartZ + z;\n                    const h = Math.floor(noise(worldX, worldZ));\n                    \n                    dummy.position.set(worldX, h, worldZ);\n                    dummy.updateMatrix();\n                    groundMesh.setMatrixAt(idx++, dummy.matrix);\n\n                    const seed = Math.sin(worldX * 12.9898 + worldZ * 78.233) * 43758.5453;\n                    const rand = seed - Math.floor(seed);\n                    if (rand > 0.982 && h > 0) {\n                        if (Math.abs(worldX - GEM_TARGET_POS.x) > 2 || Math.abs(worldZ - GEM_TARGET_POS.z) > 2) {\n                            const foliageH = createFoliage(worldX, h + 1, worldZ, group, biome);\n                            const cactusInfo = { \n                                x: worldX, \n                                z: worldZ, \n                                baseY: h + 0.5, \n                                topY: h + 1.0 + foliageH \n                            };\n                            chunkCacti.push(cactusInfo);\n                            \n                            // Save directly into O(1) Coordinate Key Cache\n                            cactusCache.set(`${worldX},${worldZ}`, cactusInfo);\n                        }\n                    }\n                }\n            }\n            group.add(groundMesh);\n\n            // Procedurally spawn Sub-Crystals and Ruins inside chunks\n            // Adjusted threshold from >0.6 to >0.672 to reduce ruin structure spawns by 18%\n            const chunkSeed = Math.sin(chunkStartX * 0.05 + chunkStartZ * 0.11);\n            if (chunkSeed > 0.672 && !gameWon) {\n                const rx = chunkStartX + 8;\n                const rz = chunkStartZ + 8;\n                createRuinAt(rx, rz, group, biome);\n            }\n\n            // Spawn optional Sub Crystal shards\n            if (chunkSeed < -0.65 && !gameWon && shards.length < MAX_BIOME_SHARDS) {\n                const cxLoc = chunkStartX + 5;\n                const czLoc = chunkStartZ + 5;\n                const h = Math.floor(noise(cxLoc, czLoc));\n                if (h > 0) {\n                    spawnSubCrystal(cxLoc, h + 1.8, czLoc, group, shards.length);\n                }\n            }\n\n            if (!gameWon && GEM_TARGET_POS.x >= chunkStartX && GEM_TARGET_POS.x < chunkStartX + CHUNK_SIZE && GEM_TARGET_POS.z >= chunkStartZ && GEM_TARGET_POS.z < chunkStartZ + CHUNK_SIZE) {\n                const gemH = Math.floor(noise(GEM_TARGET_POS.x, GEM_TARGET_POS.z));\n                createGem(GEM_TARGET_POS.x, gemH + 2.5, GEM_TARGET_POS.z, group, biome);\n            }\n            \n            group.userData.cacti = chunkCacti;\n            scene.add(group);\n            loadedChunks.set(key, group);\n        }\n\n        function createGem(x, y, z, group, biome) {\n            const mat = new THREE.MeshStandardMaterial({ \n                color: biome.gem, \n                emissive: biome.gem, \n                emissiveIntensity: 1.5,\n                roughness: 0.1,\n                metalness: 0.9\n            });\n            gemObject = new THREE.Mesh(gemGeo, mat);\n            gemObject.position.set(x, y, z);\n            group.add(gemObject);\n\n            // Light up the surroundings of the gem\n            const light = new THREE.PointLight(biome.gem, 3, 10);\n            gemObject.add(light);\n            \n            gemIcon.style.backgroundColor = '#' + biome.gem.toString(16).padStart(6, '0');\n            gemIcon.style.boxShadow = `0 0 15px #${biome.gem.toString(16).padStart(6, '0')}`;\n        }\n\n        function notifyBiome(name) {\n            const notif = document.createElement('div');\n            notif.className = \"biome-notif mc-ui px-6 py-3 text-center text-sm font-bold text-[#373737] mb-2\";\n            notif.innerHTML = `NEW BIOME UNLOCKED: <span style=\"color: #f28500;\">${name.toUpperCase()}<\/span>`;\n            biomeNotifContainer.appendChild(notif);\n            setTimeout(() => {\n                notif.remove();\n            }, 3000);\n        }\n\n        function updateTimer() {\n            if (gameOver || gameWon) return;\n            const elapsed = Math.floor((Date.now() - startTime) / 1000);\n            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');\n            const secs = String(elapsed % 60).padStart(2, '0');\n            timerValEl.innerText = `${mins}:${secs}`;\n        }\n\n        // Player pickups collisions (Shards / Potions)\n        function checkCollections() {\n            const px = playerGroup.position.x;\n            const pz = playerGroup.position.z;\n            const py = playerGroup.position.y;\n\n            // Check Shards\n            for(let i = shards.length - 1; i >= 0; i--) {\n                const s = shards[i];\n                const dx = px - s.worldX;\n                const dz = pz - s.worldZ;\n                const dy = py - s.worldY;\n                const distSq = dx*dx + dz*dz + dy*dy;\n                \n                if (distSq < 3.2) {\n                    // Remove from parent scene\n                    if (s.mesh.parent) s.mesh.parent.remove(s.mesh);\n                    shards.splice(i, 1);\n                    collectedShardsCount++;\n                    shardCountVal.innerText = `${collectedShardsCount}/3`;\n                    \n                    const percentDebuff = collectedShardsCount * 15;\n                    speedDebuffVal.innerText = percentDebuff;\n                    \n                    playSound('shard');\n                }\n            }\n\n            // Check Potions\n            for(let i = collectibles.length - 1; i >= 0; i--) {\n                const c = collectibles[i];\n                const dx = px - c.worldX;\n                const dz = pz - c.worldZ;\n                const dy = py - c.worldY;\n                const distSq = dx*dx + dz*dz + dy*dy;\n                \n                if (distSq < 3.2) {\n                    if (c.mesh.parent) c.mesh.parent.remove(c.mesh);\n                    collectibles.splice(i, 1);\n                    playSound('potion');\n\n                    if (c.type === 'speed') {\n                        speedBuffTime = 10.0; // 10s of speed elixir\n                    } else if (c.type === 'repellent') {\n                        repellentBuffTime = 8.0; // 8s of snail banishing repellent\n                    }\n                }\n            }\n        }\n\n        function triggerWin() {\n            gameWon = true;\n            document.exitPointerLock();\n            playSound('collect');\n            \n            overlay.style.display = 'flex';\n            overlay.classList.add('end-state');\n            overlayTitle.innerText = \"VICTORY!\";\n            overlayTitle.style.color = \"#00ffff\";\n            \n            const elapsed = Math.floor((Date.now() - startTime) / 1000);\n            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');\n            const secs = String(elapsed % 60).padStart(2, '0');\n            \n            overlayDesc.innerHTML = `You completed the trail across the Crimson Peaks!<br><br>Completion Time: <span class=\"text-[#f28500] font-bold\">${mins}:${secs}<\/span><br>Snail Army Evaded: <span class=\"text-amber-800 font-bold\">${snails.length} Hunters<\/span>`;\n            clickPrompt.innerText = \"PRESS R TO RESTART SYSTEM\";\n            controlsList.classList.add('hidden');\n        }\n\n        function triggerLose(snail) {\n            gameOver = true;\n            killerSnail = snail;\n            playerDeathPos.copy(playerGroup.position);\n            animationTime = 0;\n            document.exitPointerLock();\n            playSound('hurt');\n\n            // Apply cinematic damage red overlay\n            fadeOverlay.style.backgroundColor = 'rgba(150, 0, 0, 0.7)';\n            fadeOverlay.style.opacity = '1';\n\n            setTimeout(() => {\n                overlay.style.display = 'flex';\n                overlay.classList.add('end-state');\n                overlayTitle.innerText = \"YOU WERE ELIMINATED\";\n                overlayTitle.style.color = \"#df2020\";\n                \n                const elapsed = Math.floor((Date.now() - startTime) / 1000);\n                const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');\n                const secs = String(elapsed % 60).padStart(2, '0');\n                \n                overlayDesc.innerHTML = `The Snail Horde ambushed and caught you!<br><br>Time Survived: <span class=\"text-amber-600 font-bold\">${mins}:${secs}<\/span><br>Biomes Conquered: <span class=\"text-sky-600 font-bold\">${currentBiomeIndex} / ${BIOMES.length}<\/span>`;\n                clickPrompt.innerText = \"PRESS R TO RESTART GAME\";\n                controlsList.classList.add('hidden');\n            }, 1500);\n        }\n\n        function restartGame() {\n            currentBiomeIndex = 0;\n            gameWon = false;\n            gameOver = false;\n            gameActive = false;\n            animationTime = 0;\n            killerSnail = null;\n            velocity.set(0, 0, 0);\n\n            snails.forEach(s => scene.remove(s.mesh));\n            snails = [];\n            shards = [];\n            collectibles = [];\n            collectedShardsCount = 0;\n            shardCountVal.innerText = \"0/3\";\n            speedDebuffVal.innerText = \"0\";\n\n            playerGroup.position.set(0, 10, 0);\n            playerPrevPos.copy(playerGroup.position);\n            playerYaw = 0;\n            playerPitch = 0;\n\n            const settings = DIFFICULTY_SETTINGS[difficulty];\n            GEM_TARGET_POS = findLandSpawn(250 * settings.gemDistanceMult, 380 * settings.gemDistanceMult);\n\n            for(const group of loadedChunks.values()) {\n                scene.remove(group);\n            }\n            loadedChunks.clear();\n            cactusCache.clear(); // Wipe the coordinate lookup map\n            updateChunks();\n\n            const startSnail = createSnail(-25, -25, false);\n            snails.push(startSnail);\n            snailCountVal.innerText = snails.length;\n\n            overlayTitle.innerText = BIOMES[0].name;\n            overlayTitle.style.color = \"#f28500\";\n            overlayDesc.innerHTML = \"Locate the mystical ancient gems across multiple biomes. Collecting optional **Sub-Crystal Shards** will slow down the tracking snail horde! Watch out for dynamic weather storms!\";\n            clickPrompt.innerText = \"CLICK TO START ADVENTURE\";\n            controlsList.classList.remove('hidden');\n            overlay.classList.remove('end-state');\n            fadeOverlay.style.opacity = '0';\n            \n            hud.classList.add('hidden');\n            timerHud.classList.add('hidden');\n            snailHud.classList.add('hidden');\n            shardHud.classList.add('hidden');\n            buffHud.classList.add('hidden');\n            weatherHud.classList.add('hidden');\n\n            const startBiome = BIOMES[0];\n            biomeNameEl.innerText = startBiome.name;\n            scene.background.set(startBiome.fog);\n            scene.fog.color.set(startBiome.fog);\n\n            updateFlowField();\n        }\n\n        function updateChunks() {\n            const playerCX = Math.floor(playerGroup.position.x / CHUNK_SIZE);\n            const playerCZ = Math.floor(playerGroup.position.z / CHUNK_SIZE);\n            for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {\n                for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {\n                    loadChunk(playerCX + x, playerCZ + z);\n                }\n            }\n            for (const [key, group] of loadedChunks.entries()) {\n                const [cx, cz] = key.split(',').map(Number);\n                if (Math.abs(cx - playerCX) > RENDER_DISTANCE + 1 || Math.abs(cz - playerCZ) > RENDER_DISTANCE + 1) {\n                    scene.remove(group);\n                    \n                    // Cleanup cache map entries for unloaded coordinate clusters\n                    if (group.userData.cacti) {\n                        for (const c of group.userData.cacti) {\n                            cactusCache.delete(`${c.x},${c.z}`);\n                        }\n                    }\n                    loadedChunks.delete(key);\n                }\n            }\n            if (water) { water.position.x = playerGroup.position.x; water.position.z = playerGroup.position.z; }\n        }\n\n        // Bounded O(1) floor height sampler using coordinate cache\n        function getFloorHeight(px, pz) {\n            const sandH = Math.floor(noise(px, pz)) + 2.1;\n            let cactusH = -Infinity;\n            const checkRadius = 0.75;\n            \n            // Query only local integer grid bounding blocks instead of 9 chunk lists\n            const minX = Math.floor(px - checkRadius);\n            const maxX = Math.ceil(px + checkRadius);\n            const minZ = Math.floor(pz - checkRadius);\n            const maxZ = Math.ceil(pz + checkRadius);\n            \n            for (let x = minX; x <= maxX; x++) {\n                for (let z = minZ; z <= maxZ; z++) {\n                    const c = cactusCache.get(`${x},${z}`);\n                    if (c) {\n                        const dx = px - c.x;\n                        const dz = pz - c.z;\n                        if (dx*dx + dz*dz < checkRadius * checkRadius) {\n                            cactusH = c.topY;\n                        }\n                    }\n                }\n            }\n            return Math.max(sandH, cactusH);\n        }\n\n        // Fast local Cylinder vs Cylinder collision test using Coordinate Map\n        function checkCactusCollision(px, py, pz) {\n            const playerRadius = 0.4; \n            const cactusRadius = 0.35;\n            const minDist = playerRadius + cactusRadius;\n            const playerMinY = py;\n            const playerMaxY = py + 1.8;\n            \n            // Subdivide bounds to check adjacent coordinate hash keys\n            const minX = Math.floor(px - minDist);\n            const maxX = Math.ceil(px + minDist);\n            const minZ = Math.floor(pz - minDist);\n            const maxZ = Math.ceil(pz + minDist);\n            \n            for (let x = minX; x <= maxX; x++) {\n                for (let z = minZ; z <= maxZ; z++) {\n                    const c = cactusCache.get(`${x},${z}`);\n                    if (c) {\n                        const dx = px - c.x;\n                        const dz = pz - c.z;\n                        if (dx*dx + dz*dz < minDist * minDist) {\n                            // Perfect vertical overlap intersection\n                            const overlap = Math.max(playerMinY, c.baseY) < Math.min(playerMaxY, c.topY);\n                            if (overlap) return true;\n                        }\n                    }\n                }\n            }\n            return false;\n        }\n\n        function toggleViewMode() {\n            if (viewMode === 'firstPerson') {\n                viewMode = 'thirdPerson';\n                viewModeText.innerText = \"3RD PERSON\";\n            } else {\n                viewMode = 'firstPerson';\n                viewModeText.innerText = \"1ST PERSON\";\n            }\n        }\n\n        function checkGemCollection() {\n            if (gameWon || gameOver || !gemObject) return;\n            const dx = playerGroup.position.x - GEM_TARGET_POS.x;\n            const dz = playerGroup.position.z - GEM_TARGET_POS.z;\n            if (dx*dx + dz*dz < 2.5) {\n                if (gemObject.parent) gemObject.parent.remove(gemObject);\n                gemObject = null;\n                playSound('collect');\n                \n                if (currentBiomeIndex === BIOMES.length - 1) {\n                    triggerWin();\n                    return;\n                }\n\n                const playerVelocity = new THREE.Vector3().subVectors(playerGroup.position, playerPrevPos).multiplyScalar(60);\n                const trajectory = playerVelocity.length() > 0.1 ? playerVelocity.normalize() : new THREE.Vector3(1,0,0);\n\n                const settings = DIFFICULTY_SETTINGS[difficulty];\n\n                const activeSnail = snails.find(s => !s.isFixed);\n                if (activeSnail) {\n                    activeSnail.isFixed = true;\n                    activeSnail.mesh.children[1].material = new THREE.MeshStandardMaterial({ color: 0x553311, roughness: 0.8, flatShading: true });\n                }\n\n                snails.forEach(s => {\n                    if (s.isFixed) {\n                        const ambushPoint = findLandSpawn(130 * settings.gemDistanceMult, 220 * settings.gemDistanceMult, playerGroup.position, trajectory);\n                        s.mesh.position.set(ambushPoint.x, 5, ambushPoint.z);\n                        s.state = \"AMBUSHING\";\n                        s.stateTimer = 0;\n                    }\n                });\n\n                // Spawn next tracking active hunter with strict count caps scaled by settings\n                const maxSnailsAllowed = Math.max(1, Math.floor((currentBiomeIndex + 2) * settings.snailCountMult));\n                if (snails.length < maxSnailsAllowed) {\n                    const spawnPos = findLandSpawn(70 * settings.gemDistanceMult, 100 * settings.gemDistanceMult, playerGroup.position);\n                    const newSnail = createSnail(spawnPos.x, spawnPos.z, false);\n                    snails.push(newSnail);\n                }\n                \n                activeSnailStartTime = Date.now();\n                snailCountVal.innerText = snails.length;\n\n                // Clear shards & pickups of old biome\n                shards = [];\n                collectibles = [];\n                collectedShardsCount = 0;\n                shardCountVal.innerText = \"0/3\";\n                speedDebuffVal.innerText = \"0\";\n\n                currentBiomeIndex = (currentBiomeIndex + 1) % BIOMES.length;\n                const nextBiome = BIOMES[currentBiomeIndex];\n                GEM_TARGET_POS = findLandSpawn(350 * settings.gemDistanceMult, 480 * settings.gemDistanceMult, playerGroup.position, trajectory);\n\n                biomeNameEl.innerText = nextBiome.name;\n                notifyBiome(nextBiome.name);\n            }\n        }\n\n        function updateDistanceHUD() {\n            if (gameWon || gameOver) return;\n            const dx = playerGroup.position.x - GEM_TARGET_POS.x;\n            const dz = playerGroup.position.z - GEM_TARGET_POS.z;\n            distValueEl.innerText = Math.floor(Math.sqrt(dx*dx + dz*dz));\n        }\n\n        function updateFlowField() {\n            if (gameWon || gameOver) return;\n\n            const playerVelocity = new THREE.Vector3().subVectors(playerGroup.position, playerPrevPos).multiplyScalar(60);\n            const trajectory = playerVelocity.length() > 0.1 ? playerVelocity.normalize() : new THREE.Vector3(0, 0, 0);\n            \n            const leadTime = 1.5;\n            const targetX = Math.round(playerGroup.position.x + trajectory.x * playerVelocity.length() * leadTime);\n            const targetZ = Math.round(playerGroup.position.z + trajectory.z * playerVelocity.length() * leadTime);\n            \n            flowFieldCenterX = targetX;\n            flowFieldCenterZ = targetZ;\n            \n            const distGrid = Array(FLOW_GRID_SIZE).fill().map(() => Array(FLOW_GRID_SIZE).fill(Infinity));\n            const startX = FLOW_GRID_RADIUS;\n            const startZ = FLOW_GRID_RADIUS;\n            distGrid[startX][startZ] = 0;\n            \n            const queue = [{x: startX, z: startZ, dist: 0}];\n            \n            // Ultra-optimized O(1) cache check replacing loops inside the inner Dijkstra solver\n            function isCactusAt(worldX, worldZ) {\n                return cactusCache.has(`${worldX},${worldZ}`);\n            }\n            \n            const settings = DIFFICULTY_SETTINGS[difficulty];\n            const terrainPenaltyMult = 1 / settings.snailAggression; // High aggression means less penalty from vertical block steps\n            \n            while (queue.length > 0) {\n                let minIdx = 0;\n                for (let i = 1; i < queue.length; i++) {\n                    if (queue[i].dist < queue[minIdx].dist) minIdx = i;\n                }\n                const curr = queue.splice(minIdx, 1)[0];\n                if (curr.dist > distGrid[curr.x][curr.z]) continue;\n                \n                const neighbors = [\n                    {dx: 1, dz: 0}, {dx: -1, dz: 0}, {dx: 0, dz: 1}, {dx: 0, dz: -1},\n                    {dx: 1, dz: 1}, {dx: -1, dz: 1}, {dx: 1, dz: -1}, {dx: -1, dz: -1}\n                ];\n                \n                for (const n of neighbors) {\n                    const nx = curr.x + n.dx;\n                    const nz = curr.z + n.dz;\n                    \n                    if (nx >= 0 && nx < FLOW_GRID_SIZE && nz >= 0 && nz < FLOW_GRID_SIZE) {\n                        const worldX = flowFieldCenterX - FLOW_GRID_RADIUS + nx;\n                        const worldZ = flowFieldCenterZ - FLOW_GRID_RADIUS + nz;\n                        \n                        let penalty = 0;\n                        const h = noise(worldX, worldZ);\n                        \n                        if (h < WATER_LEVEL) {\n                            penalty += 8.0 * terrainPenaltyMult; \n                        }\n                        if (isCactusAt(worldX, worldZ)) {\n                            penalty += 150.0;\n                        }\n                        \n                        const currWorldX = flowFieldCenterX - FLOW_GRID_RADIUS + curr.x;\n                        const currWorldZ = flowFieldCenterZ - FLOW_GRID_RADIUS + curr.z;\n                        const currH = noise(currWorldX, currWorldZ);\n                        if (Math.abs(h - currH) > 1.2) {\n                            penalty += 50.0 * terrainPenaltyMult;\n                        }\n                        \n                        const stepDist = (n.dx !== 0 && n.dz !== 0) ? 1.414 : 1.0;\n                        const nextDist = curr.dist + stepDist + penalty;\n                        \n                        if (nextDist < distGrid[nx][nz]) {\n                            distGrid[nx][nz] = nextDist;\n                            queue.push({x: nx, z: nz, dist: nextDist});\n                        }\n                    }\n                }\n            }\n            \n            flowField = distGrid;\n        }\n\n        function getPathfindingDirection(sx, sz, snailObj) {\n            if (!flowField) return { x: 0, z: 0 };\n            \n            const gridX = Math.round(sx - flowFieldCenterX + FLOW_GRID_RADIUS);\n            const gridZ = Math.round(sz - flowFieldCenterZ + FLOW_GRID_RADIUS);\n            \n            if (gridX < 1 || gridX >= FLOW_GRID_SIZE - 1 || gridZ < 1 || gridZ >= FLOW_GRID_SIZE - 1) {\n                const targetX = flowFieldCenterX;\n                const targetZ = flowFieldCenterZ;\n                const dx = targetX - sx;\n                const dz = targetZ - sz;\n                const dist = Math.sqrt(dx*dx + dz*dz);\n                if (dist === 0) return { x: 0, z: 0 };\n                return { x: dx / dist, z: dz / dist };\n            }\n            \n            const neighbors = [\n                {x: 1, z: 0}, {x: -1, z: 0}, {x: 0, z: 1}, {x: 0, z: -1},\n                {x: 1, z: 1}, {x: -1, z: 1}, {x: 1, z: -1}, {x: -1, z: -1}\n            ];\n            \n            let bestNeighbor = null;\n            let minCost = Infinity;\n            \n            for (const n of neighbors) {\n                const nx = gridX + n.x;\n                const nz = gridZ + n.z;\n                const cost = flowField[nx][nz];\n                if (cost < minCost) {\n                    minCost = cost;\n                    bestNeighbor = n;\n                }\n            }\n            \n            if (bestNeighbor) {\n                const len = Math.sqrt(bestNeighbor.x * bestNeighbor.x + bestNeighbor.z * bestNeighbor.z);\n                return { x: bestNeighbor.x / len, z: bestNeighbor.z / len };\n            }\n            return { x: 0, z: 0 };\n        }\n\n        function updateSnailBehavior(s, dist, delta) {\n            s.stateTimer += delta;\n            \n            if (s.isFixed) {\n                if (s.state === \"AMBUSHING\") {\n                    if (dist < 35) {\n                        s.state = \"CHASING\"; \n                        s.stateTimer = 0;\n                    }\n                } else if (s.state === \"CHASING\") {\n                    if (dist > 55) {\n                        s.state = \"AMBUSHING\"; \n                        s.stateTimer = 0;\n                    }\n                }\n            } else {\n                if (s.state === \"CHASING\") {\n                    s.restCooldown -= delta;\n                    if (s.restCooldown <= 0) {\n                        s.state = \"RESTING\";\n                        s.stateTimer = 0;\n                        s.restCooldown = 12 + Math.random() * 8;\n                    } else if (dist > 120) {\n                        s.state = \"PATROLLING\";\n                        s.stateTimer = 0;\n                        s.patrolWaypoint = null;\n                    }\n                } else if (s.state === \"RESTING\") {\n                    if (s.stateTimer > 1.5) {\n                        s.state = \"CHASING\";\n                        s.stateTimer = 0;\n                    }\n                } else if (s.state === \"PATROLLING\") {\n                    if (dist < 100) {\n                        s.state = \"CHASING\";\n                        s.stateTimer = 0;\n                    }\n                }\n            }\n        }\n\n        function getRubberBandFactor(s, dist) {\n            if (s.isFixed) {\n                const retiredSnails = snails.filter(item => item.isFixed);\n                const retiredIndex = retiredSnails.indexOf(s);\n                const baseFactor = FIXED_SNAIL_FACTORS[Math.min(retiredIndex >= 0 ? retiredIndex : 0, FIXED_SNAIL_FACTORS.length - 1)];\n                return dist < DANGER_ZONE ? baseFactor * 0.6 : baseFactor;\n            }\n            \n            if (dist >= DANGER_ZONE) {\n                return FAR_SPEED_FACTOR; \n            } else {\n                const ratio = dist / DANGER_ZONE; \n                return CLOSE_SPEED_FACTOR + (FAR_SPEED_FACTOR - CLOSE_SPEED_FACTOR) * ratio; \n            }\n        }\n\n        function updateSnails(delta) {\n            if (gameOver || gameWon) return;\n            \n            let minSnailDist = Infinity;\n            let activeSnailState = \"STALKING\";\n            const settings = DIFFICULTY_SETTINGS[difficulty];\n\n            // Shard collection speed reduction (0% to 45% debuff)\n            const speedDebuffMultiplier = 1.0 - (collectedShardsCount * 0.15);\n\n            snails.forEach(s => {\n                const dx = playerGroup.position.x - s.mesh.position.x;\n                const dz = playerGroup.position.z - s.mesh.position.z;\n                const dist = Math.sqrt(dx*dx + dz*dz);\n                if (dist < minSnailDist) minSnailDist = dist;\n\n                if (dist < 1.1) { triggerLose(s); return; }\n\n                updateSnailBehavior(s, dist, delta);\n\n                let currentSpeed = 0;\n                if (s.state === \"CHASING\") {\n                    const factor = getRubberBandFactor(s, dist);\n                    currentSpeed = factor * PLAYER_BASE_SPEED * settings.snailSpeedMult * speedDebuffMultiplier;\n                    if (!s.isFixed) {\n                        activeSnailState = dist > DANGER_ZONE ? \"STALKING\" : \"AMBUSH ZONE\";\n                    }\n                } else if (s.state === \"PATROLLING\") {\n                    currentSpeed = 0.035 * PLAYER_BASE_SPEED * settings.snailSpeedMult * speedDebuffMultiplier; \n                    if (!s.isFixed) activeSnailState = \"SEARCHING\";\n                } else if (s.state === \"RESTING\") {\n                    currentSpeed = 0;\n                    if (!s.isFixed) activeSnailState = \"RESTING\";\n                } else if (s.state === \"AMBUSHING\") {\n                    currentSpeed = 0;\n                    if (!s.isFixed) activeSnailState = \"LURKING\";\n                }\n\n                // Snail Repellent Effect active\n                if (repellentBuffTime > 0) {\n                    currentSpeed *= -0.75; // force them to move backward/scared!\n                    activeSnailState = \"\u26a0\ufe0f PANICKED\";\n                }\n\n                const sHeight = noise(s.mesh.position.x, s.mesh.position.z);\n                const inWater = sHeight < WATER_LEVEL;\n                const speedMult = inWater ? 0.45 : 1.0;\n                currentSpeed *= speedMult;\n\n                if (Math.abs(currentSpeed) > 0) {\n                    let moveDir = { x: 0, z: 0 };\n                    \n                    if (s.state === \"PATROLLING\") {\n                        if (!s.patrolWaypoint || s.mesh.position.distanceTo(s.patrolWaypoint) < 2) {\n                            const wp = findLandSpawn(20, 50, s.mesh.position);\n                            s.patrolWaypoint = new THREE.Vector3(wp.x, s.mesh.position.y, wp.z);\n                        }\n                        const toWp = new THREE.Vector3().subVectors(s.patrolWaypoint, s.mesh.position);\n                        toWp.y = 0;\n                        if (toWp.length() > 0.1) {\n                            toWp.normalize();\n                            moveDir = { x: toWp.x, z: toWp.z };\n                        }\n                    } else {\n                        moveDir = getPathfindingDirection(s.mesh.position.x, s.mesh.position.z, s);\n                        if (repellentBuffTime > 0) {\n                            // Reverse the movement direction\n                            moveDir.x = -moveDir.x;\n                            moveDir.z = -moveDir.z;\n                        }\n                    }\n\n                    if (moveDir.x !== 0 || moveDir.z !== 0) {\n                        const moveAmt = currentSpeed * delta;\n                        s.mesh.position.x += moveDir.x * moveAmt;\n                        s.mesh.position.z += moveDir.z * moveAmt;\n                        s.mesh.lookAt(s.mesh.position.x + moveDir.x, s.mesh.position.y, s.mesh.position.z + moveDir.z);\n                    }\n                }\n\n                // Smoothly adjust snail heights relative to terrain mesh with lerp clamping\n                const sFloor = getFloorHeight(s.mesh.position.x, s.mesh.position.z) - 1.7;\n                s.mesh.position.y = THREE.MathUtils.lerp(s.mesh.position.y, sFloor, 0.15);\n\n                // Crawling visual wiggly feedback\n                if (Math.abs(currentSpeed) > 0) {\n                    const wiggle = Math.sin(Date.now() * 0.012 + s.stateTimer) * 0.14;\n                    s.mesh.children[0].scale.z = 1.0 + Math.sin(Date.now() * 0.015) * 0.06; \n                    s.mesh.children[2].rotation.x = wiggle; \n                    s.mesh.children[3].rotation.x = -wiggle; \n                }\n            });\n\n            snailDistVal.innerText = Math.floor(minSnailDist);\n            snailModeEl.innerText = activeSnailState;\n            snailWarning.classList.toggle('hidden', minSnailDist > 25);\n        }\n\n        function init() {\n            scene = new THREE.Scene();\n            const startBiome = BIOMES[0];\n            scene.background = new THREE.Color(startBiome.fog);\n            scene.fog = new THREE.Fog(startBiome.fog, 18, 75);\n            \n            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);\n            camera.rotation.order = 'YXZ';\n            \n            renderer = new THREE.WebGLRenderer({ antialias: false });\n            renderer.setSize(window.innerWidth, window.innerHeight); \n            renderer.setPixelRatio(window.devicePixelRatio ? Math.min(window.devicePixelRatio, 1.5) : 1);\n            document.body.appendChild(renderer.domElement);\n            \n            clock = new THREE.Clock(); \n            scene.add(new THREE.AmbientLight(0xffffff, 0.5));\n            \n            const sunLight = new THREE.DirectionalLight(0xfff8ee, 0.85); \n            sunLight.position.set(50, 100, 50); \n            scene.add(sunLight);\n            \n            const waterGeo = new THREE.PlaneGeometry(350, 350);\n            const waterMat = new THREE.MeshStandardMaterial({ \n                color: WATER_COLOR, \n                transparent: true, \n                opacity: 0.65,\n                roughness: 0.2,\n                metalness: 0.1\n            });\n            water = new THREE.Mesh(waterGeo, waterMat); \n            water.rotation.x = -Math.PI / 2; \n            water.position.y = WATER_LEVEL; \n            scene.add(water);\n            \n            playerGroup = new THREE.Group();\n            playerGroup.position.set(0, 10, 0);\n            scene.add(playerGroup);\n\n            playerMesh = createPlayerMesh();\n            playerGroup.add(playerMesh);\n\n            const startSnail = createSnail(-25, -25, false); \n            snails.push(startSnail);\n            \n            playerPrevPos.copy(playerGroup.position);\n\n            updateChunks();\n            updateFlowField(); \n\n            document.addEventListener('keydown', onKeyDown); \n            document.addEventListener('keyup', onKeyUp);\n            \n            viewToggleBtn.addEventListener('click', (e) => {\n                e.stopPropagation(); \n                toggleViewMode();\n                if (!audioCtx) playSound('jump');\n            });\n\n            overlay.addEventListener('click', () => {\n                if (gameOver || gameWon) return;\n                \n                // Initialize Web Audio API on first tap\n                if (!audioCtx) {\n                    playSound('jump');\n                }\n\n                document.body.requestPointerLock();\n                hud.classList.remove('hidden'); \n                timerHud.classList.remove('hidden'); \n                snailHud.classList.remove('hidden');\n                shardHud.classList.remove('hidden');\n                buffHud.classList.remove('hidden');\n                if (!gameActive) { \n                    gameActive = true; \n                    startTime = Date.now(); \n                    activeSnailStartTime = Date.now(); \n                }\n            });\n\n            document.addEventListener('pointerlockchange', () => {\n                if (gameOver || gameWon) return;\n                if (document.pointerLockElement !== document.body) {\n                    overlay.style.display = 'flex';\n                } else {\n                    overlay.style.display = 'none';\n                }\n            });\n\n            document.addEventListener('mousemove', (e) => {\n                if (document.pointerLockElement === document.body && !gameOver && !gameWon) {\n                    playerYaw -= e.movementX * 0.0022;\n                    const newPitch = playerPitch - e.movementY * 0.0022;\n                    playerPitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, newPitch));\n                }\n            });\n\n            animate();\n        }\n\n        function onKeyDown(e) {\n            switch (e.code) {\n                case 'KeyW': moveForward = true; break; \n                case 'KeyS': moveBackward = true; break;\n                case 'KeyA': moveLeft = true; break; \n                case 'KeyD': moveRight = true; break;\n                case 'KeyV': toggleViewMode(); break; \n                case 'KeyR':\n                    if (gameOver || gameWon) {\n                        restartGame();\n                    }\n                    break;\n                case 'Space': \n                    if (canJump && gameActive && !gameOver && !gameWon) { \n                        const inWater = (playerGroup.position.y - 1.6) < WATER_LEVEL; \n                        velocity.y += inWater ? 8 : 12; \n                        canJump = false; \n                        playSound('jump');\n                    } \n                    break;\n                case 'ShiftLeft': isSprinting = true; break;\n            }\n        }\n\n        function onKeyUp(e) {\n            switch (e.code) {\n                case 'KeyW': moveForward = false; break; \n                case 'KeyS': moveBackward = false; break;\n                case 'KeyA': moveLeft = false; break; \n                case 'KeyD': moveRight = false; break;\n                case 'ShiftLeft': isSprinting = false; break;\n            }\n        }\n\n        function animate() {\n            requestAnimationFrame(animate);\n            const delta = Math.min(clock.getDelta(), 0.1);\n            const biome = BIOMES[currentBiomeIndex];\n            const settings = DIFFICULTY_SETTINGS[difficulty];\n            \n            if (gemObject) { \n                gemObject.rotation.y += 0.04; \n                gemObject.position.y += Math.sin(Date.now() * 0.0025) * 0.004; \n            }\n\n            // Spin shards/collectibles\n            shards.forEach(s => { s.mesh.rotation.y += 0.03; });\n            collectibles.forEach(c => { c.mesh.rotation.y += 0.02; });\n\n            if (gameOver) {\n                animationTime += delta;\n                const snailPos = killerSnail.mesh.position;\n                const camTarget = new THREE.Vector3().copy(playerDeathPos).add(new THREE.Vector3(4, 3, 4));\n                camera.position.lerp(camTarget, 0.04);\n                camera.lookAt(snailPos);\n                if (animationTime > 1.1) {\n                    killerSnail.mesh.position.lerp(camera.position, 0.08);\n                    killerSnail.mesh.scale.addScalar(0.04);\n                }\n            } else if (gameWon) {\n                animationTime += delta;\n                camera.position.y += delta * 6;\n                camera.position.x += Math.cos(animationTime * 1.5) * 0.25;\n                camera.position.z += Math.sin(animationTime * 1.5) * 0.25;\n                camera.rotation.y += delta * 1.5;\n                camera.rotation.x -= delta * 0.45;\n            } else if (document.pointerLockElement === document.body && gameActive) {\n                \n                // --- STORM WEATHER CYCLE SYSTEM ---\n                stormCycleTimer += delta;\n                if (!isStormActive) {\n                    if (stormCycleTimer >= STORM_INTERVAL) {\n                        isStormActive = true;\n                        stormCycleTimer = 0;\n                        document.body.classList.add('storm-shake');\n                        weatherHud.classList.remove('hidden');\n                        weatherTitle.innerText = `\u26a0\ufe0f ${biome.stormName.toUpperCase()} ACTIVE \u26a0\ufe0f`;\n                    }\n                } else {\n                    weatherTimer.innerText = String(Math.ceil(STORM_DURATION - stormCycleTimer)).padStart(2, '0') + \"s\";\n                    if (Math.random() > 0.8) playSound('storm');\n\n                    if (stormCycleTimer >= STORM_DURATION) {\n                        isStormActive = false;\n                        stormCycleTimer = 0;\n                        document.body.classList.remove('storm-shake');\n                        weatherHud.classList.add('hidden');\n                    }\n                }\n\n                // --- ACTIVE BUFF DECAY & HUD UPDATES ---\n                if (speedBuffTime > 0) {\n                    speedBuffTime -= delta;\n                    buffSpeedEl.classList.remove('hidden');\n                    buffSpeedTime.innerText = Math.ceil(speedBuffTime);\n                    if (speedBuffTime <= 0) buffSpeedEl.classList.add('hidden');\n                }\n                if (repellentBuffTime > 0) {\n                    repellentBuffTime -= delta;\n                    buffRepellentEl.classList.remove('hidden');\n                    buffRepellentTime.innerText = Math.ceil(repellentBuffTime);\n                    if (repellentBuffTime <= 0) buffRepellentEl.classList.add('hidden');\n                }\n\n                // Change Fog on Storm Cycle\n                const isUnderwater = camera.position.y <= WATER_LEVEL;\n                if (isUnderwater) { \n                    scene.background.set(0x002244); \n                    scene.fog.color.set(0x002244); \n                    scene.fog.near = 1; \n                    scene.fog.far = 12; \n                } else { \n                    let targetFogColor = biome.fog;\n                    let targetFogFar = 75;\n                    \n                    if (isStormActive) {\n                        targetFogFar = 16; // Dramatic reduction of visibility during a storm\n                        if (biome.type === 'desert') targetFogColor = 0xc68d40;\n                        else if (biome.type === 'forest') targetFogColor = 0x0a1505;\n                        else if (biome.type === 'snow') targetFogColor = 0xeeeeee;\n                        else if (biome.type === 'volcano') targetFogColor = 0x110000;\n                    }\n\n                    scene.background.lerp(new THREE.Color(targetFogColor), 0.05); \n                    scene.fog.color.lerp(new THREE.Color(targetFogColor), 0.05); \n                    scene.fog.near = 18; \n                    scene.fog.far = THREE.MathUtils.lerp(scene.fog.far, targetFogFar, 0.05); \n                }\n                \n                const friction = isUnderwater ? 14.0 : 9.5; \n                const gravity = isUnderwater ? 4.5 : 9.8 * 3.2; \n                const speedMult = isUnderwater ? 0.38 : 1.0;\n                \n                velocity.x -= velocity.x * friction * delta; \n                velocity.z -= velocity.z * friction * delta; \n                velocity.y -= gravity * delta; \n                \n                const localDir = new THREE.Vector3();\n                if (moveForward) localDir.z -= 1; \n                if (moveBackward) localDir.z += 1;\n                if (moveLeft) localDir.x -= 1; \n                if (moveRight) localDir.x += 1;\n                localDir.normalize();\n                \n                // Speed Elixir scale (boosts player speeds by 1.6x)\n                const speedBuffMult = speedBuffTime > 0 ? 1.6 : 1.0;\n                const baseSpeed = (isSprinting ? 120.0 : 60.0) * speedBuffMult;\n                const worldDir = localDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), playerYaw);\n                \n                velocity.x += worldDir.x * baseSpeed * speedMult * delta;\n                velocity.z += worldDir.z * baseSpeed * speedMult * delta;\n                \n                playerPrevPos.copy(playerGroup.position);\n                const oldPos = playerGroup.position.clone();\n                const currentFloor = getFloorHeight(playerGroup.position.x, playerGroup.position.z);\n                \n                // Axis-isolated block collision checks with dynamic step-up logic (clears up to 1-block differences)\n                const STEP_HEIGHT = 1.05;\n                \n                // Try moving along X\n                playerGroup.position.x += velocity.x * delta;\n                let floorX = getFloorHeight(playerGroup.position.x, playerGroup.position.z);\n                let collisionX = (floorX > playerGroup.position.y + 0.1) || checkCactusCollision(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z);\n                \n                if (collisionX) {\n                    let steppedUp = false;\n                    let heightDiff = floorX - playerGroup.position.y;\n                    if (heightDiff <= STEP_HEIGHT) {\n                        // Test stepping up vertically\n                        let testY = floorX;\n                        if (!checkCactusCollision(playerGroup.position.x, testY, playerGroup.position.z)) {\n                            playerGroup.position.y = testY;\n                            steppedUp = true;\n                        }\n                    }\n                    if (!steppedUp) {\n                        playerGroup.position.x = oldPos.x;\n                        velocity.x = 0;\n                    }\n                }\n                \n                // Try moving along Z\n                playerGroup.position.z += velocity.z * delta;\n                let floorZ = getFloorHeight(playerGroup.position.x, playerGroup.position.z);\n                let collisionZ = (floorZ > playerGroup.position.y + 0.1) || checkCactusCollision(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z);\n                \n                if (collisionZ) {\n                    let steppedUp = false;\n                    let heightDiff = floorZ - playerGroup.position.y;\n                    if (heightDiff <= STEP_HEIGHT) {\n                        // Test stepping up vertically\n                        let testY = floorZ;\n                        if (!checkCactusCollision(playerGroup.position.x, testY, playerGroup.position.z)) {\n                            playerGroup.position.y = testY;\n                            steppedUp = true;\n                        }\n                    }\n                    if (!steppedUp) {\n                        playerGroup.position.z = oldPos.z;\n                        velocity.z = 0;\n                    }\n                }\n                \n                playerGroup.position.y += velocity.y * delta;\n                const floorHeight = getFloorHeight(playerGroup.position.x, playerGroup.position.z);\n                if (playerGroup.position.y < floorHeight) { \n                    velocity.y = 0; \n                    playerGroup.position.y = floorHeight; \n                    canJump = true; \n                }\n                \n                // Camera / Avatar movement swaying & bobbing logic\n                const isMoving = moveForward || moveBackward || moveLeft || moveRight;\n                if (isMoving && !isUnderwater) {\n                    playerGroup.position.y += Math.sin(Date.now() * 0.015) * 0.045;\n                    \n                    const swingSpeed = isSprinting ? 0.022 : 0.014;\n                    const swing = Math.sin(Date.now() * swingSpeed) * 0.75;\n                    playerMesh.children[3].rotation.x = -swing; // Left Arm\n                    playerMesh.children[4].rotation.x = swing;  // Right Arm\n                    playerMesh.children[5].rotation.x = swing;  // Left Leg\n                    playerMesh.children[6].rotation.x = -swing; // Right Leg\n                } else {\n                    playerMesh.children[3].rotation.x = 0;\n                    playerMesh.children[4].rotation.x = 0;\n                    playerMesh.children[5].rotation.x = 0;\n                    playerMesh.children[6].rotation.x = 0;\n                }\n                \n                playerMesh.rotation.y = playerYaw;\n\n                // Perspective camera offsets with collision adjustment to prevent clipping\n                if (viewMode === 'firstPerson') {\n                    playerMesh.visible = false;\n                    camera.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.6, 0));\n                    camera.rotation.set(playerPitch, playerYaw, 0, 'YXZ');\n                } else {\n                    playerMesh.visible = true;\n                    const offset = new THREE.Vector3(0, 0, 4.5); \n                    offset.applyEuler(new THREE.Euler(playerPitch, playerYaw, 0));\n                    \n                    const eyePos = playerGroup.position.clone().add(new THREE.Vector3(0, 1.6, 0));\n                    const idealCamPos = playerGroup.position.clone().add(new THREE.Vector3(0, 1.8, 0)).add(offset);\n                    \n                    // Raycast check: subdivide the path from eyePos to idealCamPos to detect floor/foliage clipping\n                    let actualCamPos = idealCamPos.clone();\n                    const steps = 8;\n                    for (let i = 1; i <= steps; i++) {\n                        const t = i / steps;\n                        const testPos = new THREE.Vector3().lerpVectors(eyePos, idealCamPos, t);\n                        \n                        // Check terrain collision at testPos\n                        const floorAtTest = getFloorHeight(testPos.x, testPos.z);\n                        if (testPos.y < floorAtTest + 0.3) {\n                            actualCamPos.copy(testPos);\n                            actualCamPos.y = Math.max(actualCamPos.y, floorAtTest + 0.3);\n                            break;\n                        }\n                        \n                        // Check cactus/foliage collision\n                        if (checkCactusCollision(testPos.x, testPos.y - 0.5, testPos.z)) {\n                            actualCamPos.copy(testPos);\n                            break;\n                        }\n                    }\n                    \n                    camera.position.copy(actualCamPos);\n                    camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0)));\n                }\n\n                // Dynamic heartbeat monitor pulses faster as the snails get closer\n                const closestSnailDist = parseFloat(snailDistVal.innerText);\n                if (!isNaN(closestSnailDist) && closestSnailDist < 25) {\n                    const now = Date.now();\n                    const pulseRate = Math.max(180, closestSnailDist * 35); \n                    if (now - lastHeartbeatTime > pulseRate) {\n                        playSound('heartbeat');\n                        lastHeartbeatTime = now;\n                    }\n                }\n\n                pathfindingFrameCount++;\n                if (pathfindingFrameCount % settings.flowUpdateInterval === 0) {\n                    updateFlowField();\n                }\n\n                checkCollections();\n                updateSnails(delta); \n                updateTimer(); \n                checkGemCollection(); \n                updateDistanceHUD(); \n                updateChunks();\n            }\n\n            if (water) {\n                // Realistic water surface waves bobbing\n                water.position.y = WATER_LEVEL + Math.sin(Date.now() * 0.0012) * 0.04;\n            }\n\n            renderer.render(scene, camera);\n        }\n        \n        window.addEventListener('resize', () => { \n            if (camera && renderer) {\n                camera.aspect = window.innerWidth / window.innerHeight; \n                camera.updateProjectionMatrix(); \n                renderer.setSize(window.innerWidth, window.innerHeight); \n            }\n        });\n        window.onload = init;\n    <\/script>\n<\/body>\n<\/html>", "page_1": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>The Scribe's Armorial<\/title>\n    <!-- React & Babel CDNs -->\n    <script src=\"https://unpkg.com/react@18/umd/react.production.min.js\" crossorigin><\/script>\n    <script src=\"https://unpkg.com/react-dom@18/umd/react-dom.production.min.js\" crossorigin><\/script>\n    <script src=\"https://unpkg.com/@babel/standalone/babel.min.js\"><\/script>\n    <!-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <!-- Google Fonts -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">\n    \n    <style>\n        body {\n            font-family: 'Inter', sans-serif;\n        }\n        .medieval-font {\n            font-family: 'Cinzel', serif;\n        }\n        /* Custom scrollbar style matching your design */\n        .scrollbar-thin::-webkit-scrollbar { \n            width: 6px; \n        }\n        .scrollbar-thin::-webkit-scrollbar-track { \n            background: #020617; \n        }\n        .scrollbar-thin::-webkit-scrollbar-thumb { \n            background: #1e293b; \n            border-radius: 3px; \n        }\n    <\/style>\n<\/head>\n<body class=\"bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950\">\n    <div id=\"root\"><\/div>\n\n    <script type=\"text/babel\">\n        const { useState, useEffect, useMemo } = React;\n\n        const PALETTE_EFFECTS = [\n            { id: 'shiny', name: '\u2728 Shiny Metal' },\n            { id: 'stone', name: '\ud83e\udea8 Carved Stone' },\n            { id: 'plaster', name: '\ud83e\uddf1 Ancient Plaster' },\n            { id: 'vellum', name: '\ud83d\udcdc Old Vellum' },\n            { id: 'plain', name: '\ud83c\udfa8 Classic Flat' }\n        ];\n\n        const QUESTIONS = [\n            \"When a close friend is upset, your natural instinct is to offer a practical, step-by-step solution rather than just emotional validation.\",\n            \"You find yourself highly affected by the visual aesthetics, lighting, or cleanliness of the room you are sitting in.\",\n            \"If a cashier accidentally gives you five dollars too much in change, you would feel genuinely uncomfortable keeping it and would return it.\",\n            \"You feel more energized after a lively, deep conversation with a group of people than after a quiet evening alone with a book or movie.\",\n            \"Your desk, digital files, or living spaces are meticulously organized; chaos in your environment stresses you out.\",\n            \"You rarely feel intense anxiety or worry about worst-case scenarios; you tend to trust that things will work out.\",\n            \"You are deeply fascinated by abstract theories, philosophy, or complex systemic concepts that don't have an immediate practical application.\",\n            \"If someone cuts you off in traffic or treats you unfairly, you find it easy to let go of the anger quickly.\",\n            \"You prefer a predictable routine over a spontaneo
