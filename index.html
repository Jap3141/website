hargeQuantity = \"three\";\n                pluralSuffix = \"s\";\n            }\n\n            let attitude = \"\";\n            if (['lion', 'wolf', 'griffin', 'boar'].includes(chargeType)) {\n                if (qCompetitive === 5) {\n                    attitude = \" rampant\";\n                } else if (qObserver === 5) {\n                    attitude = \" statant guardant\";\n                } else {\n                    attitude = \" passant\";\n                }\n            } else if (['eagle', 'falcon', 'dove'].includes(chargeType)) {\n                if (qCompetitive === 5) {\n                    attitude = \" displayed\";\n                } else {\n                    attitude = \" close\";\n                }\n            }\n\n            const qFreedom = userAnswers[21];\n            if (qFreedom === 5) {\n                if (['lion', 'wolf', 'griffin', 'boar'].includes(chargeType)) {\n                    attitude += \" crowned\";\n                } else {\n                    attitude += \" winged\";\n                }\n            }\n\n            let chargeMetal = primary.metals[0] === 'or' ? 'argent' : 'or';\n            if (ordinaryMetal === chargeMetal) {\n                chargeMetal = ordinaryMetal === 'or' ? 'argent' : 'or';\n            }\n            if (field.toLowerCase().includes(chargeMetal)) {\n                chargeMetal = chargeMetal === 'or' ? 'gules' : 'azure';\n            }\n\n            let chargePhrase = \"\";\n            if (chargeQuantity === \"three\") {\n                chargePhrase = `, three ${chargeType}${pluralSuffix}${attitude} ${chargeMetal}`;\n                if (ordinary) {\n                    chargePhrase = ` between three ${chargeType}${pluralSuffix}${attitude} ${chargeMetal}`;\n                }\n            } else {\n                chargePhrase = `, ${chargeQuantity} ${chargeType}${attitude} ${chargeMetal}`;\n                if (ordinary) {\n                    chargePhrase = ` overall ${chargeQuantity} ${chargeType}${attitude} ${chargeMetal}`;\n                }\n            }\n\n            // --- LAYER 4: HISTORICAL SUB-CHARGES & PERIPHERALS ---\n            let canton = \"\";\n            if (qCuriosity === 5) {\n                const cantonTinctures = ['ermine', 'gules', 'sable', 'or'];\n                canton = `, a canton ${cantonTinctures[Math.floor(sWisdom * 4) % cantonTinctures.length]}`;\n            }\n\n            let bordure = \"\";\n            if (qVigilance === 5) {\n                const bordureTincture = primary.metals[0] === 'or' ? 'argent' : 'or';\n                bordure = `, a bordure ${bordureTincture}`;\n            }\n\n            const finalBlazon = `${field}${ordinary}${chargePhrase}${canton}${bordure}`;\n\n            // Segmented dynamic descriptions\n            const fieldExplanation = `The background utilizes \"${field.replace(/,/g, '')}.\" This spatial structure forms the base layer balancing your dominant alignment of ${primary.name.toUpperCase()} with adjacent cognitive paths.`;\n            const ordinaryExplanation = ordinary \n                ? `A structural \"${ordinaryName}\" ordinary featuring a ${ordinaryLine ? ordinaryLine : 'flat'} margin cuts cleanly across the canvas, representing how you manage boundaries and structural parameters.`\n                : `Your traits bypass standard split geometric separators, choosing instead to focus all visual energy onto the core charges.`;\n            const chargeExplanation = `The shield's focal point features ${chargeQuantity} ${chargeType}${attitude} in ${chargeMetal}, expressing the direct translation of your values into actions.`;\n\n            return {\n                title: `Crest of ${primary.name} and ${secondary.name}`,\n                blazon: finalBlazon.charAt(0).toUpperCase() + finalBlazon.slice(1),\n                tinctureExplanation: fieldExplanation,\n                chargesExplanation: ordinaryExplanation,\n                overallAnalysis: chargeExplanation,\n                scores: {\n                    valour: Math.round(sValour * 100),\n                    wisdom: Math.round(sWisdom * 100),\n                    grace: Math.round(sGrace * 100),\n                    resolve: Math.round(sResolve * 100)\n                }\n            };\n        };\n\n        const generateHistoricalDatabase = () => {\n            const valourQ = [3, 9, 12, 17, 29, 30, 34];\n            const wisdomQ = [0, 6, 11, 15, 18, 28, 32];\n            const graceQ  = [1, 13, 14, 16, 22, 33, 37];\n            const resolveQ = [2, 4, 8, 10, 21, 23, 27, 35, 39];\n\n            return HISTORICAL_PERSONAS.map((p, pIdx) => {\n                const simulatedAnswers = Array(40).fill(3).map((v, qIdx) => {\n                    // Seeded random-like logic based on indices to guarantee stable profiles\n                    const seedVal = (pIdx * 7 + qIdx * 13) % 5;\n                    let baseline = 3;\n\n                    if (p.primary === \"valour\" && valourQ.includes(qIdx)) baseline = 4 + (seedVal % 2);\n                    else if (p.primary === \"wisdom\" && wisdomQ.includes(qIdx)) baseline = 4 + (seedVal % 2);\n                    else if (p.primary === \"grace\" && graceQ.includes(qIdx)) baseline = 4 + (seedVal % 2);\n                    else if (p.primary === \"resolve\" && resolveQ.includes(qIdx)) baseline = 4 + (seedVal % 2);\n\n                    if (p.secondary === \"valour\" && valourQ.includes(qIdx)) baseline = Math.max(baseline, 3 + (seedVal % 2));\n                    else if (p.secondary === \"wisdom\" && wisdomQ.includes(qIdx)) baseline = Math.max(baseline, 3 + (seedVal % 2));\n                    else if (p.secondary === \"grace\" && graceQ.includes(qIdx)) baseline = Math.max(baseline, 3 + (seedVal % 2));\n                    else if (p.secondary === \"resolve\" && resolveQ.includes(qIdx)) baseline = Math.max(baseline, 3 + (seedVal % 2));\n\n                    // Conflicting traits mapped down slightly\n                    if (p.primary === \"valour\" && graceQ.includes(qIdx)) baseline = Math.max(1, baseline - 2);\n                    if (p.primary === \"wisdom\" && valourQ.includes(qIdx)) baseline = Math.max(1, baseline - 1);\n\n                    return Math.max(1, Math.min(5, baseline));\n                });\n\n                const compiled = calculateAlignmentCrest(simulatedAnswers);\n\n                return {\n                    id: `historical-${pIdx}`,\n                    title: `${p.name}, ${p.title}`,\n                    blazon: compiled.blazon,\n                    answers: simulatedAnswers,\n                    tinctureExplanation: compiled.tinctureExplanation,\n                    chargesExplanation: compiled.chargesExplanation,\n                    overallAnalysis: compiled.overallAnalysis,\n                    scores: compiled.scores,\n                    dominant: p.primary\n                };\n            });\n        };\n\n        const SEEDED_ARCHIVES = generateHistoricalDatabase();\n\n        function App() {\n            const [currentMode, setCurrentMode] = useState('create'); \n            const [currentStep, setCurrentStep] = useState('intro'); \n            const [answers, setAnswers] = useState(Array(40).fill(3)); \n            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);\n            const [loading, setLoading] = useState(false);\n            const [loadingStep, setLoadingStep] = useState('');\n            const [generationResult, setGenerationResult] = useState(null);\n            const [chosenEffect, setChosenEffect] = useState('shiny');\n            const [selectedLibraryItem, setSelectedLibraryItem] = useState(SEEDED_ARCHIVES[0]);\n            const [toast, setToast] = useState(null);\n            const [searchTerm, setSearchTerm] = useState('');\n            const [filterTrait, setFilterTrait] = useState('all');\n\n            // Persistent LocalStorage Loader for library records\n            const [libraryData, setLibraryData] = useState(() => {\n                try {\n                    const saved = localStorage.getItem(\"armorial_records_v2\");\n                    return saved ? JSON.parse(saved) : [];\n                } catch (e) {\n                    console.error(\"Local storage read failed:\", e);\n                    return [];\n                }\n            });\n\n            const showToast = (message) => {\n                setToast(message);\n                setTimeout(() => setToast(null), 4000);\n            };\n\n            const generateBlazonFromAnswers = () => {\n                setLoading(true);\n                setLoadingStep(\"Processing alignments through geometric matrices...\");\n                \n                setTimeout(() => {\n                    const localCrest = calculateAlignmentCrest(answers);\n                    setGenerationResult(localCrest);\n                    setCurrentStep('result');\n                    setLoading(false);\n                    showToast(\"\ud83c\udff0 Local Scribe engine has aligned and rendered your crest!\");\n                }, 1200);\n            };\n\n            const handleSaveCurrentCrest = () => {\n                if (!generationResult) return;\n                const payload = {\n                    id: 'custom-' + Date.now(),\n                    title: generationResult.title,\n                    blazon: generationResult.blazon,\n                    answers: [...answers],\n                    tinctureExplanation: generationResult.tinctureExplanation,\n                    chargesExplanation: generationResult.chargesExplanation,\n                    overallAnalysis: generationResult.overallAnalysis,\n                    scores: generationResult.scores,\n                    dominant: 'custom'\n                };\n                const updatedRecords = [payload, ...libraryData];\n                setLibraryData(updatedRecords);\n                localStorage.setItem(\"armorial_records_v2\", JSON.stringify(updatedRecords));\n                showToast(\"\ud83c\udff0 Saved this coat of arms to your Hall of Records!\");\n                setSelectedLibraryItem(payload);\n                setCurrentMode('library');\n            };\n\n            const handleDeleteCrest = (id) => {\n                const filtered = libraryData.filter(item => item.id !== id);\n                setLibraryData(filtered);\n                localStorage.setItem(\"armorial_records_v2\", JSON.stringify(filtered));\n                showToast(\"\ud83d\uddd1\ufe0f Record cleared from archive.\");\n                if (selectedLibraryItem && selectedLibraryItem.id === id) {\n                    setSelectedLibraryItem(SEEDED_ARCHIVES[0]);\n                }\n            };\n\n            const handleCopyBlazon = (blazonText) => {\n                const dummy = document.createElement(\"textarea\");\n                document.body.appendChild(dummy);\n                dummy.value = blazonText;\n                dummy.select();\n                document.execCommand('copy');\n                document.body.removeChild(dummy);\n                showToast(\"\ud83d\udccb Blazon syntax copied! Paste it into Drawshield.\");\n            };\n\n            const handleQuickAutofill = () => {\n                setAnswers(answers.map(() => Math.floor(Math.random() * 5) + 1));\n                setCurrentQuestionIdx(39);\n                showToast(\"\u26a1 Quick-attuned! You are now at the final query.\");\n            };\n\n            const getDrawshieldUrl = (blazon, style = 'shiny') => {\n                return `https://drawshield.net/include/drawshield.php?blazon=${encodeURIComponent(blazon.replace(/[#?;%]/g, ''))}&outputformat=png&size=400&effect=${style}`;\n            };\n\n            const combinedDatabase = useMemo(() => {\n                return [...libraryData, ...SEEDED_ARCHIVES];\n            }, [libraryData]);\n\n            const filteredDatabase = useMemo(() => {\n                return combinedDatabase.filter(item => {\n                    const matchesSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase()) || \n                                          item.blazon.toLowerCase().includes(searchTerm.toLowerCase());\n                    const matchesFilter = filterTrait === 'all' || item.dominant === filterTrait;\n                    return matchesSearch && matchesFilter;\n                });\n            }, [combinedDatabase, searchTerm, filterTrait]);\n\n            return (\n                <div className=\"min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-amber-500 selection:text-slate-950\">\n                    <div className=\"h-2 bg-gradient-to-r from-amber-600 via-yellow-400 to-amber-600 w-full shadow-lg\"><\/div>\n                    \n                    <div className=\"bg-slate-900 border-b border-slate-800 text-xs text-slate-400 px-4 py-2.5 flex justify-between items-center gap-2 flex-wrap\">\n                        <div className=\"flex items-center gap-2\">\n                            <span className=\"w-2 h-2 rounded-full bg-emerald-500 animate-pulse\"><\/span>\n                            <span>Procedural Blazon Engine Active (Dynamic Layer Synthesizer)<\/span>\n                        <\/div>\n                        <div className=\"text-amber-500 medieval-font tracking-wider uppercase text-[10px]\">\n                            Total Records: <strong className=\"text-white\">{combinedDatabase.length} Scrolls<\/strong> Inscribed\n                        <\/div>\n                    <\/div>\n\n                    <header className=\"py-8 px-4 text-center max-w-4xl mx-auto w-full\">\n                        <h1 className=\"text-4xl md:text-5xl font-black medieval-font text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-400 mb-2 drop-shadow-md\">\n                            The Scribe's Armorial\n                        <\/h1>\n                        <p className=\"text-slate-400 max-w-lg mx-auto text-xs md:text-sm\">\n                            An interactive pattern engine mapping the 40 realms of human psyche into majestic coats of arms for DrawShield.net\n                        <\/p>\n                        <nav className=\"mt-6 flex justify-center gap-2 max-w-xs mx-auto bg-slate-900 p-1.5 rounded-xl border border-slate-800 shadow-xl\">\n                            <button onClick={() => { setCurrentMode('create'); setCurrentStep('intro'); }} className={`flex-1 py-2 px-4 rounded-lg text-xs md:text-sm font-medium transition-all duration-200 ${currentMode === 'create' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-slate-200'}`}>\ud83d\udee1\ufe0f Create Crest<\/button>\n                            <button onClick={() => { setCurrentMode('library'); }} className={`flex-1 py-2 px-4 rounded-lg text-xs md:text-sm font-medium transition-all duration-200 ${currentMode === 'library' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-slate-200'}`}>\ud83d\udcd6 Hall of Records<\/button>\n                        <\/nav>\n                    <\/header>\n\n                    <main className=\"flex-grow max-w-6xl w-full mx-auto px-4 pb-16\">\n                        {loading && (\n                            <div className=\"fixed inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center p-6 backdrop-blur-sm\">\n                                <div className=\"w-16 h-16 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4\"><\/div>\n                                <h3 className=\"text-xl medieval-font text-amber-400 animate-pulse text-center\">{loadingStep}<\/h3>\n                            <\/div>\n                        )}\n\n                        {/* MODE A: CREATION MODE */}\n                        {currentMode === 'create' && (\n                            <div>\n                                {currentStep === 'intro' && (\n                                    <div className=\"bg-slate-900/60 border border-slate-800 p-8 rounded-2xl max-w-2xl mx-auto text-center shadow-xl backdrop-blur\">\n                                        <span className=\"text-5xl mb-4 block\">\ud83d\udd2e<\/span>\n                                        <h2 className=\"text-2xl medieval-font font-bold text-amber-400 mb-4\">Forge Your Heraldic Alignment<\/h2>\n                                        <p className=\"text-slate-300 text-sm leading-relaxed mb-6 font-sans\">\n                                            Embark on a forty-tier psychological test designed to align your intrinsic traits with classic heraldic structures. Our machine pattern engine matches your virtues, social mechanics, and environmental preferences with medieval shield divisions.\n                                        <\/p>\n                                        <button onClick={() => setCurrentStep('quiz')} className=\"bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-bold px-8 py-3.5 rounded-xl text-sm hover:brightness-110 shadow-lg shadow-amber-500/10\">Begin Attunement<\/button>\n                                    <\/div>\n                                )}\n\n                                {currentStep === 'quiz' && (\n                                    <div className=\"bg-slate-900 border border-slate-800 p-6 md:p-10 rounded-2xl max-w-3xl mx-auto shadow-2xl relative overflow-hidden\">\n                                        <div className=\"flex justify-between items-center mb-6\">\n                                            <button onClick={handleQuickAutofill} className=\"text-[10px] bg-slate-800 hover:bg-slate-700 border border-slate-700/60 text-amber-400 px-3 py-1.5 rounded transition-colors font-mono\">\u26a1 Fast Skip<\/button>\n                                            <span className=\"text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-0.5 rounded-full font-mono\">Query {currentQuestionIdx + 1} of 40<\/span>\n                                        <\/div>\n                                        \n                                        <div className=\"w-full bg-slate-950 rounded-full h-1.5 mb-8 border border-slate-800 overflow-hidden\">\n                                            <div className=\"bg-gradient-to-r from-amber-600 to-yellow-400 h-1.5 transition-all duration-300\" style={{ width: `${((currentQuestionIdx + 1) / 40) * 100}%` }}><\/div>\n                                        <\/div>\n\n                                        <div className=\"min-h-[120px] bg-slate-950/40 p-6 rounded-xl border border-slate-800/40 mb-8 flex items-center justify-center text-center text-lg font-serif italic text-slate-200 leading-relaxed\">\n                                            \"{QUESTIONS[currentQuestionIdx]}\"\n                                        <\/div>\n                                        \n                                        <div className=\"grid grid-cols-1 sm:grid-cols-5 gap-3 mb-8\">\n                                            {[\n                                                { val: 1, label: \"Strongly Disagree\" },\n                                                { val: 2, label: \"Disagree\" },\n                                                { val: 3, label: \"Neutral / Unsure\" },\n                                                { val: 4, label: \"Agree\" },\n                                                { val: 5, label: \"Strongly Agree\" }\n                                            ].map((opt) => (\n                                                <button \n                                                    key={opt.val} \n                                                    onClick={() => { \n                                                        const u = [...answers]; \n                                                        u[currentQuestionIdx] = opt.val; \n                                                        setAnswers(u); \n                                                    }} \n                                                    className={`p-3 rounded-xl border font-bold text-center flex flex-col justify-center items-center transition-all ${\n                                                        answers[currentQuestionIdx] === opt.val \n                                                            ? 'bg-amber-500 border-amber-400 text-slate-950 scale-105 shadow-md shadow-amber-500/20' \n                                                            : 'bg-slate-950 border-slate-800 hover:border-slate-700 text-slate-400'\n                                                    }`}\n                                                >\n                                                    <span className=\"text-lg mb-0.5 font-mono\">{opt.val}<\/span>\n                                                    <span className=\"text-[9px] leading-tight opacity-85 font-sans\">{opt.label}<\/span>\n                                                <\/button>\n                                            ))}\n                                        <\/div>\n                                        <div className=\"flex justify-between items-center font-sans\">\n                                            <button disabled={currentQuestionIdx === 0} onClick={() => setCurrentQuestionIdx(p => p - 1)} className=\"px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700/60 rounded disabled:opacity-30\">\u2190 Previous<\/button>\n                                            {currentQuestionIdx < 39 ? (\n                                                <button onClick={() => setCurrentQuestionIdx(p => p + 1)} className=\"px-6 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded\">Next \u2192<\/button>\n                                            ) : (\n                                                <button onClick={generateBlazonFromAnswers} className=\"px-6 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black rounded animate-pulse\">\u2694\ufe0f Forge Shield<\/button>\n                                            )}\n                                        <\/div>\n                                    <\/div>\n                                )}\n\n                                {currentStep === 'result' && generationResult && (\n                                    <div className=\"bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl max-w-4xl mx-auto shadow-2xl relative\">\n                                        <div className=\"text-center mb-6\">\n                                            <span className=\"text-xs uppercase tracking-widest text-amber-500 font-mono\">Attunement Complete<\/span>\n                                            <h2 className=\"text-2xl md:text-3xl font-bold medieval-font text-slate-100\">{generationResult.title}<\/h2>\n                                        <\/div>\n                                        \n                                        <div className=\"grid grid-cols-1 md:grid-cols-2 gap-8 items-start font-sans\">\n                                            <div className=\"bg-slate-950 p-6 rounded-xl border border-slate-800/80 flex flex-col items-center\">\n                                                <div className=\"w-full max-w-[260px] aspect-square relative rounded-xl overflow-hidden bg-slate-900 flex items-center justify-center border border-slate-800\">\n                                                    <img \n                                                        src={getDrawshieldUrl(generationResult.blazon, chosenEffect)} \n                                                        className=\"w-full h-full object-contain p-2\" \n                                                        alt=\"Rendered Crest\"\n                                                        onError={(e) => {\n                                                            e.target.onerror = null;\n                                                            e.target.src = `https://placehold.co/400x400/18181b/ffffff?text=Generating+Shield+...`;\n                                                        }}\n                                                    />\n                                                <\/div>\n                                                <div className=\"mt-6 w-full\">\n                                                    <label className=\"text-[10px] text-slate-500 font-mono uppercase tracking-widest block mb-2 text-center\">Visual Rendering Aesthetic<\/label>\n                                                    <div className=\"grid grid-cols-2 gap-1.5 font-sans\">\n                                                        {PALETTE_EFFECTS.map((eff) => (\n                                                            <button\n                                                                key={eff.id}\n                                                                onClick={() => setChosenEffect(eff.id)}\n                                                                className={`py-1.5 px-2 rounded text-[10px] transition-colors border ${\n                                                                    chosenEffect === eff.id\n                                                                        ? 'bg-amber-500/10 border-amber-400 text-amber-300'\n                                                                        : 'bg-slate-900/60 border-transparent text-slate-400 hover:text-slate-200'\n                                                                }`}\n                                                            >\n                                                                {eff.name}\n                                                            <\/button>\n                                                        ))}\n                                                    <\/div>\n                                                <\/div>\n                                            <\/div>\n\n                                            <div className=\"space-y-4\">\n                                                <div className=\"bg-slate-950 p-4 rounded-xl border border-slate-800 font-sans\">\n                                                    <label className=\"text-[10px] text-slate-500 font-mono block mb-1\">Drawshield Blazon Code<\/label>\n                                                    <p className=\"text-amber-300 font-mono text-xs break-all leading-relaxed p-2.5 bg-slate-900 rounded border border-slate-800/50 mb-3 select-all\">{generationResult.blazon}<\/p>\n                                                    <div className=\"flex flex-wrap gap-2\">\n                                                        <button onClick={() => handleCopyBlazon(generationResult.blazon)} className=\"flex-1 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded-lg transition-colors flex items-center justify-center gap-1.5 font-sans\">\ud83d\udccb Copy Code<\/button>\n                                                        <button onClick={handleSaveCurrentCrest} className=\"flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-lg transition-colors flex items-center justify-center gap-1.5 font-sans\">\ud83d\udcbe Save to Archives<\/button>\n                                                    <\/div>\n                                                <\/div>\n\n                                                <div className=\"space-y-3 text-sm font-sans\">\n                                                    <div className=\"border-l-2 border-amber-500/40 pl-3\">\n                                                        <h4 className=\"medieval-font font-bold text-slate-300 text-xs uppercase tracking-wider mb-0.5\">Background Structure<\/h4>\n                                                        <p className=\"text-slate-400 text-xs leading-relaxed\">{generationResult.tinctureExplanation}<\/p>\n                                                    <\/div>\n                                                    <div className=\"border-l-2 border-amber-500/40 pl-3\">\n                                                        <h4 className=\"medieval-font font-bold text-slate-300 text-xs uppercase tracking-wider mb-0.5\">Partition & Boundary Borders<\/h4>\n                                                        <p className=\"text-slate-400 text-xs leading-relaxed\">{generationResult.chargesExplanation}<\/p>\n                                                    <\/div>\n                                                    <div className=\"border-l-2 border-amber-500/40 pl-3\">\n                                                        <h4 className=\"medieval-font font-bold text-slate-300 text-xs uppercase tracking-wider mb-0.5\">Central Charge Element<\/h4>\n                                                        <p className=\"text-slate-400 text-xs leading-relaxed\">{generationResult.overallAnalysis}<\/p>\n                                                    <\/div>\n                                                <\/div>\n                                            <\/div>\n                                        <\/div>\n\n                                        <div className=\"mt-8 pt-6 border-t border-slate-800 flex justify-center font-sans\">\n                                            <button onClick={() => { setAnswers(Array(40).fill(3)); setCurrentQuestionIdx(0); setCurrentStep('quiz'); }} className=\"py-2 px-5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700/60 transition-colors\">\ud83d\udd04 Restart Attunement<\/button>\n                                        <\/div>\n                                    <\/div>\n                                )}\n                            <\/div>\n                        )}\n\n                        {/* MODE B: HALL OF RECORDS (EXTENDED LIBRARY) */}\n                        {currentMode === 'library' && (\n                            <div className=\"grid grid-cols-1 lg:grid-cols-12 gap-8 font-sans\">\n                                \n                                {/* LEFT PANEL: BROWSER, FILTER & SEARCH */}\n                                <div className=\"lg:col-span-5 space-y-4\">\n                                    <div className=\"bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-md\">\n                                        <h3 className=\"text-sm font-semibold text-slate-200 mb-3 uppercase tracking-wider medieval-font\">Record Filters<\/h3>\n                                        <div className=\"relative mb-3\">\n                                            <input \n                                                type=\"text\" \n                                                value={searchTerm}\n                                                onChange={(e) => setSearchTerm(e.target.value)}\n                                                placeholder=\"Search scrolls by title or blazon...\"\n                                                className=\"w-full bg-slate-950 border border-slate-800 focus:border-amber-500/50 rounded-lg p-2.5 text-xs text-slate-200 placeholder:text-slate-600 font-sans\"\n                                            />\n                                            {searchTerm && (\n                                                <button onClick={() => setSearchTerm('')} className=\"absolute right-3 top-2.5 text-xs text-slate-500 hover:text-slate-200\">\u2715<\/button>\n                                            )}\n                                        <\/div>\n                                        \n                                        <div className=\"flex flex-wrap gap-1\">\n                                            {[\n                                                { id: 'all', label: 'All Scrolls' },\n                                                { id: 'valour', label: '\ud83d\udd25 Valour' },\n                                                { id: 'wisdom', label: '\ud83c\udf0a Wisdom' },\n                                                { id: 'grace', label: '\ud83c\udf3f Grace' },\n                                                { id: 'resolve', label: '\ud83d\udee1\ufe0f Resolve' },\n                                                { id: 'custom', label: '\u2728 Saved' }\n                                            ].map(t => (\n                                                <button\n                                                    key={t.id}\n                                                    onClick={() => setFilterTrait(t.id)}\n                                                    className={`py-1 px-2.5 rounded-md text-[10px] font-semibold transition-colors ${\n                                                        filterTrait === t.id \n                                                            ? 'bg-amber-500 text-slate-950' \n                                                            : 'bg-slate-950 text-slate-400 hover:text-slate-200 border border-slate-800'\n                                                    }`}\n                                                >\n                                                    {t.label}\n                                                <\/button>\n                                            ))}\n                                        <\/div>\n                                    <\/div>\n\n                                    {/* SCROLL CARDS GRID */}\n                                    <div className=\"max-h-[580px] overflow-y-auto space-y-2 pr-2 scrollbar-thin scrollbar-thumb-slate-800\">\n                                        {filteredDatabase.length > 0 ? (\n                                            filteredDatabase.map(item => {\n                                                const isSelected = selectedLibraryItem && selectedLibraryItem.id === item.id;\n                                                return (\n                                                    <div \n                                                        key={item.id}\n                                                        onClick={() => setSelectedLibraryItem(item)}\n                                                        className={`p-3 rounded-xl border cursor-pointer transition-all flex items-center gap-3 relative overflow-hidden group ${\n                                                            isSelected \n                                                                ? 'bg-slate-900 border-amber-500 shadow-md shadow-amber-500/5' \n                                                                : 'bg-slate-900/40 border-slate-800/80 hover:border-slate-700 hover:bg-slate-900/60'\n                                                        }`}\n                                                    >\n                                                        <div className=\"w-10 h-10 bg-slate-950 rounded border border-slate-800 flex-shrink-0 flex items-center justify-center p-0.5 group-hover:border-amber-500/20\">\n                                                            <img \n                                                                src={getDrawshieldUrl(item.blazon, 'shiny')} \n                                                                className=\"w-full h-full object-contain\" \n                                                                alt={item.title}\n                                                                onError={(e) => {\n                                                                    e.target.onerror = null;\n                                                                    e.target.src = `https://placehold.co/100x100/18181b/ffffff?text=Shield`;\n                                                                }}\n                                                            />\n                                                        <\/div>\n                                                        <div className=\"min-w-0 flex-1\">\n                                                            <h4 className={`text-xs font-bold truncate transition-colors ${isSelected ? 'text-amber-400' : 'text-slate-200 group-hover:text-amber-500'}`}>\n                                                                {item.title}\n                                                            <\/h4>\n                                                            <p className=\"text-[9px] font-mono text-slate-500 truncate mt-0.5\">{item.blazon}<\/p>\n                                                        <\/div>\n                                                        <span className={`text-[8px] uppercase tracking-wider font-mono font-bold px-1.5 py-0.5 rounded ${\n                                                            item.dominant === 'valour' ? 'bg-red-950 text-red-400 border border-red-900/25' :\n                                                            item.dominant === 'wisdom' ? 'bg-sky-950 text-sky-400 border border-sky-900/25' :\n                                                            item.dominant === 'grace' ? 'bg-emerald-950 text-emerald-400 border border-emerald-900/25' :\n                                                            item.dominant === 'resolve' ? 'bg-slate-950 text-slate-400 border border-slate-800' :\n                                                            'bg-amber-950 text-amber-400 border border-amber-900/25'\n                                                        }`}>\n                                                            {item.dominant}\n                                                        <\/span>\n                                                    <\/div>\n                                                );\n                                            })\n                                        ) : (\n                                            <div className=\"p-8 text-center text-slate-600 text-xs font-serif italic border border-dashed border-slate-900 rounded-xl\">\n                                                No historical scrolls match your criteria.\n                                            <\/div>\n                                        )}\n                                    <\/div>\n                                <\/div>\n\n                                {/* RIGHT PANEL: SELECTED ITEM ANALYSIS */}\n                                <div className=\"lg:col-span-7\">\n                                    {selectedLibraryItem ? (\n                                        <div className=\"bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl space-y-6\">\n                                            \n                                            {/* HEADER METRICS */}\n                                            <div className=\"flex justify-between items-start border-b border-slate-800 pb-4 flex-wrap gap-2\">\n                                                <div>\n                                                    <span className=\"text-[10px] font-mono text-amber-500 uppercase tracking-widest block font-sans\">Historical Armory Register<\/span>\n                                                    <h3 className=\"text-xl font-bold medieval-font text-slate-100\">{selectedLibraryItem.title}<\/h3>\n                                                <\/div>\n                                                {selectedLibraryItem.dominant === 'custom' && (\n                                                    <button \n                                                        onClick={() => handleDeleteCrest(selectedLibraryItem.id)}\n                                                        className=\"py-1 px-2.5 bg-red-950/40 border border-red-900/40 hover:bg-red-900 hover:text-white text-red-400 text-[10px] rounded font-bold transition-all\"\n                                                    >\n                                                        Clear Saved Record\n                                                    <\/button>\n                                                )}\n                                            <\/div>\n\n                                            {/* PREVIEW IMAGE & BLAZON */}\n                                            <div className=\"grid grid-cols-1 md:grid-cols-2 gap-6 items-start\">\n                                                <div className=\"bg-slate-950 p-4 rounded-xl border border-slate-800/80 flex flex-col items-center\">\n                                                    <div className=\"w-full max-w-[180px] aspect-square relative rounded-xl overflow-hidden bg-slate-900 flex items-center justify-center border border-slate-800\">\n                                                        <img \n                                                            src={getDrawshieldUrl(selectedLibraryItem.blazon, chosenEffect)} \n                                                            className=\"w-full h-full object-contain p-2\" \n                                                            alt={selectedLibraryItem.title}\n                                                        />\n                                                    <\/div>\n                                                    <div className=\"mt-4 w-full\">\n                                                        <div className=\"grid grid-cols-3 gap-1\">\n                                                            {['shiny', 'stone', 'vellum'].map((eff) => (\n                                                                <button\n                                                                    key={eff}\n                                                                    onClick={() => setChosenEffect(eff)}\n                                                                    className={`py-1 rounded text-[9px] capitalize font-medium border ${\n                                                                        chosenEffect === eff\n                                                                            ? 'bg-amber-500/10 border-amber-400 text-amber-300'\n                                                                            : 'bg-slate-900/60 border-transparent text-slate-500 hover:text-slate-300'\n                                                                    }`}\n                                                                >\n                                                                    {eff}\n                                                                <\/button>\n                                                            ))}\n                                                        <\/div>\n                                                    <\/div>\n                                                <\/div>\n\n                                                <div className=\"space-y-3\">\n                                                    <div className=\"bg-slate-950 p-3 rounded-lg border border-slate-800 font-sans\">\n                                                        <label className=\"text-[10px] text-slate-500 font-mono block mb-1\">Blazon Syntax<\/label>\n                                                        <p className=\"text-amber-300 font-mono text-[11px] break-all mb-2 leading-relaxed select-all\">{selectedLibraryItem.blazon}<\/p>\n                                                        <button \n                                                            onClick={() => handleCopyBlazon(selectedLibraryItem.blazon)} \n                                                            className=\"w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] rounded font-bold border border-slate-700/60 transition-colors\"\n                                                        >\n                                                            \ud83d\udccb Copy Blazon Syntax\n                                                        <\/button>\n                                                    <\/div>\n                                                    \n                                                    {/* SCORE BOARD */}\n                                                    {selectedLibraryItem.scores && (\n                                                        <div className=\"bg-slate-950/60 border border-slate-800/60 p-3 rounded-lg space-y-2\">\n                                                            <h4 className=\"text-[10px] uppercase font-mono text-slate-400 mb-1\">Psychological Dimensions<\/h4>\n                                                            \n                                                            {[\n                                                                { key: 'valour', label: '\ud83d\udd25 Valour & Command', color: 'bg-red-500' },\n                                                                { key: 'wisdom', label: '\ud83c\udf0a Wisdom & Systemics', color: 'bg-sky-500' },\n                                                                { key: 'grace', label: '\ud83c\udf3f Grace & Connection', color: 'bg-emerald-500' },\n                                                                { key: 'resolve', label: '\ud83d\udee1\ufe0f Resolve & Guard', color: 'bg-slate-400' }\n                                                            ].map(score => (\n                                                                <div key={score.key} className=\"text-[10px]\">\n                                                                    <div className=\"flex justify-between text-slate-400 font-mono mb-0.5\">\n                                                                        <span>{score.label}<\/span>\n                                                                        <span>{selectedLibraryItem.scores[score.key]}%<\/span>\n                                                                    <\/div>\n                                                                    <div className=\"w-full bg-slate-900 h-1 rounded-full overflow-hidden border border-slate-800/40\">\n                                                                        <div className={`${score.color} h-1 transition-all duration-300`} style={{ width: `${selectedLibraryItem.scores[score.key]}%` }}><\/div>\n                                                                    <\/div>\n                                                                <\/div>\n                                                            ))}\n                                                        <\/div>\n                                                    )}\n                                                <\/div>\n                                            <\/div>\n\n                                            {/* SEGMENTED LOGIC EXPLANATIONS */}\n                                            <div className=\"space-y-3.5 border-t border-slate-800 pt-4 font-sans text-xs\">\n                                                <div className=\"border-l-2 border-amber-500/40 pl-3\">\n                                                    <h4 className=\"medieval-font font-bold text-slate-300 text-[10px] uppercase tracking-wider mb-0.5\">Field Layout Pattern<\/h4>\n                                                    <p className=\"text-slate-400 leading-relaxed text-[11px]\">{selectedLibraryItem.tinctureExplanation}<\/p>\n                                                <\/div>\n                                                <div className=\"border-l-2 border-amber-500/40 pl-3\">\n                                                    <h4 className=\"medieval-font font-bold text-slate-300 text-[10px] uppercase tracking-wider mb-0.5\">Boundary Separation<\/h4>\n                                                    <p className=\"text-slate-400 leading-relaxed text-[11px]\">{selectedLibraryItem.chargesExplanation}<\/p>\n                                                <\/div>\n                                                <div className=\"border-l-2 border-amber-500/40 pl-3\">\n                                                    <h4 className=\"medieval-font font-bold text-slate-300 text-[10px] uppercase tracking-wider mb-0.5\">Primary Charge Symbol<\/h4>\n                                                    <p className=\"text-slate-400 leading-relaxed text-[11px]\">{selectedLibraryItem.overallAnalysis}<\/p>\n                                                <\/div>\n                                            <\/div>\n\n                                        <\/div>\n                                    ) : (\n                                        <div className=\"h-full flex items-center justify-center p-8 text-center text-slate-500 text-sm font-serif italic border border-dashed border-slate-800 rounded-2xl bg-slate-900/20\">\n                                            Select a historical scroll from the catalog to inspect its full character alignment parameters.\n                                        <\/div>\n                                    )}\n                                <\/div>\n\n                            <\/div>\n                        )}\n                    <\/main>\n\n                    <footer className=\"mt-auto py-8 bg-slate-950 border-t border-slate-900 text-center text-slate-600 text-xs\">\n                        <div className=\"max-w-4xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4 font-sans\">\n                            <p>\u00a9 2026 Scribe's Armorial. Compatible with DrawShield blazon parsers.<\/p>\n                            <div className=\"flex gap-4\">\n                                <a href=\"https://drawshield.net/\" target=\"_blank\" rel=\"noreferrer\" className=\"hover:text-amber-500 transition-colors\">Drawshield Website<\/a>\n                                <span className=\"text-slate-800\">|<\/span>\n                                <span className=\"text-slate-500\">Procedural Matrix Compilation<\/span>\n                            <\/div>\n                        <\/div>\n                    <\/footer>\n                <\/div>\n            );\n        }\n\n        const root = ReactDOM.createRoot(document.getElementById('root'));\n        root.render(<App />);\n    <\/script>\n<\/body>\n<\/html>"};

        function showPage(pageId) {
            document.getElementById('home-view').style.display = 'none';
            const container = document.getElementById(pageId);
            container.style.display = 'flex';
            
            // Dynamically inject the HTML to start the context
            const iframe = container.querySelector('iframe');
            iframe.srcdoc = pageData[pageId];
            
            window.scrollTo(0, 0);
        }

        function goHome(pageId) {
            const container = document.getElementById(pageId);
            container.style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            
            // Wipe the iframe to destroy the WebGL context and free memory
            const iframe = container.querySelector('iframe');
            iframe.srcdoc = '';
        }
    </script>
